name: Site

# The whole public build on a clean Linux runner, from the clone plus the two
# inputs fetched by checksum (HANDOFF-PORTABILITY.md, test 1), the mirror
# bundle, and test 3 (no outside calls) at / and at a test base path. The
# repo is private, so its minutes are John's money (about 17 minutes a run).
# John, 2026-11-23: "Yes, on PRs". So it runs on a pull request to main that
# is not a draft (opened, new commits, reopened, marked ready), by hand from
# the Actions tab, and on any pull request when someone adds the label
# "build-site". Never on a plain branch push, and never for a draft's pushes.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

env:
  # The deploy's own settings (the build recipe in HANDOFF-PORTABILITY.md).
  PUBLIC_SITE_ORIGIN: https://greekdrama.johnhboyer.com
  DRAMA_EDITIONS: "1"
  PUBLIC_EDITIONS: "1"

jobs:
  site:
    name: site
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled' && github.event.label.name == 'build-site')
      || (github.event.action != 'labeled' && github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft)
    # On the job, not the workflow: a skipped run (a draft's push, another
    # label) then cancels nothing; a newer run of the build cancels an older.
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pipeline/.python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # build-public.mjs runs pipeline/.venv/bin/python, which uv sync makes.
      - name: Install dependencies
        run: |
          (cd pipeline && uv sync)
          (cd app && npm ci)

      # 186 MB from Diogenes's own release; the archive and each file in it
      # are held to the sha256 pins in pipeline/drama_pipeline/inputs.py.
      - name: Fetch the Morpheus table and the LSJ
        run: |
          echo "DIOGENES_DATA=$RUNNER_TEMP/diogenes-data" >> "$GITHUB_ENV"
          cd pipeline && uv run python -m drama_pipeline.inputs fetch --dir "$RUNNER_TEMP/diogenes-data"

      # Test 1: every play from corpus/greek/, every edition, the corpus-wide
      # stages, the gates, the app build, and the link check. No Diogenes, no
      # TLG, no Mac path.
      - name: Build the site (test 1)
        run: npm run build:public

      # The mirror bundle: the data gates, the host's own files left out
      # (feedback-endpoint.json), packed and read back against SHA256SUMS.
      - name: Pack the bundle
        run: node scripts/make-bundle.mjs --out="$RUNNER_TEMP/greek-plays-bundle.tar.gz"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: greek-plays-bundle
          path: ${{ runner.temp }}/greek-plays-bundle.tar.gz
          if-no-files-found: error
          retention-days: 3

      # Test 3 on the bundle as a mirror would serve it. Playwright is this
      # step's tool and no package of the repo; nothing of it ships.
      - name: No outside calls, the bundle at /
        run: |
          npx --yes playwright@1.65.1 install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/site" && tar -xzf "$RUNNER_TEMP/greek-plays-bundle.tar.gz" -C "$RUNNER_TEMP/site"
          node scripts/check-no-outside-calls.mjs --dist="$RUNNER_TEMP/site"

      # A test base path: the app rebuilt under /mirror/ for another origin
      # over the same data; its link check must find nothing broken, the same
      # folder checked as if at / must fail, and test 3 runs there too.
      - name: The site under a base path
        env:
          SITE_BASE: /mirror/
          PUBLIC_SITE_ORIGIN: https://mirror.example.org
        run: |
          (cd app && PUBLIC_SHOW_PRIVATE=0 npm run build)
          node scripts/check-links.mjs app/dist
          if SITE_BASE=/ node scripts/check-links.mjs app/dist > "$RUNNER_TEMP/at-root.txt"; then
            echo "the /mirror/ build passed the link check as if at /: the check cannot see the base" >&2; exit 1
          fi
          tail -3 "$RUNNER_TEMP/at-root.txt"
          rm -rf app/dist/data/lsj app/dist/data/ls
          grep -o '<link rel="canonical"[^>]*>' app/dist/read/euripides/medea/index.html || true
          cat app/dist/robots.txt
          node scripts/check-no-outside-calls.mjs --dist=app/dist
