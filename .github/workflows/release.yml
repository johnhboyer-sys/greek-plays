name: Release

# A deploy is marked by a tag, deploy/<date> (`npm run deploy:cloudflare`
# pushes it once the deploy has succeeded). This builds that commit's mirror
# bundle from a clean checkout and attaches it, with its SHA256SUMS, to a
# release named after the tag. Mirrors and the stale check read the release.
# HANDOFF-PORTABILITY.md, phase 3. While the repo is private the release is
# private; once it is public, every release is public, with every source
# under its own terms (NonCommercial and NoDerivatives ones among them).
on:
  push:
    tags:
      - 'deploy/*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name the bundle
        run: echo "BUNDLE=$RUNNER_TEMP/greek-plays-${GITHUB_REF_NAME//\//-}.tar.gz" >> "$GITHUB_ENV"

      # Each play's manifest names the commit and day it was built from
      # (corpus_version). Build the release with the version live names, so
      # its data is byte for byte what the site serves, on whatever day this
      # runs; and stop if live was not built from this commit (Grok's read of
      # #19: a rerun on a later day stamped another date and failed).
      - name: The data version live names
        run: |
          version=$(curl -fsS https://greekdrama.johnhboyer.com/data/agamemnon/manifest.json \
            | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).corpus_version ?? "")))')
          sha=${version%%-*}
          if [ -z "$sha" ] || [ "${GITHUB_SHA#"$sha"}" = "$GITHUB_SHA" ]; then
            echo "::error::live names corpus_version '$version', not built from $GITHUB_SHA"; exit 1
          fi
          echo "CORPUS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the site and pack the bundle
        uses: ./.github/actions/site-bundle
        with:
          out: ${{ env.BUNDLE }}

      # The tag says this commit is what the primary serves, and the deploy
      # script cannot know that app/dist was built from it. Hold the tag to
      # its word: every data file of the bundle is asked of the primary,
      # which serves the plays' data itself, under /data/ (--base; Grok's
      # read of #19: without it every file was asked for at the root). (The pages cannot be held the same way: a build's page
      # bytes vary.) A file changed by the deploy can be up to ten minutes
      # stale at the host's cache; this step runs later than that, and a
      # failed run can be run again, for no release exists yet.
      - name: The bundle's data is what the primary serves
        run: |
          tar -xzf "$BUNDLE" -C "$RUNNER_TEMP" ./SHA256SUMS
          node scripts/check-served.mjs --origin=https://greekdrama.johnhboyer.com --base=/data/ --sums="$RUNNER_TEMP/SHA256SUMS" --part=data

      # SHA256SUMS names every file in the bundle; it is attached beside the
      # bundle so a mirror can be checked against it without a download of
      # about 105 MB. A release that exists is never written over: a second run for
      # one tag fails here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(wc -l < "$RUNNER_TEMP/SHA256SUMS" | tr -d ' ')
          sum=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          printf '%s\n' \
            "The site as deployed at \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA), built from a clean checkout." \
            "" \
            "\`$(basename "$BUNDLE")\` unpacks to a folder any static host can serve; \`SHA256SUMS\` names its $files files. \`RESTORE.md\` has the steps." \
            "" \
            "sha256 of the bundle: \`$sum\`" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$BUNDLE" "$RUNNER_TEMP/SHA256SUMS" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
