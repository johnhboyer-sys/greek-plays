      Gregory Nagy (kosmossociety.org/text-library; Herakles at
      chs.harvard.edu/primary-source/euripides-herakles): 13 tragedies,
      translations by Smyth, Jebb, Coleridge, Buckley, Potter and Jim Erdman
      as revised by the Sourcebook's editors and teams (pages revised through
      2021-2023; every translator and reviser is credited in the slot name,
      sources/INVENTORY.md and the attribution page). Nagy's statement:
      "All the translations in this online Sourcebook are free from copyright
      restrictions. That is because the translations belong either to me or
      to other authors who have waived copyright or to authors who died in a
      time that precedes any further application of copyright." Each text is
      also marked "Published under a Creative Commons License 3.0" (variant
      unstated). Owner ruling 2026-09-12: public domain, any Creative Commons
      licence, or never renewed may be used, honouring each licence's
      conditions (credit every translator and reviser; if share-alike,
      derived data carries the same licence).
    sources:
      - bench/kosmos/*.txt
  - id: johnston
    translator: "Ian Johnston"
    year: 2002
    note: >-
