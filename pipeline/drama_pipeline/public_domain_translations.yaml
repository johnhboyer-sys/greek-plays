      johnstonia pages (web.viu.ca/johnstoi/; Bacchae from the Wayback copy of
      his johnstoniatexts.x10host.com mirror), revised 2002-2020. Not public
      domain; his own terms, web.viu.ca/johnstoi/copyright.htm: "All general
      readers, teachers, students, and performing artists may download any
      material on johnstonia web pages without permission and without charge,
      provided they do not use the material in a commercial publication. They
      may edit the material to suit their purposes and distribute the texts in
      printed or electronic form to their friends and students." Owner ruling
      2026-09-12: a translation whose terms allow reproduction may be used,
      honouring the terms (a free, non-commercial site) and crediting the
      translator.
    sources:
      - bench/johnston/*.txt

