  production: "Lenaia, 424 BC · first prize"
  argument: "Two slaves of Demos find a sausage-seller vulgar enough to out-demagogue the Paphlagonian."
  synopsis: "Demos, the Athenian people, has a new slave, the Paphlagonian, who flatters him and bullies the household. Two other slaves find an oracle: the Paphlagonian is to be overthrown by a sausage-seller. They find one and set him on. The contest, before the Council and then before Demos himself, is in shamelessness, bribery, and oracle-mongering, and the sausage-seller wins it. He boils Demos young again, and the Paphlagonian is sent to sell tripe at the gates."
