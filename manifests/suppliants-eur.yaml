      # page 190, leaf n214, build/sweeps/scans/coleridge-1891-v1-n214.jpg)
      # reads "Is this thy own private resolve".
      - find: "this thy own private resolve"
        replace: "Is this thy own private resolve"
        note: "S11 row 1097: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:252; archive.org playseuripides01colegoog p. 190"
      - find: "Full οft"
        replace: "Full oft"
        note: "sweep 2026-09-24 n=69: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:369"
      - find: "to2 know"
        replace: "to know"
        note: "sweep 2026-09-24 n=68: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:370"
      - find: "that1 good"
        replace: "that good"
        note: "sweep 2026-09-24 n=67: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:369"
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg008.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
