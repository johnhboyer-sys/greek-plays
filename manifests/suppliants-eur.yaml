  synopsis: "The Seven who marched against Thebes lie dead outside its walls, and Thebes will not give up the bodies. Their mothers come to Eleusis as suppliants, with Adrastus, the king of Argos who led the failed expedition, and ask Theseus to make Thebes yield the dead. Theseus refuses, then listens to his mother Aethra and changes his mind. A Theban herald warns Athens off; Theseus marches, wins, and brings the bodies back for burial. Evadne, wife of one of the Seven, throws herself onto her husband's pyre. Athena binds Argos to Athens by oath."

