english:
  primary:
    id: coleridge
    text_fixes:
      # S11 sweep row 1097 (2026-09-25): the TEI drops Theseus's first word
      # at 129; Coleridge's 1891 print (archive.org playseuripides01colegoog,
      # page 190, leaf n214, build/sweeps/scans/coleridge-1891-v1-n214.jpg)
      # reads "Is this thy own private resolve".
      - find: "this thy own private resolve"
        replace: "Is this thy own private resolve"
        note: "S11 row 1097: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:252; archive.org playseuripides01colegoog p. 190"
      - find: "Full οft"
        replace: "Full oft"
        note: "sweep 2026-09-24 n=69: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:369"
      - find: "to2 know"
        replace: "to know"
        note: "sweep 2026-09-24 n=68: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:370"
      - find: "that1 good"
        replace: "that good"
        note: "sweep 2026-09-24 n=67: sources/perseus/tlg0006.tlg008.perseus-eng2.xml:369"
    line_fixes:
      # Speaker-repair sweep (2026-09-28; Grok agreed; John: "do it"):
      # Coleridge numbers this lament one line late. His 1152 translates 1151
      # and his 1154 translates 1153; left alone, the speaker heuristic moved
      # each a further line away.
      "1152": "1151"  # τοῦ φθιμένου πατρὸς ἐκδικαστάν — To avenge thy fallen sire
      "1154": "1153"  # φίλαν φίλημα παρὰ γένυν τιθέντα σοί — Printing a loving kiss upon thy cheek
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg008.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "41", by: "1" }
      - { greek: "632", by: "628" }
  secondary:
    id: way
    text_fixes:
      - find: "\n\n. Thy moan"
        replace: "\n\nThy moan"
        note: "way-cleanup 2026-09-25 row 700 (S11 confirmed): stray full stop after the CHORUS cue"
      - find: "*Twas ever pitiful, and hath in thee"
        replace: "’Twas ever pitiful, and hath in thee"
        note: "way-cleanup r3 2026-09-25 (1:190): genie build/genie/euripidesway03euriuoft.txt:16802 prints the elision \"'Twas\""
      - find: "of envy overfull, *\n"
        replace: "of envy overfull,\n"
        note: "way-cleanup r3 2026-09-25 (1:240): genie build/genie/euripidesway03euriuoft.txt:16934 prints no mark at line end"
      - find: "“Smite !”—* Drive the spear against E"
        replace: "“Smite !”—“Drive the spear against E"
        note: "way-cleanup r3 2026-09-25 (1:706): archive.org page prints “Smite!”—“Drive the spear against Erechtheus' (Grok r2 check confirmed against the page)"
      - find: "miseries end! _"
        replace: "miseries end!"
        note: "sweep 2026-09-24 n=73: build/genie/euripidesway03euriuoft.txt:17282-17284; find stops before the line end (P2: Murray's Greek ends a segment there, so the chunk has no newline to match; the TLG result is unchanged)"
      - find: "sound —_—\n"
        replace: "sound\n"
        note: "sweep 2026-09-24 n=72: build/genie/euripidesway03euriuoft.txt:16456-16458; the scan prints no dash here, only the carried rhyme word [fear"
      # n=71 in two finds (P2): Murray's Greek ends a segment between
      # "ghastliest" and the stray "7", so no one chunk holds both. The pair
      # gives the TLG build the same text as the single find did.
      - find: "ghastliest"
        replace: "ghastliest misery."
        note: "sweep 2026-09-24 n=71: build/genie/euripidesway03euriuoft.txt:18431-18436 (scan prints \"misery.\" where the OCR has \"7\")"
      - find: "7\nAh"
        replace: "Ah"
        note: "sweep 2026-09-24 n=71: same scan lines; the stray \"7\" is the OCR of \"misery.\""
      - find: "men said ;\n_ I"
        replace: "men said ;\nI"
        note: "sweep 2026-09-24 n=70: build/genie/euripidesway03euriuoft.txt:18090-18092"
      - find: "rincely son {joy in thee "
        replace: "rincely son [joy in thee "
        note: "sweep 2026-09-24 n=36: build/genie/euripidesway03euriuoft.txt:16381"
      - find: " me, woe !— {in dust lyin"
        replace: " me, woe !— [in dust lyin"
        note: "sweep 2026-09-24 n=37: build/genie/euripidesway03euriuoft.txt:17012"
      - find: "ear me :--- {parley :—\n‘"
        replace: "ear me :--- [parley :—\n‘"
        note: "sweep 2026-09-24 n=38: build/genie/euripidesway03euriuoft.txt:17464 (dash-glue :-— -> :— collapsed ahead of this fix by the way-cleanup sweep, 2026-09-25)"
      - find: "y tomb, thy pyre pyre,\nLonging wi"
        replace: "y tomb, thy pyre,\nLonging wi"
        note: "sweep 2026-09-24 n=120: build/genie/euripidesway03euriuoft.txt:19039"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/suppliants-eur.txt
    play: SUPPLIANTS
    footnotes: true
    # Way prints nothing for the two cries at 805-806 (Genie and the old
    # scan agree), so his "We suffered- / Deepest anguish!" is 807 and "Ah,
    # fair town Of Argos" is 808. The A6 share-size term (2026-09-21) reads
    # 805's short second share as unmerged and slid both up two rows; the
    # pins hold them. Checked against the Greek (epathomen / o polis Argeia).
    pins:
      - { greek: "807", english: "We suffered", run: 1 }
      - { greek: "808", english: "Ah, fair town", run: 1 }
  # Round 2 item 12 (2026-09-18): the sweep-2026-09-08 attachment loss
  # this ceiling allowed for is gone -- earlier lanes' repairs (C15's
  # unprinted-ref seat, C17's bracketed-siglum split, and others) have
