  production: "City Dionysia, 412 BC · produced with Andromeda"
  argument: "Helen never went to Troy: the gods sent a phantom in her place, and she has spent the war in Egypt. Menelaus, shipwrecked there, finds her, and they plot their escape."
  synopsis: "Helen never went to Troy. Hera sent a phantom in her place, and the real Helen has spent the war in Egypt, where the king, Theoclymenus, now means to marry her. Menelaus, shipwrecked on the coast with the phantom, arrives and meets a woman who says she is his wife; the phantom dissolves and he believes her. Helen tells the king her husband is dead and asks for a ship to hold his funeral at sea. Theoclymenus gives her one, and the two of them sail off in it, killing the Egyptian crew. The king turns on his sister Theonoe, who knew the truth, until the Dioscuri, Helen's brothers, stop him."

