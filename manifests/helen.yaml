english:
  primary:
    id: coleridge
    text_fixes:
      - find: "e, in order to to set up the "
        replace: "e, in order to set up the "
        note: "sweep 2026-09-24 n=77: sources/perseus/tlg0006.tlg014.perseus-eng2.xml:1719"
      # S11 sweep row 692 (2026-09-25): the TEI ends Menelaos's n="652" with
      # the first half of Helen's sentence at 654-655 (ἐμὰ δὲ χαρμονᾶι δάκρυα
      # πλέον ἔχει χάριτος ἢ λύπας) and files the rest under n="655"; the
      # two halves are joined at 654, beside their Greek.
      - find: " the goddess. My joy is tearful; it has more"
        replace: " the goddess."
        note: "S11 row 692: sources/perseus/tlg0006.tlg014.perseus-eng2.xml, n=652/655"
      - find: "delight than sorrow."
        replace: "My joy is tearful; it has more delight than sorrow."
        note: "S11 row 692: sources/perseus/tlg0006.tlg014.perseus-eng2.xml, n=652/655"
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg014.perseus-eng2.xml"
    anchor_model: sp-line
    cuts:
      # 2026-09-26: 692 opens mid-line in coleridge's <l n=691>; cut seats it (s15 triage).
      - { greek: "692", english: "these things ruined you also" }
    footnotes: false
    # A TEI typo: Menelaos's "You seem to me very much like Helen, lady."
    # is filed under n="5563" (neighbours are 562 and 564) -- the corpus's
    # last unmatched_anchor (round 2 item 11, lane-c-r4-report-2026-09-18.md).
    line_fixes:
      "5563": "563"
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "641", by: "638" }
      - { greek: "657", by: "654" }
  secondary:
    id: way
    text_fixes:
      - find: "tarrying here! _\n"
        replace: "tarrying here!\n"
        note: "sweep 2026-09-24 n=33: build/genie/euripidesway01euriuoft.txt:17778-17779"
      - find: "spoken. (Sér.)"
        replace: "spoken."
        note: "John 2026-09-25: Way's strophe markers hidden, all of them; way-markers n=2: archive.org euripidesway01euriuoft page 495 (bench/way/helen.txt:434); OCR misread Str. as Sér."
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/helen.txt
    play: HELEN
    footnotes: true
    # Drift sweep 4 (2026-09-26): from 638 the duet sat two slots early
    # ("And the evil made good", 644, at 638; "Blessing on thee", 646, at
    # 641; "And I thee, who to Ida's town", 658, at 652). Way gives Menelaus
    # all of 636-643, so that speech holds 636 and covers 638 and 641; the
    # pins seat the rest on their Greek: 644 τὸ κακὸν δ' ἀγαθὸν, 646 ὄναιο
    # δῆτα, 648 φίλαι φίλαι, 652 ἔχεις, ἔχω τε σ', 656 τί φῶ;, 658 κἀγὼ σέ,
    # 661 ἒ ἔ· πικρὰς (Helen's second cry, 662), 663 λέγ', ὡς ἀκουστά. Way
    # puts 660 ("'Fore heaven, how wast thou ravished") between Helen's two
    # cries (661, 662), so it stays in the 661 row, a line after its Greek.
    pins:
      - { greek: "644", english: "And the evil made good hath united us", run: 4 }
      - { greek: "656", english: "What can I say", run: 1 }
      - { greek: "658", english: "And I thee, who to Ida’s town", run: 1 }
      - { greek: "661", english: "Woe’s me for the bitter tale", run: 2 }
    # Menelaus's 636-643 spreads over 638 and 641; the cut opens 641 at
    # τὸ πρόσθεν ("Erstwhile"), so the torch and the white steeds stay on 638.
    cuts:
      - { greek: "641", english: "Erstwhile" }
  third:
    id: kosmos
    text_fixes:
      - find: "e, in order to to set up the "
        replace: "e, in order to set up the "
        note: "sweep 2026-09-24 n=78: sources/kosmos/helen.html; identical wording to Perseus n.77"
    name: "Coleridge, rev. Helen Heroization team (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/helen.txt
    play: HELEN
    footnotes: false
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
        Gregory Nagy. Reproduced without change under CC BY-NC-ND 3.0:
        https://creativecommons.org/licenses/by-nc-nd/3.0/ . This site gives
        credit and is non-commercial. Every translator and reviser is credited
        in sources/INVENTORY.md and on the attribution page.
      source_url: https://kosmossociety.org/euripides-helen/
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # Round 2 item 11/12 (2026-09-18): the sweep-2026-09-08 unmatched_anchor
  # was the "563" typo above; the other 11 attribution_hole pieces were
  # attached by earlier lanes' repairs. Re-measured at 0.
  max_unresolved_mismatches: 0
  gaps:

