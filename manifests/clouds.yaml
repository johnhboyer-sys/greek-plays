    name: "The Eleven Comedies (The Athenian Society, 1912)"
    short: Athenian Society
    model: turn-text
    source: "gutenberg/pg8688.txt"
    play: "THE CLOUDS"
    footnotes: true
    # Item 6 pins (John, 2026-09-09: real slips are never one-offs):
    # each holds an English speech to the Greek line the reviewers matched it to.
    pins:
      - { greek: "700", english: "Ponder and examine closely, gather your", run: 1 }
      - { greek: "707", english: "Oh, woe, woe! oh, woe, woe!", run: 1 }
      - { greek: "708", english: "What ails you? why do you cry so?", run: 1 }
      - { greek: "717", english: "How can I obey? I have lost my", run: 1 }
      - { greek: "723", english: "Yes, by Posidon!", run: 1 }
      - { greek: "726", english: "May death seize you, accursed man! Ah!", run: 1 }
      - { greek: "743", english: "Keep yourself quiet, and if any notion", run: 1 }
      - { greek: "1420", english: "But the law nowhere admits that fathers", run: 1 }
      - { greek: "1421", english: "Was not the legislator who carried this", run: 1 }
      - { greek: "1434", english: "And if I have not, I shall have cried", run: 1 }
      - { greek: "1506", english: "Ah! you insulted the gods! Ah! you", run: 1 }
      - { greek: "791", english: "Alas! what a calamity! what will become of me?", run: 1 }
      - { greek: "1447", english: "Ah! if you do that, then you will only", run: 1 }
      - { greek: "787", english: "Ah! let me see. What was the first thing?", run: 1 }
      - { greek: "785", english: "But you forget as fast as you learn. Come, what was the thing I taught you first? Tell me.", run: 1 }
      - { greek: "781", english: "You talk rubbish!", run: 1 }
      - { greek: "783", english: "You are merely beating the air. Begone!", run: 1 }
      - { greek: "784", english: "Why not? Oh! Socrates! in the name of the gods!", run: 1 }
    # Round 3 (turn-pairing-round3-2026-09-15.md, P5): Greek speeches whose
    # English sits inside the neighbouring speech (the reader shows
    # 'Translated with the speech above'). Phidippides' "and indeed you
    # probably won't be upset, having suffered what you've now suffered"
    # (1:1441) is the 1912 text's "But you will certainly feel no more anger
    # because of the blows I have given you", attached under 1:1440.
    covered:
      - { greek: "1441", by: "1440" }
  secondary:
    id: hickie
    text_fixes:
      - find: "ire Thales? Open open quickly the"
        replace: "ire Thales? Open, open quickly the"
        note: "sweep 2026-09-24 n=65: build/genie/in.ernet.dli.2015.515629.txt:3560"
    name: "W. J. Hickie (Bohn, 1853)"
    short: Hickie
    model: perseus-play
    source: "perseus/tlg0019.tlg003.perseus-eng2.xml"
    anchor_model: sp-line
