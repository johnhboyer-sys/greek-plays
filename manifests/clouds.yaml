  argument: "Strepsiades enrols at Socrates’ Thinkery to learn how to argue his way out of his debts, and ends by burning it down."
  synopsis: "Strepsiades cannot sleep for his debts, which his horse-mad son Pheidippides has run up. He has heard that Socrates' school next door teaches an argument that wins any case, the Worse over the Better. He enrols himself, proves too slow, and sends the boy instead. Pheidippides comes home able to argue anything. The creditors are beaten off with the new logic; then the son beats his father and proves he was right to. Strepsiades sets fire to the school with Socrates inside."
