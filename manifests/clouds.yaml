  third:
    id: arrowsmith
    name: "William Arrowsmith (Michigan, 1962)"
    short: Arrowsmith
    model: turn-text
    format: verse-own-line
    source: bench/arrowsmith/clouds.txt
    play: "THE CLOUDS"
    footnotes: false
    # Anchors the run of turn-shift drift the auto-aligner otherwise carries
    # through Strepsiades' opening monologue (John's spot check, 2026-09-11).
    #
    # Greek 102 (Pheidippides names Socrates and Chaerephon in one turn) is
    # preceded by Arrowsmith's comic stalling exchange ("Fine. Who are
    # they?" / "Er . . . Gentlemen. Men of Learning."). Greek 100 has this
    # exchange, an
    # antilabe split across the same printed line: Pheidippides asks
    # "εἰσὶν δὲ τίνες;" ("Who are they?"), Strepsiades answers at once,
    # unsure of the name, "οὐκ οἶδ' ἀκριβῶς τοὔνομα." ("I don't know
    # exactly the name."), then continues into 101 with his own invented
    # term, "μεριμνοφροντισταὶ καλοί τε κἀγαθοί." ("thought-worriers, fine
    # and good men."). Arrowsmith expands that one Greek antilabe (100-101)
    # into six English turns, distributing and repeating the same material;
    # the identification at 102 is a seventh. Because
    # the insertion comes in a speaker-alternating pair, the name-only LCS
    # zip still "agrees" turn for turn and never flags it, so every turn
    # from here on paired one slot early (Codex review finding 7,
    # 2026-09-11: a genuine edition difference -- Arrowsmith's own
    # expansion, not a cleaner or parser defect -- so pinned rather than
    # fixed at the source; comment corrected in the re-review, 2026-09-11:
    # the exchange is not without a Greek counterpart, it is an expansion
    # of one).
    pins:
      - { greek: "56", english: "There's no oil left in the lamp.", run: 1 }
      - { greek: "102", english: "Oh lord, I know those filthy charlatans you mean", run: 1 }
  overlays:
    - id: johnston
      text_fixes:
        - find: " done for.\n\n{Enter Socrat"
          replace: " done for.\n\n[Enter Socrat"
          note: "sweep 2026-09-24 n=24: sources/johnston/clouds.htm"
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/clouds.txt
      play: CLOUDS
      footnotes: false
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
          general readers, teachers, students, and performing artists may
          download any material on johnstonia web pages without permission and
          without charge, provided they do not use the material in a commercial
          publication." Credited in sources/INVENTORY.md and on the attribution
          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
  # Item 6 (John, 2026-09-09): every Greek speech carries English, or is
  # declared below (gaps) or under primary.covered.
  strict_coverage: true
  gaps:
