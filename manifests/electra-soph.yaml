  blurb: "Electra waits years for her brother Orestes to come home and avenge their father."
  production: "Date unknown, probably c. 420–410 BC"
  argument: "Electra waits for Orestes to come home and avenge their father. He comes, and they kill their mother."
  synopsis: "Since Agamemnon's murder Electra has lived in the palace at Mycenae as her mother's enemy, unmarried, in mourning, waiting for her brother. Orestes arrives with a plan: an old servant will report to Clytemnestra that he is dead, killed in a chariot race at Delphi. Electra hears the story too and believes it, and is holding what she thinks is the urn with his ashes when the stranger beside her tells her who he is. Orestes kills Clytemnestra inside the house while Electra urges him on from the door, then leads Aegisthus in to his death."
