  secondary:
    id: way
    text_fixes:
      - find: "cause thereof\n/Thy lord! My very b"
        replace: "cause thereof\nThy lord! My very b"
        note: "way-cleanup 2026-09-25 row 342 (S11 confirmed): stray slash"
      - find: "thy dauntless mood °"
        replace: "thy dauntless mood"
        note: "way-cleanup 2026-09-25: stray degree sign, same artifact as row 1002 (medea 1:824)"
