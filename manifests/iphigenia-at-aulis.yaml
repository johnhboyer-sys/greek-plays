        replace: "or where begin ?\nInto what bonds"
        note: "way-cleanup r3 2026-09-25 (1:427): archive.org page 44 prints \"or where begin ?\" -- the asterisk is a misread question mark, not a bare insertion"
      - find: "*Tis all men’s nature"
        replace: "’Tis all men’s nature"
        note: "way-cleanup r3 2026-09-25 (1:1137): genie build/genie/euripidesway01euriuoft.txt:2580 prints the elision \"'Tis\""
      - find: "I would fain be asked.\n“* Now who hath wrong:"
        replace: "I would fain be asked."
        note: "way-cleanup r3 2026-09-25 (1:1130): archive.org page 105 ends at \"I would fain be asked.\" and page 107 opens straight into CLYTEMNESTRA's next speech -- \"“* Now who hath wrong:\" is not on the page at all, apparently bled in from the footnote quoting Nauck's rejected reading (\"Now who hath wronged thee?\"); the whole phantom line is dropped, not just the asterisk"
      - find: "*Twas I first called thee father, thou me child.\n*Twas I first throned my body on thy knees,"
