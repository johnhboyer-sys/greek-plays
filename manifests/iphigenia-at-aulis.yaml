  blurb: "Agamemnon lures Iphigenia to Aulis with a false marriage to sacrifice her for a fair wind."
  production: "Produced posthumously at the City Dionysia, 405 BC, by Euripides the younger · first prize"
  argument: "The Greek fleet is stuck at Aulis, and Artemis demands Agamemnon’s daughter. He lures Iphigenia there with a false promise of marriage to Achilles; in the end she goes to the altar willingly."
  synopsis: "The Greek fleet is becalmed at Aulis, and the prophet Calchas has said Artemis demands Agamemnon's daughter Iphigenia. Agamemnon has sent for her on the pretext of marriage to Achilles, then written a second letter to stop her. Menelaus intercepts it. Clytemnestra arrives with the bride, and Achilles learns of the marriage from her. Iphigenia learns what she has been brought for, begs for her life, and then chooses to go to the altar for Greece. A messenger reports that a deer was found in her place."

