          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
    - id: murray-verse
      name: "Gilbert Murray"
      short: Murray
      model: turn-text
      format: verse-own-line
      source: bench/murray/hippolytus.txt
      play: HIPPOLYTUS
      footnotes: false
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # Round 2 item 12 (2026-09-18): the sweep-2026-09-08 attachment loss
  # this ceiling allowed for is gone -- earlier lanes' repairs (C15's
  # unprinted-ref seat, C17's bracketed-siglum split, and others) have
  # since attached every one of those pieces. Re-measured at 0.
  max_unresolved_mismatches: 0
  gaps:
