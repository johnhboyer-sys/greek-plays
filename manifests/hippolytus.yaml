      - { greek: "1387", by: "1347" }
  secondary:
    id: way
    text_fixes:
      - find: "in no wise err.!"
        replace: "in no wise err!"
        note: "way-cleanup 2026-09-25 row 1405 (S11 confirmed): stray full stop before the exclamation mark"
      - find: "mantles purple- gleaming"
        replace: "mantles purple-gleaming"
        note: "way-cleanup 2026-09-25: genie build/genie/euripidesway04euriuoft.txt:5743 prints \"purple-gleaming\" with no space, a real compound"
      - find: "- What then is this strange thing that deathward drives thee ?"
        replace: "What then is this strange thing that deathward drives thee ?"
        note: "way-cleanup 2026-09-25: standalone stray hyphen after the NURSE cue"
      - find: "- The son of the Amazon, Hippolytus,"
        replace: "The son of the Amazon, Hippolytus,"
        note: "way-cleanup 2026-09-25: standalone stray hyphen after the PHAEDRA cue"
      - find: "caught! - I warn all men"
        replace: "caught! I warn all men"
        note: "way-cleanup 2026-09-25: standalone stray hyphen"
