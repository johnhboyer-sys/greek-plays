  argument: "Aphrodite punishes Hippolytus, who scorns love, by making his stepmother Phaedra fall in love with him. He rejects her. She hangs herself and leaves a note accusing him of rape, and his father Theseus curses him to his death."
  synopsis: "Aphrodite, slighted by Theseus's son Hippolytus, who worships only Artemis and wants nothing to do with love, has made his stepmother Phaedra fall in love with him. Phaedra is starving herself rather than speak. Her nurse gets the secret out of her and, meaning to help, tells Hippolytus. He is disgusted. Phaedra, exposed, hangs herself and leaves a tablet accusing him of rape. Theseus believes it, banishes his son, and curses him with one of the three curses Poseidon owes him. A bull from the sea wrecks Hippolytus's chariot. Artemis tells Theseus the truth over the dying boy, who forgives him."

