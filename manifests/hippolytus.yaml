    name: "Coleridge, rev. Rein & Nagy (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/hippolytus.txt
    play: HIPPOLYTUS
    footnotes: false
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
