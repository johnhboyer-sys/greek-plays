      source_url: https://kosmossociety.org/hippolytus-euripides/
  overlays:
    - id: johnston
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/hippolytus.txt
      play: HIPPOLYTUS
      footnotes: false
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
