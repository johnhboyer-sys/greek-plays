  synopsis: "Deianeira waits at Trachis for Heracles, gone fifteen months. News comes that he is on his way home victorious, and among the captives he sends ahead is a girl, Iole, whom he has taken as a lover. Deianeira has kept a charm the centaur Nessus gave her as he died: his blood, he said, would win back a straying husband. She smears it on a robe and sends it to Heracles. It is poison; it eats into him. She kills herself when she learns what she has done. Heracles, dying, orders his son Hyllus to burn him alive on Mount Oeta and to marry Iole."

