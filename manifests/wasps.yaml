      # ἀλλ' ἐκεῖνό ... Θουκυδίδης (946), κλέπτης μὲν οὖν (953), μὰ Δί',
      # ἀλλ' ἄριστός (954), τί οὖν ὄφελος (956).
      - { greek: "936", english: "(Thesmothetes) Take it yourself. I go to call", run: 2 }
      - { greek: "942", english: "Come forward and defend yourself.", run: 1 }
      - { greek: "945", english: "No doubt he has nothing to say.", run: 5 }
      - { greek: "1154", english: "Come! I will put it round you.", run: 54 }
      - { greek: "78", english: "Not at all! The love of wine is the complaint of good men.", run: 1 }
      - { greek: "81", english: "Well then, says Nicostratus of the Scambonian deme, he either", run: 1 }
      - { greek: "83", english: "Ah! great gods! no, he is not fond of strangers, Nicostratus", run: 1 }
      - { greek: "143", english: "By Zeus! what is that noise in the chimney?", run: 1 }
      # Round 5: the 1912 text runs 146-151 and 152 into one 468-char Bdelycleon
