      - { greek: "211", english: "And how that we have driven him in thoroughly", run: 1 }
      - { greek: "228", english: "Have no fear! If I can find stones to throw", run: 1 }
      - { greek: "77", english: "No, yet love is indeed the principal part", run: 1 }
      - { greek: "957", english: "What? he fights for you, he guards your door", run: 1 }
      - { greek: "74", english: "He's wrong! He is imputing his own malady to others.", run: 1 }
      - { greek: "1122", english: "As long as I live, I will never give up this cloak", run: 1 }
      - { greek: "54", english: "Come, I must explain the matter to the spectators.", run: 1 }
      - { greek: "47", english: "This is might strange; Theorus turning into a crow!", run: 1 }
      - { greek: "52", english: "Interpreting dreams so aptly certainly deserves two obols.", run: 1 }
      - { greek: "42", english: "Seated on the ground close to it, I saw Theorus", run: 1 }
      - { greek: "46", english: "Ah! 'twas very well lisped indeed!", run: 1 }
