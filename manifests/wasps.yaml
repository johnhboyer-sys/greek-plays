  synopsis: "Philocleon is addicted to sitting on juries. His son Bdelycleon has netted the house to keep him from the courts and has a guard on every door. The old man tries the chimney, the roof, the underside of a donkey. His fellow jurors, the wasps of the chorus, come to spring him. The son wins the argument and sets up a court at home, where the dog is tried for stealing cheese and Philocleon is tricked into acquitting, the first acquittal of his life. Taken out to a dinner party, he comes home drunk with a flute-girl and a trail of lawsuits."

