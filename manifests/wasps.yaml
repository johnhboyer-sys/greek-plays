      - { greek: "9", english: "No! 'Tis Bacchus who lulls me off.", run: 5 }
      - { greek: "24", english: "Alas! what ill does such a dream portend for me?", run: 8 }
      - { greek: "37", english: "Enough, enough, spare me.", run: 1 }  # παῦε παῦε, μὴ λέγε
      - { greek: "156", english: "What are you dong, you wretches?", run: 13 }
      - { greek: "204", english: "Perhaps a rat loosened it.", run: 3 }
      - { greek: "314", english: "Oh! my little wallet! you seem like", run: 1 }
      - { greek: "398", english: "Mount quick to the other window,", run: 5 }
      - { greek: "458", english: "You will not go? The plague seize", run: 1 }
      - { greek: "524", english: "As for you, tell me whether you", run: 2 }
      - { greek: "823", english: "That is why, hero though he be,", run: 6 }
      # S16 drift (2026-09-26): run 35 (capped at 8) held 944-955 one speech
