      - { greek: "156", english: "What are you going to do? Will you not let me out", run: 1 }
      - { greek: "158", english: "Would you be vexed at this?", run: 1 }
      - { greek: "158", english: "Yes, for the god at Delphi", run: 1 }
      - { greek: "161", english: "O Apollo, averter of ill", run: 1 }
