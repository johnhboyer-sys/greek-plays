      - { greek: "77", english: "No; yet \"love\" is the beginning of the evil.", run: 1 }
      - { greek: "81", english: "Nicostratus, of Scambonis, on the other hand, says that he is fond of sacrificing or fond of hospitality.", run: 1 }
      - { greek: "83", english: "By the Dog, Nicostratus, not fond of hospitality, since Philoxenus is a blackguard.", run: 1 }
      # S16 drift (2026-09-26): 156-161 sat one speech early (the Delphi
