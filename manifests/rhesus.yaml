  blurb: "A night raid on the Trojan camp cuts short the newly arrived ally Rhesus and his Thracian troop."
  production: "Date unknown · authorship disputed"
  argument: "Rhesus the Thracian arrives to help Troy and is killed in his sleep by Odysseus and Diomedes."
  synopsis: "Night in the Trojan camp. Hector, alarmed by the Greek watchfires, sends Dolon to spy. Rhesus, king of Thrace, arrives with his army, late and boastful, and Hector gives him a place to camp. Odysseus and Diomedes are inside the Trojan lines the same night, having caught and killed Dolon, and Athena points them to the Thracian's tent. They kill Rhesus in his sleep and take his horses. His mother, a Muse, comes for the body and blames Odysseus and Athena."
