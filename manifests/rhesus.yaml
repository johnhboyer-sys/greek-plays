english:
  primary:
    id: coleridge
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg019.perseus-eng3.xml"
    anchor_model: sp-line
    cuts:
      # 2026-09-26: 543 opens mid-line in coleridge's <l n=540>; cut seats it (s15 triage).
      - { greek: "543", english: "Is it not then high time" }
    footnotes: false
    # Turn-starts triage (2026-09-26): the lettered antilabe shares belong to
    # the line they split, not the next one.
    line_fixes:
      "687b": "687"  # οὐ μὲν οὖν — No, no, lay on!
      "687c": "687"  # ἆ· φίλιον ἄνδρα μὴ θένηις — Ah! do not slay a friend!
      "688b": "688"  # Φοῖβος — Phoebus
      "688c": "688"  # ἔμαθον· ἴσχε πᾶς δόρυ — Right! every man hold back his spear!
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "538", by: "527" }
      - { greek: "539", by: "527" }
      - { greek: "557", by: "546" }
      - { greek: "559", by: "546" }
      - { greek: "562", by: "560" }
      - { greek: "946", by: "906" }
  secondary:
    id: way
    text_fixes:
      - find: "through mine cars"
        replace: "through mine ears"
        note: "way-cleanup 2026-09-25 row 337 (S11 confirmed): OCR cars for ears"
      - find: "gory wound’ Would God"
        replace: "gory wound. Would God"
        note: "way-cleanup 2026-09-25 row 573 (S11 confirmed): apostrophe where the sentence break belongs"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/rhesus.txt
    play: RHESUS
    footnotes: true
  third:
    id: murray-verse
    name: "Gilbert Murray"
    short: Murray
    model: turn-text
    format: verse-own-line
    source: bench/murray/rhesus.txt
    play: RHESUS
    footnotes: false
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

