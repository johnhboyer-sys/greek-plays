  secondary:
    id: way
    text_fixes:
      - find: "infamous thing ? 370\n\n(Epode)\n"
        replace: "infamous thing ?\n\n"
        note: "John 2026-09-25: Way's strophe markers hidden, all of them; also drops the page's margin line number 370"
      - find: "the lot’s doom, 1;"
        replace: "the lot’s doom, I;"
        note: "way-cleanup 2026-09-25 row 145 (S11 confirmed): OCR digit 1 for the pronoun I"
      - find: "upon me, . won me\nChase afar !—no such guerdon hath righteousness"
        replace: "upon me,\nChase afar !—no such guerdon hath righteousness won me"
        note: "way-cleanup r3 2026-09-25 (round-2 fix still wrong, Grok r2 check item 1): the page prints \"upon me,\" and, at the right margin, \"[won me\" as the turned-over end of the NEXT line, \"...hath righteousness won me\"; \"won me\" belongs on that line, not on \"upon me,\""
      - find: "cast out pity ! .\n"
        replace: "cast out pity !\n"
        note: "way-cleanup 2026-09-25 row 141 (S11 confirmed): stray full stop after pity !"
      - find: "Yea, men must fight. For. these must thou take"
        replace: "Yea, men must fight. For these must thou take"
        note: "way-cleanup r2 2026-09-25 (S11 confirmed, ex-mechanical-rule): build/genie/euripidesway03euriuoft.txt:10059-10060 prints \"For these\" with no stray stop"
      - find: "Over our. marches on-sweepeth ;"
        replace: "Over our marches on-sweepeth ;"
        note: "way-cleanup r2 2026-09-25 (S11 confirmed, ex-mechanical-rule): build/genie/euripidesway03euriuoft.txt:8949 prints \"Over our marches\" with no stray stop"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/heraclidae.txt
    play: CHILDREN OF HERCULES
    footnotes: true
    # John 2026-09-11: shift over 0.10 by under a point; let it slide for now
    max_turn_shift_rate: 0.11
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # Way's secondary pairs 0.782 (sweep 2026-09-08): 167 English speaker-turns
