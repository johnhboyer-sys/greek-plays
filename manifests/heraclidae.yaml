  argument: "Hunted from city to city by Eurystheus, the children of Heracles and old Iolaus take refuge at Marathon. Athens goes to war to protect them."
  synopsis: "After Heracles' death his children and his old companion Iolaus are hunted from city to city by Eurystheus, king of Argos. They reach the altar at Marathon, and Demophon, king of Athens, agrees to defend them though it means war. An oracle demands that a girl of noble birth be sacrificed for the victory, and a daughter of Heracles offers herself. Athens wins; old Iolaus, made young for a day, captures Eurystheus. Heracles' mother Alcmene has him killed, against Athenian custom, and he promises that his grave will protect Attica."
