# Electra (Euripides, TLG 0006: 042) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0006/Diogenes-Resources/xml/tlg/tlg0006042.xml),
# verified by two `all --work electra-eur --public` runs (docs/p2-greek-report.md).

work:
  id: electra-eur
  title: Electra
  author: euripides
  language: grc
  tlg_author: "0006"
  tlg_work: "042"
  greek_edition: "Diggle, Euripidis fabulae, vol. 2 (OCT, 1981)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Euripides Trag. (c. 5 B.C.), Electra (0006: 042) "Euripidis fabulae, vol. 2", Ed. Diggle, J. Oxford: Clarendon Press, 1981.'

english:
  primary:
    id: coleridge
    text_fixes:
      - find: "red come to the the tomb; for i"
        replace: "red come to the tomb; for i"
        note: "sweep 2026-09-24 n=70: sources/perseus/tlg0006.tlg012.perseus-eng2.xml:610"
      - find: "the wrong I and and my brother "
        replace: "the wrong I and my brother "
        note: "sweep 2026-09-24 n=71: sources/perseus/tlg0006.tlg012.perseus-eng2.xml:1285"
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg012.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "652", by: "651" }
      - { greek: "966", by: "965" }
  secondary:
    id: way
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/electra-eur.txt
    play: ELECTRA
    footnotes: true
    # Drift sweep 4 (2026-09-26): from 674 the prayer (674-684) sat two
    # speeches to a row ("Grant for their father vengeance", 676, at 675;
    # Electra's "Our sire hears all", 684, at 681). The pins seat each speech
    # on its own Greek slot in printed order: 674 Ἥρα, 675 νίκην δὸς, 676
    # δὸς δῆτα πατρὸς, 679 ἄμυν' ἄμυνε, 680 νῦν πάντα νεκρὸν, 681 οἵπερ γε
    # σὺν σοὶ Φρύγας, 683 χὤσοι στυγοῦσιν, 682 ἤκουσας, 684 πάντ', οἶδ',
    # ἀκούει. Way prints Electra's "O Earth" (678) before Orestes' "Father,
    # by foul wrong" (677), so those two stand a row apart from their Greek,
    # swapped; and his 684 runs on through 685-692 (Aegisthus must die),
    # which the edition prints after 693, so that stays in the 684 row.
    pins:
      - { greek: "674", english: "Queen of Mycenae's altars, Hera, help!", run: 8 }
      - { greek: "683", english: "Yea, all which hate defilers impious", run: 3 }
  third:
    id: johnston
    name: "Ian Johnston (VIU)"
    short: Johnston
    model: turn-text
    format: verse-own-line
    source: bench/johnston/electra-eur.txt
    play: ELECTRA
    footnotes: false
    # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Ian Johnston (Vancouver Island University), johnstonia pages: "All
        general readers, teachers, students, and performing artists may
        download any material on johnstonia web pages without permission and
        without charge, provided they do not use the material in a commercial
        publication." Credited in sources/INVENTORY.md and on the attribution
        page.
      source_url: https://web.viu.ca/johnstoi/copyright.htm
  overlays:
    - id: murray-verse
      name: "Gilbert Murray"
      short: Murray
      model: turn-text
      format: verse-own-line
      source: bench/murray/electra-eur.txt
      play: ELECTRA
      footnotes: false
      # Item 7 (lane-a-report residue, play-electra-eur-findings #2): Murray
      # runs two turns ahead through the whole mother-murder debate (Greek
      # 966-984); this pin holds his Orestes turn to its own line.
      pins:
        - { greek: "967", english: "What would we with our mother? Didst thou say", run: 1 }
        # Drift sweep 4 (2026-09-26): from 674 the prayer sat two speeches
        # to a row ("Child, we stay too long", 684, at 683; "Aegisthus dies",
        # 685, at 682). The pins seat each speech on its Greek slot in
        # printed order (674 Ἥρα ... 681 οἵπερ γε σὺν σοὶ Φρύγας, then 683
        # χὤσοι στυγοῦσιν, 682 ἤκουσας, 684 πάντ', οἶδ', ἀκούει, 693 πάντ',
        # οἶδα "I know all, all"). Electra's "And while he hears" (685-692)
        # joins the 693 row, where the edition prints 685-692 after 693.
        # Murray prints "O Earth" (678) before "And deeper thou, O father"
        # (677), so those two stand a row apart from their Greek, swapped.
        - { greek: "674", english: "O Queen o'er Argive altars, Hera high", run: 8 }
        - { greek: "683", english: "And hate earth's dark defilers", run: 3 }
        - { greek: "693", english: "I know all, all", run: 1 }
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:
    - "1:1100"  # the couplet is bracketed as spurious in the edition; Coleridge does not render i
    - "1:1100"  # TEI n=1100 is entirely <del>

