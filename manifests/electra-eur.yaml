  blurb: "Married off to a poor farmer, Electra plots with Orestes to kill their mother."
  production: "Date disputed, c. 420–413 BC"
  argument: "Electra, married off to a peasant, is found by Orestes. He kills Aegisthus, and together they kill their mother."
  synopsis: "Aegisthus has married Electra to a poor farmer so that her children will be nobodies. She lives in his hut outside Argos, hauling water, nursing her grievance. Orestes and Pylades come unannounced, and an old man who once smuggled Orestes to safety as a child knows him by a scar. Orestes kills Aegisthus at a sacrifice in the country. Clytemnestra is lured to the hut with news that her daughter has given birth, and the two of them kill her there. Both are sick with what they have done. The Dioscuri, Clytemnestra's brothers, appear to send Orestes to Athens for trial and Electra to marry Pylades."

