  synopsis: "The fifty daughters of Danaus have fled Egypt to escape marriage with their fifty cousins, the sons of Aegyptus. They land at Argos, the home of their ancestor Io, and take refuge at the altars. King Pelasgus must choose between the suppliants' claim on the gods and a war with Egypt, and puts the question to the Argive people. Argos votes to protect them. The Egyptian fleet lands, a herald tries to drag the women off, and Pelasgus drives him away. The war is left for the lost sequels."
