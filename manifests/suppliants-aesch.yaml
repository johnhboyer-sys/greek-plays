# Supplices (Aeschylus, TLG 0085: 001) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0085/Diogenes-Resources/xml/tlg/tlg0085001.xml),
# verified by two `all --work suppliants-aesch --public` runs (docs/p2-greek-report.md).

work:
  id: suppliants-aesch
  title: "Suppliant Women"
  author: aeschylus
  language: grc
  tlg_author: "0085"
  tlg_work: "001"
  greek_edition: "Murray, Aeschyli tragoediae, 2nd ed. (OCT, 1955)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Aeschylus Trag. (c. 6-5 B.C.), Supplices (0085: 001) "Aeschyli tragoediae, 2nd edn.", Ed. Murray, G. Oxford: Clarendon Press, 1955, Repr. 1960.'

english:
  primary:
    id: smyth
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg001.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: true
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "1041", by: "1038" }
      - { greek: "1047", by: "1043" }
  secondary:
    id: morshead
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/suppliants-aesch.txt
    play: THE SUPPLIANT MAIDENS
    footnotes: false
  third:
    id: johnston
    name: "Ian Johnston (VIU)"
    short: Johnston
    model: turn-text
    format: verse-own-line
    source: bench/johnston/suppliants-aesch.txt
    play: SUPPLIANT WOMEN
    footnotes: false
    # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Ian Johnston (Vancouver Island University), johnstonia pages: "All
        general readers, teachers, students, and performing artists may
        download any material on johnstonia web pages without permission and
        without charge, provided they do not use the material in a commercial
        publication." Credited in sources/INVENTORY.md and on the attribution
        page.
      source_url: https://web.viu.ca/johnstoi/copyright.htm
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # Measured attachment loss (sweep 2026-09-08): 2 English piece(s) with no
  # honest owner — attribution_hole 0, nless_slice_unattached 0, unmatched_anchor 2. Mostly stichomythia the translator's base
  # text structures differently from the TLG edition (REVIEW-CHECKLIST 6).
  max_unresolved_mismatches: 2
  gaps:
    - "1:298"  # clean stichomythia elsewhere; no English for this line nearby
    - "1:313"  # clean stichomythia elsewhere; no English for this line nearby

citation:
  scheme: play-line

  title_labels:
    - { sha256_16: "e52216f4b64eaa9c", note: "play title line (l n=\"t\"), 'ΙΚΕΤΙΔΕΣ'" }

  lacunae:
    "1": []

  transpositions:
    "1": 
      - { start: "444", end: "444", before: "445" }
      - { start: "447", end: "447", before: "448" }

  fingerprint: { count: 1062, sha256: "729dbedf438bb2c37de5f80b84c9aeecd635b148145cee2b58d89f6d0b17b674" }

speakers:
  english:
    "Chorus": "Chorus"
    "Danaus": "Danaus"
    "Herald": "Herald"
    "King": "Pelasgus"
    "Chorus of the Danaids": "Danaids"
    "Chorus of Handmaidens": "Handmaidens"
    "A Danaid": "Danaids"
    "A Handmaiden": "Handmaidens"
    "Chorus of Danaids and Handmaidens": "Chorus"
  english_secondary:
    "CHORUS": "Chorus"
    "DANAUS": "Danaus"
    "KING OF ARGOS": "Pelasgus"
    "HERALD OF AEGYPTUS": "Herald"
    "SEMI-CHORUS": "Chorus"
  # Ian Johnston (VIU) cues -> the roster.
  english_third:
    "CHORUS": "Chorus"
    "DANAUS": "Danaus"
    "PELASGUS": "Pelasgus"
    "HERALD": "Herald"
    "CHORUS OF HANDMAIDENS": "Handmaidens"
    "HANDMAIDENS": "Handmaidens"
  # Murray's Greek sigla -> canonical English display, hand-resolved from the
  # export's own full-caps first appearances. TODO(P2): the exodos (~1034ff)
  # has genuinely confused manuscript attribution among the Danaids' own
  # chorus, the Egyptian herald's men, and a chorus of handmaidens -- Murray's
  # compound headings are translated literally (Δαναΐδων/Αἰγυπτίων/
  # Θεραπαινῶν), not invented; flag for John's review at the complete build.
  # A leading "<" (an editorial-supplement bracket) is stripped by
  # turns.base_siglum before lookup -- declared keys below already reflect
  # that (e.g. "<Δα.>" -> "Δα.>").
  sigla:
    "ΧΟΡΟΣ ΔΑΝΑΙΔΩΝ": "Chorus"
    "ΧΟΡΟΣ": "Chorus"
    "Χο.": "Chorus"
    "Χο.>": "Chorus"
    "ΔΑΝΑΟΣ": "Danaus"
    "Δα.": "Danaus"
    "Δα.>": "Danaus"
    "ΒΑΣΙΛΕΥΣ": "Pelasgus"
    "Βα.": "Pelasgus"
    "Βα.>": "Pelasgus"
    "ΚΗΡΥΞ": "Herald"
    "Κη.": "Herald"
    "Κη.>": "Herald"
    "ΘΕΡΑΠΑΙΝΑΙ —": "Handmaidens"
    "Θε.": "Handmaidens"
    "Δαδ.": "Danaids"
    "Δαδ.>": "Danaids"
    "Αιγ.>": "Egyptians"
    "ΧΟΡΟΙ ΔΑΝΑΙΔΩΝ καὶ ΑΙΓΥΠΤΙΩΝ> Δαδ.": "Danaids"
    "ΧΟΡΟΙ ΔΑΝΑΙΔΩΝ καὶ ΘΕΡΑΠΑΙΝΩΝ Δαδ.": "Danaids"
    "—": null

books:
  - { n: 1, start: "1", end: "1073" }

