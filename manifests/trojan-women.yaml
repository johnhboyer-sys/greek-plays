        replace: "chalices shine"
        note: "John 2026-09-25: Way's strophe markers hidden, all of them; way-markers n=4: archive.org euripidesway01euriuoft page 423 (bench/way/trojan-women.txt:1046); OCR misread Str. as Sir."
