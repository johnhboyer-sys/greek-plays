    alignment:
      coleridge:
        # English margin numbers read against this Greek (2026-10-25/26, Opus
        # fixes, Codex check): move = the number goes to its own line's words.
        tick_fixes:
          - { column: "1100", shown: 1115, at: "on Hellas through its length", note: "1115 Ἑλλάδι τᾷ μεγάλᾳ = \"on Hellas through its length and breadth\"; \"on the streams of Simois\" is 1116" }
          - { column: "1156", shown: 1168, at: "If you had died for your city", note: "1168 εἰ μὲν γὰρ ἔθανες πρὸ πόλεως; \"Ah! my beloved, yours is a piteous death\" is 1167" }
          - { column: "1218", shown: 1220, at: "About your body now I swathe", note: "mid-speech: Φρύγια πέπλων ἀγάλματʼ ἐξάπτω χροός (1220) is About your body now I swathe; Codex verify upheld" }
          - { column: "77", shown: 80, at: "and he promises to grant", note: "80 ἐμοὶ δὲ δώσειν φησὶ πῦρ κεραύνιον = \"he promises to grant me his thunder-bolts\"; \"inky tempests from the sky\" is 79" }
          - { column: "809", shown: 815, at: "with the ruddy breath of fire", note: "815 πυρὸς φοίνικι πνοᾷ καθελὼν = \"with the ruddy breath of fire\"; \"he wasted the masonry squared by Phoebus’ line\" is 814" }
          - { column: "1060", shown: 1070, at: "a holy sun-lit land", note: "1070 τὰν καταλαμπομέναν ζαθέαν θεράπναν = \"a holy sun-lit land\"; \"takes the god’s first rays\" is 1069 πρωτόβολόν" }
          - { column: "168", shown: 175, at: "living and dead alike", note: "175 καὶ ζῶντες καὶ δμαθέντες = \"living and dead alike\"; \"who are leaving you behind\" is 174a οἵ σʼ ἐκλείποντες" }
          - { column: "444", shown: 450, at: "shall give my corpse cast forth", note: "450 θηρσὶ δώσουσιν δάσασθαι = \"shall give … to wild beasts to make their meal upon\"; \"near my husband’s tomb\" is 449" }
          - { column: "914", shown: 915, at: "you will not answer me", note: "915 οὐκ ἀνταμείψῃ πολεμίαν ἡγούμενος = \"you will not answer me, from counting me a foe\"; \"whether my words seem good or ill\" is 914" }
      # Perseus opens a new speech at each strophe or turn; Way and Murray
      # print the speech once, under its first cue, and the aligner seats it
      # on the last piece. Each "by" segment holds the block that opens with
      # the English of the first piece (stage 1 chunk text at "by").
      way:
        covered:
          - { greek: "98", by: "122" }    # "HECUBA. Uplift thou thine head, O fortune-accurst" (98 is ἄνα, δύσδαιμον, πεδόθεν κεφαλή) opens the block at 122
          - { greek: "1302", by: "1303a" } # Way's one Hecuba speech "Hear, children, O hearken your mother's crying" spans 1302 and 1303a; the chorus's ἓ ἕ (1303) between them has no English in Way
      murray-verse:
        covered:
          - { greek: "568", by: "552" }   # the block at 552 holds the Leader's whole speech, "Lo, yonder on the heaped crest ... Andromache ... the mountain shrines of Thessaly", for 552-567 and 568-576
          - { greek: "424", by: "444" }   # "CASSANDRA. (seeing for the first time the Herald" opens the block at 444
          - { greek: "1060", by: "1100" } # "CHORUS. Some Women. And hast thou turned from the Altar of frankincense" opens the block at 1100
          - { greek: "1071", by: "1100" }
          - { greek: "1081", by: "1100" }
        # The kommos 1287-1332: Perseus opens a Hecuba or Chorus speech at
        # every cry, Murray prints "Divers Women ... Others" as one speech
        # and then a speech per turn, so the speeches sat four slots early
        # from 1291 on. The pins seat each English speech on the Greek turn
        # the TLG build gives it (numbering agrees over 1302-1320); the
        # parenthetical "(Pain; O pain!)" and "(Go, and come not again!)"
        # fall on the chorus shares of 1310-1311 between them.
        pins:
          # From 577 the kommos sat one turn late (578 held "Forth to the
          # Greek I go", which the TLG build seats on 577).
          - { greek: "577", english: "Forth to the Greek I go", run: 1 }
          - { greek: "1302", english: "O Earth, Earth of my children", run: 1 }
          - { greek: "1304", english: "Now hast thou found thy prayer", run: 1 }
          - { greek: "1305", english: "Surely my knees are weary", run: 1 }
          - { greek: "1307", english: "I, I am near thee", run: 1 }
          - { greek: "1310", english: "Even as the beasts they drive", run: 1 }
    gaps: []
    text_fixes:
      # Perseus 204 prints U+02BD (a reversed comma) for the opening quote and
      # ἑ + U+0313 + U+0301 (rough and smooth breathing together, which no
      # Greek word carries) for ἔ; TLG 204 prints ἔρροι. Stage 3 cannot
      # transliterate U+02BD. Opening quote to U+2018, ἔρροι as TLG has it.
      - { ref: "204", find: "ʽἑ̓́ρροι", replace: "‘ἔρροι", note: "sources/perseus/tlg0006.tlg011.perseus-grc2.xml:429 (n=204)" }
