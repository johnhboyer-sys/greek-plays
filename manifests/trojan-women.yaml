  production: "City Dionysia, 415 BC · second prize, behind Xenocles"
  argument: "Troy has fallen. Its women wait to learn which Greek each has been given to, and Hector’s small son is thrown from the walls."
  synopsis: "The morning after Troy's fall. The women of the city wait on the shore to learn which Greek each has been assigned to. Hecuba goes to Odysseus, Cassandra to Agamemnon, Andromache to Neoptolemus. Then Andromache learns what the Greeks have decided about her small son Astyanax: he is to be thrown from the walls, and he is. Helen is brought out, and Menelaus lets her plead her case with Hecuba as prosecutor; he says she will die in Argos and has her taken to the ships. The child is buried on his father's shield, the city is set alight, and the women are marched to the ships."

