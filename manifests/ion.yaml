  blurb: "A temple boy at Delphi learns his true parentage in a plot that nearly costs his mother's life."
  production: "Date disputed, c. 418–410 BC"
  argument: "Creusa and Xuthus come to Delphi to ask for a child, and meet the temple servant Ion, the boy she once abandoned."
  synopsis: "Creusa, queen of Athens, once bore Apollo a son and abandoned him. He was carried to Delphi and raised in the temple, and is now its young servant, Ion. Creusa and her husband Xuthus come to Delphi to ask for a child. The oracle gives Xuthus Ion. Creusa, told nothing of her own son and sure she has been supplanted, tries to poison the boy; the plot is found out and Ion comes to kill her at the altar. The Pythia produces the cradle he was found in, Creusa knows the tokens in it, and Athena confirms whose son he is."
