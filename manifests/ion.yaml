# Ion (Euripides, TLG 0006: 046) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0006/Diogenes-Resources/xml/tlg/tlg0006046.xml),
# verified by two `all --work ion --public` runs (docs/p2-greek-report.md).

work:
  id: ion
  title: Ion
  author: euripides
  language: grc
  tlg_author: "0006"
  tlg_work: "046"
  greek_edition: "Diggle, Euripidis fabulae, vol. 2 (OCT, 1981)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Euripides Trag. (c. 5 B.C.), Ion (0006: 046) "Euripidis fabulae, vol. 2", Ed. Diggle, J. Oxford: Clarendon Press, 1981.'

english:
  primary:
    id: coleridge
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg010.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "232", by: "233" }
      - { greek: "721", by: "676" }
      - { greek: "81", by: "41" }
  secondary:
    id: way
    text_fixes:
      - find: "abiding, (Epode)\n"
        replace: "abiding,\n"
        note: "John 2026-09-25: Way's strophe markers hidden, all of them"
      - find: "oft-chanted! (Ant. 2)"
        replace: "oft-chanted!"
        note: "John 2026-09-25: Way's strophe markers hidden, all of them"
      - find: "heart-burning —(Sér.)"
        replace: "heart-burning"
        note: "John 2026-09-25: Way's strophe markers hidden, all of them; way-markers n=3: archive.org euripidesway04euriuoft page 71 (bench/way/ion.txt:1003); OCR misread Str. as Sér. and prints no dash before the marker"
      - find: "render back to thee.\n? By perpetuating the race of true-born Erechtheids, v"
        replace: "render back to thee."
        note: "way-cleanup 2026-09-25 row 1169 (S11 confirmed; brief Do:3): footnote fragment dumped in the text. The ION/Creusa mislabeling this row also names is NOT fixed here -- an english_overrides relabel (display+label: Creusa) was tried and reverted: it pushed turn_text_turn_shift_secondary from new_drifts=15 (PASS) to new_drifts=63 (FAIL), a cascade through the surrounding Ion/Creusa/Old-Servant turns too deep to resolve inside this sweep. Left for a dedicated follow-up."
      - find: "Should snatch us from men’s sight.\na.\nfs\nO hapless queen"
        replace: "Should snatch us from men’s sight.\nO hapless queen"
        note: "way-cleanup r2 2026-09-25 (round-1 check item 48 wrong): junk lines \"a.\" and \"fs\" dropped entirely rather than merged into the sentence; build/genie/euripidesway04euriuoft.txt:4050-4085 (pages 117-118) prints nothing between \"men’s sight.\" and \"O hapless queen\""
      - find: "if ill befall,\n\n‘Tis sweet to gaze"
        replace: "if ill befall,\n‘Tis sweet to gaze"
        note: "drift sweep 2 2026-09-25: the blank line is the page break before page 74 (build/genie/euripidesway04euriuoft.txt:2515-2518); Way prints 731-732 as one sentence, and the page's running head ION is dropped by line_fixes below"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/ion.txt
    play: ION
    footnotes: true
    # Drift sweep 2 (2026-09-25): the "ION" that opened 732-734 ("'Tis sweet
    # to gaze in eyes of sympathy") is the running head of page 74 of
    # euripidesway04euriuoft, not a cue: Way prints the lines inside
    # Creusa's speech, across the page break (the text_fixes entry above
    # closes the gap the break left). Without it they stay hers, beside
    # 725-734.
    line_fixes:
      1060: "‘Tis sweet to gaze in eyes of sympathy."
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # Round 2 item 12 (2026-09-18): the sweep-2026-09-08 attachment loss
  # this ceiling allowed for is gone -- earlier lanes' repairs (C15's
  # unprinted-ref seat, C17's bracketed-siglum split, and others) have
  # since attached every one of those pieces. Re-measured at 0.
  max_unresolved_mismatches: 0
  gaps:
    - "1:766"  # Creusa's "piercing pain" line has no counterpart nearby
    - "1:783"  # Creusa's "unspeakable word" line has no counterpart nearby
    - "1:766"  # no covering <l n> in the Perseus TEI
    - "1:783"  # no covering <l n> in the Perseus TEI

