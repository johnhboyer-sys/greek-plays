    "(Fourteenth) Chorus": "Chorus"
    "(Fifteenth) Chorus": "Chorus"
  english_secondary:
    "HERMES": "Hermes"
    "CHORUS": "Chorus"
    "ION": "Ion"
    "CREUSA": "Creusa"
    "XUTHUS": "Xuthus"
    "OLD SERVANT": "Old Servant"
    "SERVANT": "Servant"
    "PYTHIA": "Pythian Priestess"
