  blurb: "Antigone defies Creon's edict and buries her brother Polynices at the cost of her life."
  production: "Traditionally c. 441 BC, on a doubted anecdote"
  argument: "Antigone buries her brother against Creon’s order and is walled up alive. Creon loses his son and his wife for it."
  synopsis: "Oedipus's sons have killed each other at the gates of Thebes. Creon, now king, gives Eteocles a soldier's funeral and orders that Polynices lie unburied. Antigone buries her brother anyway and is caught. Creon will not bend, not for his son Haemon, who is to marry her, and has her walled up alive. Tiresias frightens him into relenting, too late: Antigone has hanged herself, Haemon kills himself over her body, and Creon's wife Eurydice kills herself at the news."
