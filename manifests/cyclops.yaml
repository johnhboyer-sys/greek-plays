  blurb: "Odysseus and his men land on Polyphemus' island in this satyr-play retelling of the Odyssey."
  production: "Satyr play · date unknown, perhaps c. 408 BC"
  argument: "Odysseus and his men, blown to Sicily, fall into the hands of the Cyclops Polyphemus, who keeps satyrs as slaves. Odysseus gets him drunk and puts out his eye."
  synopsis: "Odysseus and his crew land in Sicily looking for water and find the satyrs and old Silenus, enslaved by the Cyclops Polyphemus and set to herding his flocks. Silenus trades the Cyclops's food for Odysseus's wine, then blames the strangers when the master returns. Polyphemus eats two of the crew. Odysseus gets him drunk, and with a heated stake, and no help from the satyrs, puts out his eye. The Greeks and the satyrs sail off together."
