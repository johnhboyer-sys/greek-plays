    "Silenus": "Silenus"
    "Chorus": "Chorus"
    "Odysseus": "Odysseus"
    "Cyclops": "Cyclops"
    "First Half-Chorus": "First Semichorus"
    "Second Half-Chorus": "Second Semichorus"
  english_secondary:
    "SILENUS": "Silenus"
    # Item 4 (play-cyclops-findings #1): the Semichoruses exist only at
    # 635-641; everywhere else A SATYR / ANOTHER SATYR are Way's own cues
    # for the Chorus, and mapping them to First/Second Semichorus gave the
    # same speaker two colours three lines apart (findings #9, #10).
    "A SATYR": "Chorus"
    "ANOTHER SATYR": "Chorus"
    "CHORUS OF ALL THE SATYRS": "Chorus"
    "CHORUS": "Chorus"
    "ODYSSEUS": "Odysseus"
    "SATYR": "Chorus"
    "CYCLOPS": "Cyclops"
  # Greek printed sigla -> canonical display (colour key; the printed label
  # is shown as printed). Keys match after bracket/space/trailing-dot
  # normalization (stage7 _norm_siglum). '—' is attributed to no one.
  sigla:
    "—": null
    "ΣΙΛΗΝΟΣ": "Silenus"
    "Σι.": "Silenus"
    "ΧΟΡΟΣ": "Chorus"
    "Χο.": "Chorus"
    "ΟΔΥΣΣΕΥΣ": "Odysseus"
    "Οδ.": "Odysseus"
    "ΚΥΚΛΩΨ": "Cyclops"
    "Κυ.": "Cyclops"
    "Χο.α": "First Semichorus"
    "Χο.β": "Second Semichorus"

