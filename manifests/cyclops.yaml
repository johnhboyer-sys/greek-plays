  secondary:
    id: way
    text_fixes:
      - find: "we came from yonder ship.\nto\nAnd this fat rogue was ready"
        replace: "we came from yonder ship.\nAnd this fat rogue was ready"
        note: "way-cleanup r2 2026-09-25 (round-1 check item 49 wrong): the bilingual scan underlying this bench file (docs/bench.md, vol. 2 euripides0002arth_djvu.txt:28820-28895) ends the English page (545) at \"yonder ship.\" and opens the facing page (546, heading CYCLOPS) clean at \"And this fat rogue\"; the one-word \"to\" sits with the Greek-side page number/catchword between them and is not part of either sentence"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/cyclops.txt
    play: CYCLOPS
    footnotes: true
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # Round 2 item 12 (2026-09-18): the sweep-2026-09-08 attachment loss
  # this ceiling allowed for is gone -- earlier lanes' repairs (C15's
  # unprinted-ref seat, C17's bracketed-siglum split, and others) have
  # since attached every one of those pieces. Re-measured at 0.
  max_unresolved_mismatches: 0
