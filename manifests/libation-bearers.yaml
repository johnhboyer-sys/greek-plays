  argument: "Orestes comes home to avenge his father and kills his mother."
  synopsis: "Years later Orestes, grown up in exile, comes back to Argos with Pylades and meets his sister Electra at their father's grave, where Clytaemestra has sent her with offerings to quiet a bad dream. Apollo has ordered Orestes to avenge Agamemnon. Brother and sister plan the killing, and Orestes goes to the palace door as a stranger bringing news of his own death. He kills Aegisthus, then his mother. The Furies appear to him alone, and he runs."
