  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Aeschylus Trag. (c. 6-5 B.C.), Choephoroe (0085: 006) "Aeschyli tragoediae, 2nd edn.", Ed. Murray, G. Oxford: Clarendon Press, 1955, Repr. 1960.'

english:
  primary:
    id: smyth
    text_fixes:
      - find: "house. and I am freed"
        replace: "house. Look, the light has come, and I am freed"
        note: "sweep 2026-09-24 n=39: sources/perseus/tlg0085.tlg006.perseus-eng2.xml:1445-1449"
      - find: "! Footprints>matching eac"
        replace: "! Footprints matching eac"
        note: "sweep 2026-09-24 n=130: sources/perseus/tlg0085.tlg006.perseus-eng2.xml:388"
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg006.perseus-eng2.xml"
    anchor_model: sp-line
    cuts:
      # 2026-09-26: 503 opens mid-line in smyth's <l n=500>; cut seats it (s15 triage).
      - { greek: "503", english: "and let not this seed" }
    footnotes: true
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "508", by: "503" }
      - { greek: "871", by: "870" }
      - { greek: "872", by: "870" }
  secondary:
    id: morshead
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/libation-bearers.txt
    play: THE LIBATION-BEARERS
    footnotes: false
    # Item 7 (play-libation-bearers-findings #2): still slides on this
    # branch head -- 380 and 386 print bare with no coverage note, and
    # every later segment shows the previous-but-one speech.
    pins:
      - { greek: "380", english: "That hath sped thro' mine ear, like a shaft from a bow!", run: 1 }
      # καὶ πότ' ἂν ἀμφιθαλὴς (394): Morshead gives the stanza to Orestes, Murray to Electra, so the pairer seated it two turns on at 405 and left 394 bare. This one pin also reseats the five stanzas after it (400, 405, 410, 418, 423), each read against the Greek 2026-09-21.
      - { greek: "394", english: "Zeus, thou alone to us art parent now.", run: 1 }
  third:
    id: kosmos
    name: "Erdman, rev. Nagy (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/libation-bearers.txt
    play: LIBATION BEARERS
    footnotes: false
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
        Gregory Nagy. Reproduced without change under CC BY-NC-ND 3.0:
        https://creativecommons.org/licenses/by-nc-nd/3.0/ . This site gives credit and is non-commercial. Every translator and reviser is credited in sources/INVENTORY.md and on the attribution page.
      source_url: https://kosmossociety.org/libation-bearers-aeschylus/
  overlays:
    - id: johnston
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/libation-bearers.txt
      play: LIBATION BEARERS
      footnotes: false
      pins:
        # ἄκου', ὑπὲρ σοῦ τοιάδ' ἔστ' ὀδύρματα (508): Johnston gives the lines to Orestes where Murray has Electra, so "Hear us!" opens 510 beside the Chorus.
        - { greek: "508", english: "Hear us!", run: 1 }
        # Drift sweep 2 (2026-09-25): Johnston gives the corks simile (505-507)
        # to Electra where Murray runs Orestes' speech on from 503, so it sat
        # beside 508-509 with "Hear us!". Pinned, it follows 503-504 inside
        # Murray's 503-507.
        - { greek: "503", english: "For to a man that’s dead his children", run: 1 }
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
          general readers, teachers, students, and performing artists may
          download any material on johnstonia web pages without permission and
          without charge, provided they do not use the material in a commercial
          publication." Credited in sources/INVENTORY.md and on the attribution
          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

