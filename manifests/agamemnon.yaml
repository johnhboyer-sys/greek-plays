  blurb: "Agamemnon returns from Troy in triumph, and his wife Clytaemestra kills him."
  production: "Oresteia, first play · City Dionysia, 458 BC · first prize"
  argument: "Agamemnon comes home from Troy after ten years. Clytaemestra kills him in his bath."
  synopsis: "A watchman on the palace roof at Argos sees the beacon that means Troy has fallen. Clytaemestra has ruled ten years in her husband's absence and has not forgotten that Agamemnon sacrificed their daughter Iphigenia to get the fleet to Troy. Agamemnon comes home with the captive prophetess Cassandra. His wife spreads crimson cloth for him to walk on into the house, and kills him there, in his bath, with Cassandra after him. She and her lover Aegisthus face down the elders and take the city."
