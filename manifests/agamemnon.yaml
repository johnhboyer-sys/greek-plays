# Agamemnon — pipeline manifest (P1: the `play-line` citation scheme's first
# and, for this phase, only work — docs/p1-probe.md is the measured design
# authority this manifest implements). P2 adds Smyth's line-anchored English.
#
# The export (build/export/tlg0085/Diogenes-Resources/xml/tlg/tlg0085005.xml,
# already run — drama_pipeline never invokes Diogenes itself, see
# stage1_greek.run_export) carries NO wrapping div at all: <body> holds a
# flat sequence of <l n="…"> lines directly (docs/p1-probe.md's "Document
# shape"). The work is bookless (`books: 1`) — the citable unit is the
# printed lineref itself, not a page/column composition.
#
# Three play-line hazards, all declared below exactly as CPR's verse-line
# manifests declare their own:
#   * a title-drop (`<l n="t">`, Murray's all-caps "ΑΓΑΜΕΜΝΩΝ") —
#     `citation.title_labels` hash-declares it, gated bidirectionally by
#     stage1_greek._parse_play.
#   * ONE real transposition (line 1290 is printed one position early, before
#     1284 — verified against the export): `citation.transpositions`
#     declares the EXACT block stage1_greek._derive_play_line_transposed_
#     blocks computes from the real document order, `{start: "1284", end:
#     "1289", before: "1290"}` — the ascending run 1284-1289 sits below the
#     running maximum 1290 set one ref earlier (the same convention CPR's
#     own worked DRN examples use, not "1290" itself, which at the moment
#     it's read is simply a new maximum).
#   * NO lacunae ("post N" placeholder lines) in this play — `citation.
#     lacunae` is an explicit empty list, verified against the export (zero
#     "post N" tokens), not an omission.
#   * `citation.fingerprint` pins the observed spine's printed-lineref LIST
#     (count + sha256 over every emitted line's own `ref`, document order,
#     never re-sorted) — preflight's dist-level re-export-drift tripwire,
#     the same role DRN's fingerprint plays for verse-line.

work:
  id: agamemnon
  title: Agamemnon
  author: aeschylus
  language: grc
  tlg_author: "0085"
  tlg_work: "005"
  greek_edition: "Murray, Aeschyli tragoediae, 2nd ed. (OCT, 1955)"
  lexicon: true
  # FATAL sourceDesc gate (De Officiis/DRN precedent) — verified verbatim
  # against the real export's <sourceDesc>.
  expected_sourcedesc: 'Aeschylus Trag. (c. 6-5 B.C.), Agamemnon (0085: 005) "Aeschyli tragoediae, 2nd edn.", Ed. Murray, G. Oxford: Clarendon Press, 1955, Repr. 1960.'

english:
  primary:
    id: smyth
    text_fixes:
      - find: "Then do not be be ashamed of mortal r"
        replace: "Then do not be ashamed of mortal r"
        note: "sweep 2026-09-24 n=42: sources/perseus/tlg0085.tlg005.perseus-eng3.xml:967"
    name: "H. W. Smyth (Loeb, 1926)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg005.perseus-eng3.xml"
    anchor_model: sp-line
    footnotes: true
    # Turn-starts triage (2026-09-26): 1662-1672. Smyth numbers Aegisthus's
    # reply 1655 and every later line one or more low, so each speech sat
    # one turn early. Each line is keyed to the Greek it renders.
    line_fixes:
      "1655": "1662"  # ἀλλὰ τούσδε μοι ματαίαν γλῶσσαν — But to think that these men
      "1662": "1665"  # οὐκ ἂν Ἀργείων τόδ' εἴη — It would not be like men of Argos
      "1665": "1666"  # ἀλλ' ἐγώ σ' ... μέτειμ' ἔτι — Ha! I will visit you with vengeance
      "1666": "1667"  # οὔκ, ἐὰν δαίμων Ὀρέστην — Not if fate shall guide Orestes
      "1667": "1668"  # φεύγοντας ἄνδρας ἐλπίδας — exiles feed on hope
      "1668": "1669"  # πρᾶσσε, πιαίνου — Keep on, grow fat
      "1669": "1670"  # δώσων ἄποινα — Know that you shall atone
      "1670": "1671"  # κόμπασον θαρσῶν — Brag in your bravery
      "1671": "1672"  # μὴ προτιμήσῃς — Do no care for their idle yelpings
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered: []
  secondary:
    id: morshead
    text_fixes:
      - find: "Curelessabhorred, that"
        replace: "Cureless, abhorred, that"
        note: "sweep 2026-09-24 n=86: sources/archive-org/houseofatreusbei00aesc.txt:4089 (1904 ed. scan); cf. sources/wikisource/morshead/agamemnon.html"
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/agamemnon.txt
    play: AGAMEMNON
    footnotes: false
    # S11 sweep row 1331 (2026-09-25): Agamemnon's entrance speech (810-854,
    # printed as two AGAMEMNON speeches, "First, as is meet" and "I speak not
    # idly" at 838) sat 28 lines early at 782, beside the Chorus's greeting.
    pins:
      - { greek: "810", english: "First, as is meet, a king's All-hail be said", run: 1 }
  third:
    id: kosmos
    name: "Smyth, rev. Crane, Bird & Nagy (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/agamemnon.txt
    play: AGAMEMNON
    footnotes: false
    # Drift sweep 4 (2026-09-26): the whole first stasimon (355-487) sat in
    # the 351 row, and Clytemnestra's 489-500 (Kosmos gives it to her; the
    # edition to the Chorus) was spread over 355-475. The pin seats "We shall
    # soon know" on τάχ' εἰσόμεσθα (489); each cut opens a stanza on its Greek.
    pins:
      - { greek: "489", english: "We shall soon know about this passing on", run: 1 }
    cuts:
      - { greek: "355", english: "Hail, sovereign Zeus" }           # ὦ Ζεῦ βασιλεῦ
      - { greek: "367", english: "“The stroke of Zeus" }            # Διὸς πλαγὰν
      - { greek: "420", english: "Apparitions causing sorrow" }     # ὀνειρόφαντοι δὲ πειθήμονες
      - { greek: "475", english: "– Heralded by a beacon" }         # πυρὸς δ' ὑπ' εὐαγγέλου
      - { greek: "479", english: "—Who is so childish" }            # τίς ὧδε παιδνὸς
      - { greek: "483", english: "—It is just like a woman" }       # γυναικὸς αἰχμᾷ πρέπει
      # Drift sweep 4 (2026-09-26): the Chorus's votes after the murder
      # (1346-1371) are one Kosmos turn parted by "–" dashes, and every vote
      # sat one to three rows early (the tyranny, 1354-1355, at 1352). A cut
      # at each dash seats each vote on its Greek, as the Smyth column has it.
      - { greek: "1348", english: "– I tell you my advice" }        # ἐγὼ μὲν ὑμῖν τὴν ἐμὴν γνώμην
      - { greek: "1350", english: "– To my thinking we must burst in" }  # ἐμοὶ δ' ὅπως τάχιστα
      - { greek: "1352", english: "– I, too, am for taking part" }  # κἀγὼ τοιούτου γνώματος
      - { greek: "1354", english: "– It is plain" }                 # ὁρᾶν πάρεστι
      - { greek: "1356", english: "– Yes, because we are wasting time" }  # χρονίζομεν γάρ
      - { greek: "1358", english: "– I know not what plan" }        # οὐκ οἶδα βουλῆς
      - { greek: "1360", english: "– I too am of this mind" }       # κἀγὼ τοιοῦτός εἰμ'
      - { greek: "1362", english: "– What?" }                       # ἦ καὶ βίον τείνοντες
      - { greek: "1364", english: "– No, it is not to be endured" } # ἀλλ' οὐκ ἀνεκτόν
      - { greek: "1366", english: "– And shall we, upon the evidence" }  # ἦ γὰρ τεκμηρίοισιν
      - { greek: "1368", english: "– We should be sure of the facts" }  # σάφ' εἰδότας χρὴ
      - { greek: "1370", english: "– I am supported on all sides" } # ταύτην ἐπαινεῖν πάντοθεν
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
        Gregory Nagy. Reproduced without change under CC BY-NC-ND 3.0:
        https://creativecommons.org/licenses/by-nc-nd/3.0/ . This site gives credit and is non-commercial. Every translator and reviser is credited in sources/INVENTORY.md and on the attribution page.
      source_url: https://kosmossociety.org/agamemnon-aeschylus/
  overlays:
    - id: johnston
      text_fixes:
        - find: "CLYTAEMNESTR"
          replace: "CLYTAEMNESTRA"
          note: "2026-09-26: truncated cue; the owner's 2026-09-24 ruling corrects web-text typos"
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/agamemnon.txt
      play: AGAMEMNON
      footnotes: false
      # Drift sweep 2 (2026-09-25): the Chorus's anapaests (355-366, "O Zeus,
      # my king, and friendly Night") sat at 367, and the Chorus Leader's
      # 351-354 was cut in two across 351 and 355. A CHORUS cue (on the
      # source's blank line before the stanza) parts the anapaests from the
      # ode, and the pin seats each on its own Greek, read line by line:
      # 351-354 whole at 351, 355 the anapaests, 367 a blow from Zeus (to
      # 419, no beauty in statues), 420 in his dreams (to 474).
      line_fixes:
        534: "[CHORUS]"
      pins:
        - { greek: "355", english: "O Zeus, my king, and friendly Night", run: 2 }
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
          general readers, teachers, students, and performing artists may
          download any material on johnstonia web pages without permission and
          without charge, provided they do not use the material in a commercial
          publication." Credited in sources/INVENTORY.md and on the attribution
          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
    - id: murray-verse
      name: "Gilbert Murray"
      short: Murray
      model: turn-text
      format: verse-own-line
      source: bench/murray/agamemnon.txt
      play: AGAMEMNON
      footnotes: false
  # Genuinely untranslated Greek speeches (filled after the P2b attachment)
  # pass). Segment ids or printed refs; any other unmatched id fails stage2.
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

citation:
