  blurb: "Blind and exiled, Oedipus comes to rest in a grove outside Athens as his sons war over Thebes."
  production: "Produced posthumously at the City Dionysia, 401 BC, by his grandson Sophocles"
  argument: "The blind Oedipus reaches Colonus, near Athens, and dies there under Theseus’ protection."
  synopsis: "Blind, old, and exiled from Thebes, Oedipus arrives with Antigone at Colonus, a village near Athens, and knows the grove of the Furies where an oracle said his life would end. Theseus takes him under the city's protection. Then Thebes wants him: an oracle says his grave will bring power, and Creon comes to seize him and keep him on the border, kidnapping his daughters until Theseus gets them back. His son Polynices comes to beg his blessing for the march on Thebes and gets a curse instead. Thunder calls Oedipus; he walks into the grove with Theseus alone and vanishes, and his grave becomes Athens's."

