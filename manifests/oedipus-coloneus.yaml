  tlg_author: "0011"
  tlg_work: "007"
  greek_edition: "Dain & Mazon, Sophocle, vol. 3 (Belles Lettres, 1960)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Sophocles Trag. (c. 5 B.C.), Oedipus Coloneus (0011: 007) "Sophocle, vol. 3", Ed. Dain, A., Mazon, P. Paris: Les Belles Lettres, 1960, Repr. 1967 (1st edn. rev.).'

english:
  primary:
    id: jebb
    name: "R. C. Jebb (Cambridge, 1883–1900)"
    short: Jebb
    model: perseus-play
    source: "perseus/tlg0011.tlg007.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # Turn-starts triage (2026-09-26).
    line_fixes:
      "1009a": "1099"  # Ὦ πάτερ, πάτερ — Father, father (Perseus typo for 1099)
      "1747": "1748"   # φεῦ φεῦ, ποῖ μόλωμεν, ὦ Ζεῦ — Alas, alas! Zeus, where shall we turn?
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "1666", by: "1626" }
      - { greek: "183", by: "182" }
      - { greek: "533", by: "531" }
      - { greek: "1726", by: "1728" }  # Jebb's lyric numbering runs one ahead of Dain-Mazon through 1726-1750; his 1726-1727 ("Of whom? Wretched me! Of our father.") sit in 1:1728 (Lane C round 3, 2026-09-18)
  secondary:
    id: storr
    name: "F. Storr (Loeb, 1912)"
    short: Storr
    model: turn-text
    format: loeb-ocr
    source: bench/storr/oedipus-coloneus.txt
    play: OEDIPUS AT COLONUS
    footnotes: true
  third:
    id: kosmos
    text_fixes:
      - find: "Αs for the place"
        replace: "As for the place"
        note: "sweep 2026-09-24 n=63: sources/kosmos/oedipus-coloneus.html:665 (U+0391 GREEK CAPITAL ALPHA)"
    name: "Jebb, rev. Ceragioli & Nagy (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/oedipus-coloneus.txt
    play: OEDIPUS AT COLONUS
    footnotes: false
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
