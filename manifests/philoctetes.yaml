  argument: "Odysseus sends Neoptolemus to trick the wounded Philoctetes into coming to Troy with his bow."
  synopsis: "Nine years ago the Greeks abandoned Philoctetes on Lemnos with a festering wound in his foot. Now a prophecy says Troy cannot fall without him and his bow, the bow of Heracles. Odysseus brings the young Neoptolemus, Achilles' son, to trick him into sailing. Neoptolemus wins the sick man's trust, gets the bow, and cannot go through with it: he confesses, gives the bow back, and agrees to take Philoctetes home instead. Heracles appears from the sky and sends them both to Troy, where Philoctetes will be healed and kill Paris."

