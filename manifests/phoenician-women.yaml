  argument: "Polynices brings an army against Thebes to take the throne his brother Eteocles will not give up. Jocasta fails to reconcile them; they kill each other, and she kills herself."
  synopsis: "Polynices' Argive army is at the walls of Thebes to claim the year of kingship his brother Eteocles refused to hand over. Jocasta, alive in this version, arranges a truce so the brothers can meet, and argues for peace. They will not yield. The assault comes; Tiresias names the price of the city's survival, and Creon's son Menoeceus kills himself to pay it. The brothers kill each other in single combat, and Jocasta kills herself over the bodies. Creon banishes the blind Oedipus, and Antigone goes with him."

