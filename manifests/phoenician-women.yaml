english:
  primary:
    id: coleridge
    text_fixes:
      - find: " brought me to to the paterna"
        replace: " brought me to the paterna"
        note: "sweep 2026-09-24 n=114: sources/perseus/tlg0006.tlg015.perseus-eng2.xml:369"
      - find: " father, do you you hear what I"
        replace: " father, do you hear what I"
