    model: perseus-play
    source: "perseus/tlg0006.tlg015.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # Turn-starts triage (2026-09-26): Coleridge's 1740 renders 1740-1744 and
    # folds Oedipus's 1740 into Antigone's speech; seat it with her 1741.
    line_fixes:
      "1740": "1741"  # ἐς πατρός γε συμφορὰς εὐκλεᾶ — will make me famous
      # Speaker-repair sweep (2026-09-28): Coleridge gives 1336 to Creon, the
      # edition to the Chorus; the heuristic had moved it to Creon's 1338,
      # leaving its own Greek bare (the old covered entry below).
      "1336": "1336"  # οἰχόμεσθ'· οὐκ εὐπροσώποις φροιμίοις — We are lost; your opening words
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "1740", by: "1741" }
  secondary:
    id: way
    text_fixes:
      - find: "Sphinx’s blood- polluted might"
        replace: "Sphinx’s blood-polluted might"
        note: "way-cleanup 2026-09-25 row 903 (S11 confirmed): the scan's own line-wrap split this compound; genie build/genie/euripidesway03euriuoft.txt:16177-16177 prints it unsplit elsewhere"
      - find: "thus to wail? What. profits vainly"
        replace: "thus to wail? What profits vainly"
        note: "way-cleanup r2 2026-09-25 (S11 confirmed, ex-mechanical-rule): build/genie/euripidesway03euriuoft.txt:16181 prints \"What profits\" with no stray stop"
      - find: "but mortal:needs must"
        replace: "but mortal needs must"
        note: "way-cleanup r3 2026-09-25 (1:1758): archive.org page prints \"Whoso is but mortal needs must\" with no colon at all; round-1's fix (row 903) only spaced the glued colon instead of dropping it"
      - find: "* Lightly his arm doth sway ?"
        replace: "Lightly his arm doth sway ?"
        note: "way-cleanup r3 2026-09-25 (1:141): genie build/genie/euripidesway03euriuoft.txt:11301 prints no mark before \"Lightly\""
      - find: "*Thou child Menoeceus, son of C"
        replace: "Thou child Menoeceus, son of C"
        note: "way-cleanup r3 2026-09-25 (1:1130): genie build/genie/euripidesway03euriuoft.txt:13547 prints no mark before \"Thou\""
      - find: "*Twere shame that men no oracles constrain,"
        replace: "’Twere shame that men no oracles constrain,"
        note: "way-cleanup r3 2026-09-25 (1:1357): genie build/genie/euripidesway03euriuoft.txt:14037 prints the elision \"'Twere\""
      - find: "* And dirge to death-dirge, each to each replying"
        replace: "And dirge to death-dirge, each to each replying"
        note: "way-cleanup r3 2026-09-25 (1:1398): genie build/genie/euripidesway03euriuoft.txt:14115 prints no mark before \"And\" (Grok r2 sample 26 confirmed)"
      - find: "*Neath mine eyes, when I rushed in the bacchanal"
        replace: "’Neath mine eyes, when I rushed in the bacchanal"
        note: "way-cleanup r3 2026-09-25 (1:1931): genie build/genie/euripidesway03euriuoft.txt:15359 prints the elision \"'Neath\""
      - find: "with banishment ?]"
        replace: "with banishment ?"
        note: "way-cleanup 2026-09-25 row 1365 (S11 confirmed): stray closing bracket with no opening one"
      - find: "be hindrance not in- thee."
        replace: "be hindrance not in thee."
        note: "way-cleanup 2026-09-25: genie build/genie/euripidesway03euriuoft.txt:13990 prints \"in thee\" with no hyphen"
      - find: "- Needs must thou. Whither from the couch wilt flee?"
        replace: "Needs must thou. Whither from the couch wilt flee?"
        note: "way-cleanup 2026-09-25: standalone stray hyphen after the CREON cue; genie build/genie/euripidesway03euriuoft.txt:13990 prints no hyphen there"
      - find: "ear, _[near.\n"
        replace: "ear, _[near.]_\n"
        note: "sweep 2026-09-24 n=66: build/genie/euripidesway03euriuoft.txt:11780"
      - find: "sister mine,\n_ In"
        replace: "sister mine,\nIn"
        note: "sweep 2026-09-24 n=65: build/genie/euripidesway03euriuoft.txt:15277-15279"
      - find: "within thy land,— _\n"
        replace: "within thy land,—\n"
        note: "sweep 2026-09-24 n=64: build/genie/euripidesway03euriuoft.txt:15078-15081"
      - find: "lance. 140}"
        replace: "lance."
        note: "sweep 2026-09-24 n=35: build/genie/euripidesway03euriuoft.txt:11369; 140 is the scan's margin line number, not text"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/phoenician-women.txt
    play: PHOENICIAN MAIDENS
    footnotes: true
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
