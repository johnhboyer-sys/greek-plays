  blurb: "Chained to a crag for stealing fire, Prometheus defies Zeus and foretells his fall."
  production: "Date unknown · authorship disputed"
  argument: "Zeus has Prometheus chained to a rock at the edge of the world for giving fire to men."
  synopsis: "For giving fire to men, Prometheus is nailed to a rock at the edge of the world on Zeus's orders. Visitors come to the crag: the daughters of Ocean, Ocean himself, and Io, the girl Zeus loved, now horned and driven over the earth by Hera's gadfly. To her Prometheus tells the future, and that Zeus will one day fall to a son of his own; he knows how, and will not say. Hermes comes to demand the secret. Prometheus refuses, and Zeus sinks him, rock and all, into the earth."
