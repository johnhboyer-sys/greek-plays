# Prometheus vinctus (Aeschylus, TLG 0085: 003) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0085/Diogenes-Resources/xml/tlg/tlg0085003.xml),
# verified by two `all --work prometheus-bound --public` runs (docs/p2-greek-report.md).

work:
  id: prometheus-bound
  title: "Prometheus Bound"
  author: aeschylus
  language: grc
  tlg_author: "0085"
  tlg_work: "003"
  greek_edition: "Murray, Aeschyli tragoediae, 2nd ed. (OCT, 1955)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Aeschylus Trag. (c. 6-5 B.C.), Prometheus vinctus (0085: 003) "Aeschyli tragoediae, 2nd edn.", Ed. Murray, G. Oxford: Clarendon Press, 1955, Repr. 1960.'

english:
  primary:
    id: smyth
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg003.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: true
    # Drift sweep 2 (2026-09-25): 377-393. Smyth numbers the Oceanus
    # stichomythia two lines ahead of Murray, and the bare numbers ran it a
    # line late from 381 to 392 (383 bare, "Do you not know" cut from its
    # "words are the physicians"). Each of his lines is keyed to the Murray
    # line it renders, read against the Greek.
    line_fixes:
      "379": "377"    # οὔκουν, Προμηθεῦ — Do you not know then, Prometheus
      "380": "378"    # ὀργῆς νοσούσης — words are the physicians
      "381": "379"    # ἐάν τις ἐν καιρῷ — If one softens the soul in season
      "383": "381"    # ἐν τῷ προθυμεῖσθαι — What lurking mischief
      "385": "383"    # μόχθον περισσὸν — Lost labor
      "386": "384"    # ἔα με τῇδε τῇ νόσῳ — Leave me to be affected
      "388": "386"    # ἐμὸν δοκήσει — This fault will be seen to be my own
      "389": "387"    # σαφῶς μ' ἐς οἶκον — Clearly the manner of your speech
      "390": "388"    # μὴ γάρ σε θρῆνος — So that you won't win enmity
      "391": "389"    # ἦ τῷ νέον θακοῦντι — In the eyes of the one newly seated
      "392": "390"    # τούτου φυλάσσου — Beware lest the time come
      "393": "391"    # ἡ σή, Προμηθεῦ — Your plight, Prometheus
      "394": "392"    # στέλλου, κομίζου — Go away, depart
      "395": "393"    # ὁρμωμένῳ μοι — Your urging meets my eagerness
      # Drift sweep 4 (2026-09-26): 246-259, the stichomythia after the
      # Chorus's pity. Smyth numbers it two lines ahead of Murray, so each
      # line sat two rows late (246-247 bare, "Yes, to my friends" at 248).
      # Each line is keyed to the Murray line it renders, read against the
      # Greek; this replaces the covered entries 246 by 248 and 247 by 249.
      "248": "246"    # καὶ μὴν φίλοις ἐλεινὸς — Yes, to my friends
      "249": "247"    # μή πού τι προύβης — Did you perhaps transgress
      "250": "248"    # θνητούς γ' ἔπαυσα — I caused mortals to cease foreseeing
      "251": "249"    # τὸ ποῖον εὑρὼν — Of what sort was the cure
      "252": "250"    # τυφλὰς ἐν αὐτοῖς ἐλπίδας — blind hopes
      "253": "251"    # μέγ' ὠφέλημα — A great benefit
      "254": "252"    # πρὸς τοῖσδε μέντοι πῦρ — In addition, I gave them fire
      "255": "253"    # καὶ νῦν φλογωπὸν πῦρ — Do creatures of a day now have fire
      "256": "254"    # ἀφ' οὗ γε πολλὰς ἐκμαθήσονται τέχνας — learn many arts
      "257": "255"    # τοιοῖσδε δή σε Ζεὺς — on a charge like this that Zeus
      "258": "256"    # αἰκίζεταί γε — Torments me
      "259": "257"    # οὐδ' ἔστιν ἄθλου τέρμα — And is there no end
      "260": "258"    # οὐκ ἄλλο γ' οὐδέν — No, none except
      "261": "259"    # δόξει δὲ πῶς; — But how will it seem good to him
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered: []
  secondary:
    id: morshead
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/prometheus-bound.txt
    play: PROMETHEUS BOUND
    footnotes: false
    # Drift sweep 4 (2026-09-26): with Smyth's 246-259 keyed to the Greek,
    # Morshead's stichomythia follows onto its own rows. His Chorus asks
    # 255-257 in one speech ("Then, upon imputation of such guilt, / Doth
    # Zeus without surcease torment thee thus? / Is there no limit"), so it
    # opens on τοιοῖσδε δή σε Ζεὺς (255), and Prometheus's "None, till his
    # own will" keeps οὐκ ἄλλο γ' οὐδέν (258). The cuts give each of the
    # Chorus's three lines its Greek: 256 αἰκίζεταί (torment), 257 οὐδ'
    # ἔστιν ἄθλου τέρμα (no limit).
    pins:
      - { greek: "255", english: "Then, upon imputation of such guilt", run: 1 }
      - { greek: "258", english: "None, till his own will shall decree an end", run: 1 }
    cuts:
      - { greek: "256", english: "Doth Zeus without surcease" }
      - { greek: "257", english: "Is there no limit" }
  third:
    id: johnston
    name: "Ian Johnston (VIU)"
    short: Johnston
    model: turn-text
    format: verse-own-line
    source: bench/johnston/prometheus-bound.txt
    play: PROMETHEUS BOUND
    footnotes: false
    # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Ian Johnston (Vancouver Island University), johnstonia pages: "All
        general readers, teachers, students, and performing artists may
        download any material on johnstonia web pages without permission and
        without charge, provided they do not use the material in a commercial
        publication." Credited in sources/INVENTORY.md and on the attribution
        page.
      source_url: https://web.viu.ca/johnstoi/copyright.htm
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

