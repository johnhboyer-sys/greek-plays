  synopsis: "Athens has no good tragic poets left; Euripides and Sophocles have both died within the year. Dionysus, patron of the theatre, sets out for Hades to bring Euripides back, dressed as Heracles, with his slave Xanthias and a donkey. Getting there takes the first half. In Hades he finds Euripides and Aeschylus disputing the throne of tragedy and is made the judge. They weigh lines on a scale and are asked for advice on saving the city. Dionysus chooses Aeschylus and takes him back to Athens."
