    copyAbbr: "Eur. IT"
  blurb: "Saved from sacrifice at Aulis, Iphigenia serves a foreign goddess until her brother arrives."
  production: "c. 414 BC"
  argument: "Iphigenia, a priestess among the Taurians, is about to sacrifice a Greek stranger who turns out to be her brother. Together they steal the goddess's image and escape."
  synopsis: "Iphigenia was not killed at Aulis: Artemis carried her off to the Taurians on the Black Sea, where she serves as priestess and any Greek who lands is sacrificed. Orestes and Pylades land, sent by Apollo to steal the goddess's image, and are captured. Iphigenia questions the prisoners about Argos and decides to spare one to carry a letter home. The letter is addressed to Orestes, and brother and sister know each other. They trick King Thoas with a purification rite, escape with the image, and Athena stops the pursuit."
