english:
  primary:
    id: coleridge
    text_fixes:
      - find: "ill take it to to Argos, for "
        replace: "ill take it to Argos, for "
        note: "sweep 2026-09-24 n=87: sources/perseus/tlg0006.tlg013.perseus-eng2.xml:654"
      - find: "at I myself have have seen and sh"
        replace: "at I myself have seen and sh"
        note: "sweep 2026-09-24 n=88: sources/perseus/tlg0006.tlg013.perseus-eng2.xml:1022"
      - find: "en daughter of of Leto and Ze"
        replace: "en daughter of Leto and Ze"
        note: "sweep 2026-09-24 n=89: sources/perseus/tlg0006.tlg013.perseus-eng2.xml:1563"
      - find: " have to do the the flight of t"
        replace: " have to do with the flight of t"
        note: "sweep 2026-09-24 n=90: sources/perseus/tlg0006.tlg013.perseus-eng2.xml:1615"
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg013.perseus-eng2.xml"
    anchor_model: sp-line
    cuts:
      # 2026-09-26: 118 opens mid-line in coleridge's <l n=116>; cut seats it (s15 triage).
      - { greek: "118", english: "but you have spoken wel" }
    footnotes: false
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "1474", by: "1435" }
    # C16 (finding 5, 2026-09-17): the TEI files Thoas's 1188 under
    # `n="188"`, between n="1187" and n="1189" -- a typo, not a line of the
    # parodos, and the bare number printed it a thousand lines early with a
    # Thoas turn inside the Chorus's ode.  Fixed before anchoring.
    line_fixes:
      "188": "1188"
  secondary:
    id: way
    text_fixes:
      - find: "* For every chance have some de"
        replace: "“For every chance have some de"
        note: "way-cleanup r3 2026-09-25 (1:760): genie build/genie/euripideswitheng02euri.txt:14915 prints an opening quote before \"For every chance\""
      - find: "* Else to thine house will I be"
        replace: "“Else to thine house will I be"
        note: "way-cleanup r3 2026-09-25 (1:778): archive.org page prints “Else to thine house will I become a curse, (Grok r2 check confirmed against the page)"
      - find: "Say—* Artemis in my place laid a hi"
        replace: "Say—“Artemis in my place laid a hi"
        note: "way-cleanup r3 2026-09-25 (1:783): genie build/genie/euripideswitheng02euri.txt:15008 prints an opening quote before \"Artemis\""
      - find: "But he, * Orestes I, her brother, son"
        replace: "But he, “Orestes I, her brother, son"
        note: "way-cleanup r3 2026-09-25 (1:1360): genie build/genie/euripideswitheng02euri.txt:17375 prints an opening quote before \"Orestes I\""
      - find: "A shout—* Ye seamen of this Hellene shi"
        replace: "A shout—“Ye seamen of this Hellene shi"
        note: "way-cleanup r3 2026-09-25 (1:1391): genie build/genie/euripideswitheng02euri.txt:17449 prints an opening quote before \"Ye seamen\""
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/iphigenia-in-tauris.txt
    play: IPHIGENEIA IN TAURICA
    footnotes: true
    # Item 7 (play-iphigenia-in-tauris-findings #1): "Keep reverent silence"
    # already lands correctly at 123 on this branch head; "Lo, I will peal on
    # high" still sits at 126 (Greek 123-125's content), a whole strophe
    # ahead of the Greek it actually renders (179ff).
    pins:
      - { greek: "123", english: "Keep reverent silence, ye", run: 1 }
      - { greek: "179", english: "Lo, I will peal on high", run: 1 }
  third:
    id: murray-verse
    name: "Gilbert Murray"
    short: Murray
    model: turn-text
    format: verse-own-line
    source: bench/murray/iphigenia-in-tauris.txt
    play: IPHIGENIA IN TAURIS
    footnotes: false
  # (`gaps: ["1:1188"]` removed 2026-09-18: the hole was the `n="188"` typo
  # above, not a gap in the translation.)

