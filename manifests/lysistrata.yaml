      # gives the prayer Ὦ πότνια, Κύπρου (833-834) to the First Woman, in
      # one speech with her Ποῦ δ' ἐστίν (835), so it opens the 835 row.
      pins:
        - { greek: "67", english: "From Anagyre.", run: 2 }
        - { greek: "69", english: "Are we too late, Lysistrata ?", run: 2 }
        - { greek: "72", english: "I scarce could find my girdle in the dark.", run: 1 }
        - { greek: "74", english: "No, no, let's wait a little", run: 2 }
    - id: johnston
      text_fixes:
        - find: "lamps.The"
          replace: "lamps. The"
          note: "sweep 2026-11-15: missing space after punctuation"
        - find: "fication of the the goddess Rec"
          replace: "fication of the goddess Rec"
          note: "sweep 2026-09-24 n=95: sources/johnston/lysistrata.htm"
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/lysistrata.txt
      play: LYSISTRATA
      footnotes: false
      # S16 drift (2026-09-26): 69-77 sat one row early, as in Hickie and
      # Rogers; the same four anchors (67, 69, 72 ἐν σκότῳ, 74).
      pins:
        - { greek: "67", english: "Those? From Anagyrus.", run: 2 }
        - { greek: "69", english: "Hey, Lysistrata, did we get here late?", run: 2 }
        - { greek: "72", english: "It was dark. I had trouble tracking down", run: 1 }
        - { greek: "74", english: "No, let’s wait a while until the women", run: 2 }
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
