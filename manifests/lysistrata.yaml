english:
  primary:
    id: athenian-society
    name: "The Eleven Comedies (The Athenian Society, 1912)"
    short: Athenian Society
    model: turn-text
    source: "gutenberg/pg8688.txt"
    play: "LYSISTRATA"
    footnotes: true
    # Item 6 pins (John, 2026-09-09: real slips are never one-offs):
    # each holds an English speech to the Greek line the reviewers matched it to.
    # Item 6 splits: the 1912 text runs these speeches together where the
    # Greek changes speaker; the tail becomes its own speech under the label.
    splits:
      - { english: "Then take this basket; put on a girdle, card wool, munch beans", speaker: "CALONICÉ" }  # Greek 535
      - { english: "Nay, never let us be cast down by calamity", speaker: "LYSISTRATA" }  # Greek 778
    # Item 6: Greek speeches whose English sits inside the neighbouring
    # speech (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "777", by: "778" }
      - { greek: "1225", by: "1228" }
      - { greek: "1295", by: "1279" }
      # Round 3 (turn-pairing-round3-2026-09-15.md, P5): Lysistrata's "would
      # not the women have done best to come?" (1:54) sits inside 1:56's
      # combined chunk, which also carries Calonice's reply and the rest of
      # the exchange.
      - { greek: "54", by: "56" }
      # Round 3: Myrrhine's flatfish oath ("though I must be split in two
      # like a flat-fish...", 1:115) is the third turn inside 1:107's chunk.
      - { greek: "115", by: "107" }
    pins:
      - { greek: "97", english: "I will tell you. But first answer me one question.", run: 1 }
      - { greek: "102", english: "Mine has been the last five months in Thrace", run: 1 }
      - { greek: "104", english: "'Tis seven long months since mine left me for Pylos", run: 1 }
      - { greek: "105", english: "As for mine, if he ever does return from service", run: 1 }
      - { greek: "107", english: "And not so much as the shadow of a lover", run: 1 }
      - { greek: "119", english: "Refrain from what? tell us, tell us!", run: 1 }
      - { greek: "119", english: "But will you do it?", run: 1 }
      - { greek: "129", english: "No, I will not do it; let the War go on.", run: 1 }
      - { greek: "124", english: "We must refrain from the male organ altogether", run: 1 }
      - { greek: "207", english: "Now, my dears, let me swear first, if you please.", run: 1 }
      - { greek: "352", english: "Ah, ha! here's something new! a swarm of women stand posted outside", run: 1 }
      - { greek: "375", english: "You put out my fire--you!", run: 1 }
      - { greek: "375", english: "Yes, you shall soon see.", run: 1 }
      - { greek: "381", english: "Burn off her hair for her! Water, do your office!", run: 1 }
      - { greek: "382", english: "Was it hot?", run: 1 }
      - { greek: "384", english: "I'm watering you, to make you bloom afresh", run: 1 }
      - { greek: "535", english: "Then take this basket; put on a girdle, card wool, munch beans", run: 1 }
      - { greek: "769", english: "Silence then! Now--\"Whenas the swallows, fleeing before the hoopoes", run: 1 }
      - { greek: "931", english: "I am just unfastening my girdle. But remember what you promised me about making Peace", run: 1 }
      - { greek: "942", english: "Oh! in Apollo's name, I don't much like the smell of it", run: 1 }
      - { greek: "1043", english: "We desire, Athenians, to speak ill of no man", run: 1 }
      - { greek: "1108", english: "Needless to call her; she has heard your voices, and here she comes.", run: 1 }
      - { greek: "1108", english: "Hail, boldest and bravest of womankind!", run: 1 }
      - { greek: "1189", english: "Embroidered stuffs, and dainty tunics, and flowing gowns", run: 1 }
      - { greek: "1216", english: "Go your way, I tell you. Why, bless me, they're sitting down now", run: 1 }
      - { greek: "1222", english: "No, no, you must be off--or I'll tear your hair out", run: 1 }
      - { greek: "130", english: "No, I will not do it; let the War go", run: 1 }
      - { greek: "774", english: "But if dissension do arise among the swallows", run: 1 }
      - { greek: "1106", english: "Needless to call her; she has heard your voices", run: 1 }
      - { greek: "67", english: "They are from Anagyra.", run: 2 }
      - { greek: "69", english: "Are we late, Lysistrata? Tell us, pray; what, not a word?", run: 2 }
      - { greek: "72", english: "I could not find my girdle in the dark.", run: 1 }
      - { greek: "74", english: "No, but let us wait a moment more", run: 2 }
      - { greek: "93", english: "But who has called together this council of women, pray?", run: 3 }
  secondary:
    id: lindsay
    name: "Jack Lindsay (1925)"
    short: Lindsay
    model: turn-text
    source: "gutenberg/pg7700.txt"
    play: LYSISTRATA
    footnotes: false
    # S16 drift (2026-09-26): 207-220 sat one to five rows late (207 bare).
    # Lindsay swaps the speakers of 207-208, and his rhymed oath leaves out
    # 221-224 (ὅπως ἂν ἁνὴρ ἐπιτυφῇ, κοὐδέποθ' ἑκοῦσα), so those rows stay
    # empty. Held to their Greek: Ἐᾶτε πρώτην μ' (207), Μὰ τὴν Ἀφροδίτην
    # οὔκ (208; his "grasp the brim" and first oath line follow in that
    # row, 209-212), Calonice's echo οὔτε μοιχὸς οὔτ' ἀνήρ (213) and the
    # pairs after it through κροκωτοφοροῦσα (220), ἐὰν δέ μ' ἄκουσαν
    # βιάζηται (225). The quotes run into the next turn where Calonice
    # repeats Lysistrata's words.
    pins:
      - { greek: "207", english: "Now, dears, if you will let me, I'll speak first.", run: 1 }
      - { greek: "208", english: "Only if you draw the lot, by Aphrodite!", run: 1 }
      - { greek: "213", english: "To husband or lover I'll not open arms Though love and denial", run: 7 }
      - { greek: "225", english: "If then he seizes me by dint of force, If then he seizes", run: 1 }
  third:
    id: hickie
    name: "W. J. Hickie (Bohn, 1853)"
    short: Hickie
    model: turn-text
    format: loeb-ocr
    source: "bench/hickie/lysistrata.txt"
    play: "LYSISTRATA"
    # John's own 2026-09-14 retirement of the old bench kept Hickie's own
    # footnotes off in every play (the reader shows only one footnotes.json
    # per play, and the primary already carries its own); the bench text
    # still keeps every note as a [n] marker + Footnotes: block.
    footnotes: false
    # Measured 0.790 (sweep 2026-09-17, Genie rebuild): Hickie's own prose
    # habit of running two or three short Greek turns into one flowing
    # English sentence (most visible in the fast stichomythia exchanges)
    # pairs a real turn-by-turn fraction lower than the verse columns on
    # this same play. Declared AT the measured value on purpose, same as
    # Rogers's own floor elsewhere: the gap is on record here, and a
    # regression that loses more pairs still fails the build.
    min_pairing_rate: 0.789
    max_turn_shift_rate: 0.135
    # (rate measured 0.7896; floor set just under it)
    # S16 drift (2026-09-26): 69-77 sat one row early (Myrrhina's girdle,
    # 72, at 69). Held to their Greek as the primary is: Ἀναγυρουντόθεν
    # (67), Μῶν ὕστεραι πάρεσμεν (69), Μόλις γὰρ ηὗρον ἐν σκότῳ τὸ ζώνιον
    # (72), Μὰ Δί' ἀλλ' ἐπαναμείνωμεν (74).
    pins:
      - { greek: "67", english: "From Anagyrus.", run: 2 }
      - { greek: "69", english: "Surely we have not come too late, Lysistrata?", run: 2 }
      - { greek: "72", english: "I had great difficulty in finding my girdle", run: 1 }
      - { greek: "74", english: "No, by Jove; but let us wait", run: 2 }
  overlays:
    - id: rogers
      name: "B. B. Rogers (Loeb, 1924)"
      short: Rogers
      model: turn-text
      format: loeb-ocr
      source: "bench/rogers/lysistrata.txt"
      play: "THE LYSISTRATA"
      footnotes: true
      # S16 drift (2026-09-26): 69-77 sat one row early, as in Hickie; the
