  blurb: "The women of Greece go on sex strike to end the war, and it works."
  production: "411 BC, probably at the Lenaia · result unknown"
  argument: "The women of Greece refuse sex until the men make peace."
  synopsis: "Lysistrata has called the women of Greece to Athens with a plan to end the war: no sex until the men make peace. Getting them to agree is the first battle. The older women seize the Acropolis and the treasury. The men lay siege, the women hold out, and the strike begins to tell on both sides; a Spartan herald arrives in visible distress. Spartan and Athenian envoys come to Lysistrata, who divides Greece up between them on the body of a girl called Reconciliation, and both sides go off to a feast and their wives."

