  blurb: "Abandoned by Jason for a royal marriage, Medea kills his bride and their own two sons."
  production: "City Dionysia, 431 BC · third prize, behind Euphorion and Sophocles"
  argument: "Jason has left Medea for a Corinthian princess. Medea kills the bride, and then her own two sons."
  synopsis: "Jason has left Medea, who gave up her home and her family for him, to marry the daughter of Creon, king of Corinth. Creon orders Medea and her two sons into exile that day. She begs for and gets one day's grace. Aegeus of Athens passes through and promises her refuge. With the escape secured, Medea sends the bride a poisoned robe and crown, which kill her and Creon, then kills her own two sons so that Jason will have nothing. She escapes in the Sun's chariot with their bodies, to bury them where he cannot reach them, and goes on to Athens."

