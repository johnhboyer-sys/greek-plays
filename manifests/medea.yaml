      - { ref: "386", find: "εἶἑν", replace: "εἶεν", note: "scan _0120: prints εἶεν; OCR stray rough breathing on the second vowel" }
      - { ref: "683", find: "Tροζηνίας", replace: "Τροζηνίας", note: "scan _0132: prints Τροζηνίας; OCR read the capital as Latin T, which breaks the word" }
