# Orestes (Euripides, TLG 0006: 049) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0006/Diogenes-Resources/xml/tlg/tlg0006049.xml),
# verified by two `all --work orestes --public` runs (docs/p2-greek-report.md).

work:
  id: orestes
  title: Orestes
  author: euripides
  language: grc
  tlg_author: "0006"
  tlg_work: "049"
  greek_edition: "Diggle, Euripidis fabulae, vol. 3 (OCT, 1994)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Euripides Trag. (c. 5 B.C.), Orestes (0006: 049) "Euripidis fabulae, vol. 3", Ed. Diggle, J. Oxford: Clarendon Press, 1994.'

english:
  primary:
    id: coleridge
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg016.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    # Coleridge's l n="1291" ("Keep a better look-out; it is not a contest of
    # sitting still...") renders Greek 1292-1293 (σκέψασθέ νυν ἄμεινον· οὐχ
    # ἕδρας ἀγών), not the lyric 1290-1291; Perseus numbers it a line early.
    # Seated at 1292 so the spoken sentence stands beside its Greek (John,
    # 2026-09-22: split the packed 1288 cell).
    # Γᾶ Γᾶ (1373) opens mid-line in Perseus's <l n=1370>; the cut gives
    # "O Earth, Earth!" its own line (John, 2026-09-28).
    cuts:
      - { greek: "1373", english: "O Earth, Earth!" }
    line_fixes:
      "1291": "1292"
      # Drift sweep 4 (2026-09-26): identity fixes (the Hippolytus 850
      # precedent). Coleridge gives 1297-1298 to the Chorus and 1299 to
      # Electra, the edition the reverse, and the speaker heuristic had moved
      # each line to the speaker it matched: "Did you hear?" sat at 1299.
      "1297": "1297"  # ἠκούσαθ'; ἅνδρες χεῖρ' ἔχουσιν ἐν φόνωι — Did you hear?
      "1298": "1298"  # Ἑλένης τὸ κώκυμ' ἐστίν — It is Helen screaming
      "1299": "1299"  # ὦ Διὸς ὦ Διὸς ἀέναον κράτος — O eternal might of Zeus
      # Speaker-repair sweep (2026-09-28): Coleridge gives 960-981 to Electra,
      # Diggle to the Chorus; the heuristic moved 980, mid-sentence, into her
      # 982 lament.
      "980": "980"  # πήματ' ἐν χρόνωι μακρῶι — troubles in length of time
      # Perseus numbers the Chorus's question and the Phrygian's cry by an
      # older lineation; Diggle's are 1453 and 1454a (John, 2026-09-28).
      # Coleridge ends Electra's 1302 speech with 1310 ("all round the eddies
      # of Scamander"); Diggle gives 1303-1310 to the Chorus, and the speaker
      # heuristic moved the line to her next speech at 1313 (John, 2026-09-28).
      "1310": "1310"  # βέλεσιν ἀμφὶ τὰς Σκαμάνδρου δίνας — all round the eddies of Scamander
      "1452": "1453"   # τί τοὐπὶ τῶιδε συμφορᾶς ἐγίγνετο; — What happened next?
      "1453": "1454a"  # Ἰδαία μᾶτερ μᾶτερ — Mother of Ida, great, great mother!
  secondary:
    id: way
    text_fixes:
      - find: "oREsTES"
        replace: "ORESTES"
        note: "sweep 2026-11-15: mixed capitals in stage direction (OCR)"
      - find: "stumblingblock"
        replace: "stumbling-block"
        note: "sweep 2026-11-15: lost hyphen"
      - find: "her favour won But on mine ears"
        replace: "her favour won. But on mine ears"
        note: "way-cleanup 2026-09-25 row 489 (S11 confirmed): full stop missing between sentences"
      - find: "cried to me:\n* Thy brother, Menelaus, lieth dead,"
        replace: "cried to me:\n“Thy brother, Menelaus, lieth dead,"
        note: "way-cleanup r3 2026-09-25 (1:367): genie build/genie/euripideswitheng02euri.txt:6663 prints an opening quote before \"Thy brother\""
      - find: "* Gods tarry long! \"—not long"
        replace: "“Gods tarry long! \"—not long"
        note: "way-cleanup r3 2026-09-25 (1:490): genie build/genie/euripideswitheng02euri.txt:6979 prints an opening quote before \"Gods tarry long\""
      - find: "their path—\n* By exile justify, not blood for blood.\""
        replace: "their path—\nBy exile justify, not blood for blood.\""
        note: "way-cleanup r3 2026-09-25 (1:512): genie build/genie/euripideswitheng02euri.txt:7353 shows this whole maxim already inside a quote pair Way's own OCR opened on the line above; the asterisk marks only where the page's italic type begins, no extra character"
      - find: "swiftWith eyes"
        replace: "swift with eyes"
        note: "glue check 2026-11-15: the bench joins 'swift' to 'with' (line 1170); a capital W mid-line is a join, not a print"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/orestes.txt
    play: ORESTES
    footnotes: true
    # Drift sweep 4 (2026-09-26): Way prints 1297 and 1298 as two
    # Semichorus speeches for the edition's one, so from "Helen's the wild
    # shriek" (1298) each speech sat one slot late and Electra's "O power of
    # Zeus" (1299) shared the 1301 row with Helen. The pin seats it on
    # ὦ Διὸς ὦ Διὸς (1299) and Helen's cry on 1301.
    pins:
      - { greek: "1299", english: "O power of Zeus, of Zeus", run: 2 }
  third:
    id: johnston
    name: "Ian Johnston (VIU)"
    short: Johnston
    model: turn-text
    format: verse-own-line
    source: bench/johnston/orestes.txt
    play: ORESTES
    footnotes: false
    # Drift sweep 4 (2026-09-26): with Coleridge's 1297-1299 seated on
    # their own Greek (line_fixes above), the pairer moved Electra's "O Zeus"
    # (1299) to 1301 and spread the Chorus's 1297-1298 onto 1299. The pin
    # holds her prayer on ὦ Διὸς ὦ Διὸς (1299) and Helen's cry on 1301, where
    # they stood before.
    pins:
      - { greek: "1299", english: "O Zeus, O eternal power of Zeus", run: 2 }
    # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Ian Johnston (Vancouver Island University), johnstonia pages: "All
        general readers, teachers, students, and performing artists may
        download any material on johnstonia web pages without permission and
        without charge, provided they do not use the material in a commercial
        publication." Credited in sources/INVENTORY.md and on the attribution
        page.
      source_url: https://web.viu.ca/johnstoi/copyright.htm
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

citation:
