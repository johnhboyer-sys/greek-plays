  production: "City Dionysia, 408 BC"
  argument: "Six days after killing his mother, Orestes waits for the Argive assembly’s verdict. It is death, and he turns on Helen."
  synopsis: "Six days after killing his mother, Orestes lies sick and half mad in Argos, nursed by Electra, while the city prepares to vote on whether to stone them both. Helen, who came ahead by night, is in the palace; Menelaus arrives and will not risk helping. The assembly votes for death. Orestes, Electra, and Pylades, with nothing to lose, try to kill Helen, who vanishes, and take her daughter Hermione hostage on the roof with the palace ready to burn. Apollo appears, marries Orestes to Hermione and Electra to Pylades, and sends Helen to the stars."
