    model: turn-text
    format: loeb-ocr
    source: "bench/rogers/thesmophoriazusae.txt"
    play: "THE THESMOPHORIAZUSAE"
    footnotes: true
  # Measured 0.855 (432 of 505 Greek speaker events pair, sweep 2026-09-08):
  # the lowest of the eleven comedies and three lost pairs from the 0.85
  # default. 129 of its segments pack two or more speakers into one line, and
  # the 1912 translation runs the shorter halves of that antilabe together, so
  # the missing pairs are real edition disagreement, not builder loss — every
  # one of those speeches is still shown, parked or flagged. Declared AT the
  # default on purpose (P3.6): the closeness is on record here, and a
  # re-export or cleaner change that loses three more pairs fails the build
  # instead of being waved through by a lower floor.
  min_pairing_rate: 0.85
  # Item 6 (John, 2026-09-09): every Greek speech carries English, or is
  # declared below (gaps) or under primary.covered.
  strict_coverage: true
  gaps:
    # Item 9 (english_dead_gaps; play-thesmophoriazusae-findings #14): the
    # 1081/1089 pins above hold the Echo run to its own lines, and each
    # greek ref in 1080-1089 is itself a doubled echo (two shares on one
