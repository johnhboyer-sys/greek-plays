    # Item 6: Greek speeches whose English sits inside the neighbouring
    # speech (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "869", by: "866" }
    pins:
      - { greek: "32", english: "He has a big beard?", run: 1 }
      - { greek: "34", english: "No, no, evidently you have never seen him.", run: 1 }
      - { greek: "39", english: "Silence! oh, people! keep your mouths sedately shut!", run: 1 }
      - { greek: "51", english: "Whose voice is that? 'Tis the silent Ether.", run: 1 }
      - { greek: "52", english: "is going to construct the framework of a drama", run: 1 }
      - { greek: "59", english: "Take care of yourself and of your sweet-voiced poet!", run: 1 }
      - { greek: "63", english: "Old man, you must have been a very insolent fellow in your youth!", run: 1 }
      - { greek: "66", english: "(to the servant) Let him be, friend, and, quick, go and call Agathon to me.", run: 1 }
      - { greek: "104", english: "To what divinity is your homage addressed?", run: 1 }
      - { greek: "111", english: "To thee, oh Phoebus, I dedicate my most beauteous songs", run: 1 }
      - { greek: "116", english: "I, in my turn, celebrate the everlasting happiness of the chaste Artemis", run: 1 }
      - { greek: "123", english: "I do honour to the divine Latona and to the lyre", run: 1 }
      - { greek: "129", english: "Hail! thou blessed son of Latona!", run: 1 }
      - { greek: "381", english: "Silence! let all be quiet! Pay attention! for here she is spitting", run: 1 }
      - { greek: "740", english: "I carried it ten months", run: 1 }
      - { greek: "743", english: "How much does it hold? Three cotylae? Tell me.", run: 1 }
      - { greek: "852", english: "What are you ruminating over now again?", run: 1 }
      - { greek: "855", english: "These shores are those of the Nile with the beautiful nymphs", run: 1 }
      - { greek: "859", english: "\"Glorious Sparta is my country and Tyndareus is my father.\"", run: 1 }
      - { greek: "862", english: "\"I was given the name of Helen.\"", run: 1 }
      - { greek: "864", english: "\"A thousand warriors have died on my account\"", run: 1 }
      - { greek: "866", english: "\"And here I am upon these shores; Menelaus\"", run: 1 }
      - { greek: "874", english: "\"Of what Proteus?\" Oh! the thrice cursed rascal!", run: 1 }
      - { greek: "1015", english: "Oh Nymphs, ye virgins who are dear to me, how am I to approach him?", run: 1 }
      - { greek: "1015", english: "A pitiless ruffian has chained up the most unfortunate of mortal maids", run: 1 }
      - { greek: "1059", english: "I am Echo, the nymph who repeats all she hears", run: 1 }
      - { greek: "1064", english: "And you will repeat them?", run: 1 }
      # Item 9 (english_dead_gaps; play-thesmophoriazusae-findings #3, #14):
      # the Echo exchange runs one speech behind through 1080-1089. These
      # two pins hold the primary to its own lines (see the gaps note below
      # for why no ref in the run ends up bare).
      - { greek: "1081", english: "Beware of blows!", run: 1 }
      - { greek: "1089", english: "Are you mocking me?", run: 1 }
      - { greek: "1196", english: "Aye, that I will. Hand over the money.", run: 1 }
      - { greek: "1197", english: "You will bring her back? Follow me, my beautiful child.", run: 1 }
      - { greek: "64", english: "Let him be, friend, and, quick, go and call Agathon", run: 1 }
      - { greek: "760", english: "Ah! unfortunate Mica! who has robbed you of your daughter", run: 1 }
      - { greek: "762", english: "That wretch. But as you are here, watch him well", run: 1 }
      - { greek: "1065", english: "Oh! thou divine Night! how slowly thy chariot threads", run: 1 }
      - { greek: "70", english: "And what am I to do?", run: 1 }
      - { greek: "728", english: "Bring faggots, Mania!", run: 1 }
      - { greek: "730", english: "Grill away, roast me, but you, my child", run: 1 }
      - { greek: "739", english: "Faggots, Mania, plenty of them", run: 1 }
      - { greek: "740", english: "Bring as many as you like. But answer", run: 1 }
      - { greek: "747", english: "It was born about the time of the last Dionysia.", run: 2 }
