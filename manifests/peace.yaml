  argument: "Trygaeus flies to heaven on a dung-beetle to bring back Peace."
  synopsis: "Trygaeus, a vine-grower sick of the war, fattens a dung-beetle and flies to heaven on it to see Zeus. The gods have moved out; War is in residence and has buried Peace in a pit. Trygaeus calls up the farmers of all Greece to haul her out, and they do. He comes home with Peace's two companions, Harvest and Festival, hands Festival to the Council, and marries Harvest. The play ends with the wedding, arms-dealers ruined and farmers feasting."
