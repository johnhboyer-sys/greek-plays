english:
  primary:
    id: athenian-society
    name: "The Eleven Comedies (The Athenian Society, 1912)"
    short: Athenian Society
    model: turn-text
    source: "gutenberg/pg8688.txt"
    play: "PEACE"
    footnotes: true
    line_fixes:
      6832: 'SON OF CLEONYMUS. "But I saved my life."'
    # Item 6 pins (John, 2026-09-09: real slips are never one-offs):
    # each holds an English speech to the Greek line the reviewers matched it to.
    # Item 6: Greek speeches whose English sits inside the neighbouring
    # speech (the reader shows 'Translated with the speech above').
    covered:
      # Round 3 (turn-pairing-round3-2026-09-15.md, P5): 250 and 251 no longer
      # anchor the "Oh, Sicily!" block under the DP -- 1:252's own chunk now
      # carries all three lines ("Oh, Sicily! you too must perish!" = 250,
      # "Your wretched towns shall be grated like this cheese" = 251, "Now
      # let us pour some Attic honey into the mortar" = 252's own line).
      - { greek: "250", by: "252" }
      - { greek: "251", by: "252" }
      - { greek: "258", by: "257" }
      # Item 2 (play-peace-thirdpass-2026-09-21.md, B1): the old
      # `{ greek: "894", by: "883" }` pointed backward and is gone: since the
      # `splits` cut at 894 below (2026-09-21), 1:883 holds the 1912's 884b-893
      # and 1:894 its own 894-908.
      - { greek: "1019", by: "987" }
      - { greek: "1124", by: "1122" }
      - { greek: "350-351", by: "346" }
      - { greek: "443", by: "441" }
      - { greek: "444", by: "447" }
      - { greek: "446", by: "447" }
      # Round 3: the "heave-ho" chant (Chorus/Hermes hauling the statue) --
      # 1:517's chunk ("Come then, come, and all together! Hah! hah! ...")
      # now carries 512-516; the DP moved the anchor from 512 to 517.
      - { greek: "512", by: "517" }
      - { greek: "513", by: "517" }
      - { greek: "514", by: "517" }
      - { greek: "516", by: "517" }
      - { greek: "541", by: "535" }
      - { greek: "449", by: "447" }
      - { greek: "452", by: "450" }
      - { greek: "453", by: "450" }
      - { greek: "549", by: "548" }
      # Round 3: Trygaeus's "I grant you this much, so as not to trouble you
      # further" (1:333) is the 1912 text's "Come, I grant you that, but
      # pray, annoy me no further" -- attached under 1:337 by the DP.
      - { greek: "333", by: "337" }
      # Item 2 (play-peace-findings #5): Trygaeus's Greek-483 interjection
      # ("dying of hunger") has no AS sentence of its own -- it is folded
      # into the continuous 481-483 Hermes sentence pinned at 481.
      - { greek: "483", by: "481" }
    # Item 6 splits: the 1912 text runs these speeches together where the
    # Greek changes speaker; the tail becomes its own speech under the label.
    splits:
      - { greek: "450", english: "If some ambitious man does not help us", speaker: "HERMES" }
      # The 1912 runs Trygaeus's 884b-908 as one paragraph; the edition's
      # row breaks at 894 (epeit' agona g' euthus), where the 1912 begins
      # "Now that you have found Theoria again". The head then sits with
      # 884b-893 in 1:883 and the tail with 894-908.
      - { greek: "894", english: "Now that you have found Theoria again", speaker: "TRYGAEUS" }
    pins:
      - { greek: "253", english: "Oh! I beseech you! use some other honey", run: 2 }
      # phere de, to dalion tod' embapso: the split at 894 adds a speech, and
      # without this pin the fire-brand line slid up onto 958.
      - { greek: "959", english: "Hold! I take this fire-brand first", run: 1 }
      # edokas ede; -- holds the barley exchange behind the 959 pin.
      - { greek: "963", english: "You have thrown it?", run: 1 }
      # Item 4 (fix-peace-data-brief-2026-09-21.md; play-peace-findings #1)
      # The Moon-and-Sun exchange, 405-425 (play-peace-findings #1): without
      # these the 1912 column runs a whole speech behind. Each read against
      # the Greek, 2026-09-18 and again 2026-09-21. Twice reverted because
      # they pushed turn_text_turn_shift past 0.10 (0.097 to 0.101); the
      # `splits` cut at 894 made the room.
      - { greek: "405", english: "Hah! speak and perchance I shall let myself be softened.", run: 1 }
      - { greek: "406", english: "Know then, that the Moon and that infamous Sun", run: 1 }
      - { greek: "409", english: "What for?", run: 2 }
      - { greek: "414", english: "'Tis then for this reason that these untrustworthy charioteers", run: 1 }
      - { greek: "416", english: "Yes, certainly. So therefore, Hermes, my friend", run: 1 }
      - { greek: "425", english: "Ah! how golden cups do influence me!", run: 1 }
      # Item 2 (play-peace-findings #2): the 1912's libation-prayer English
      # was declared as two dead `gaps` (removed above) when it sits one
      # segment late; these pins hold it to its own lines.
      - { greek: "439", english: "Aye, may we pass our lives in peace, caressing our mistresses and", run: 1 }
      - { greek: "441", english: "May he who would prefer the war, oh Dionysus, be ever drawing", run: 1 }
      # Item 2 (play-peace-findings #5): both columns slide in opposite phase
      # through the tug-of-war; these hold the Athenian Society text to its
      # own lines. (Greek 483's Trygaeus interjection has no distinct AS
      # sentence of its own -- the 1912 folds it into the 481-483 Hermes
      # sentence -- so 483 is not pinned here, only 478, 481, 484, 486.)
      - { greek: "478", english: "Ah! my dear sir, the Laconians at all events pull with vigour.", run: 1 }
      - { greek: "481", english: "And the Megarians too are doing nothing, yet look how they are", run: 1 }
      - { greek: "484", english: "This won't do, friends. Come! all together! Everyone to the", run: 1 }
      - { greek: "486", english: "Heave away, heave!", run: 1 }
      # Round 5: the 1912 text runs the whole 346-360 ode into one 520-char
      # Chorus speech. The length term prefers the longest share it covers, so the
      # DP hung it on 350-351 and left 346 (its own opening line, "Ah! God grant we
      # may see the blessed day" = 346) bare; this holds it to 346.
      - { greek: "346", english: "Ah! God grant we may see the blessed day.", run: 1 }
      - { greek: "361", english: "How shall we set about removing these stones?", run: 1 }
      - { greek: "458", english: "Come, all strain at the ropes to tear away the stones.", run: 44 }
      - { greek: "960", english: "Give me some barley-seed, purify yourself and hand me the basin", run: 11 }
      - { greek: "1039", english: "Hold! here are the legs, place them upon the altar.", run: 1 }
      - { greek: "1050", english: "No, 'tis the odour of the fat that attracts him.", run: 3 }
      - { greek: "1064", english: "What! you are so ignorant you don't understand", run: 32 }
      - { greek: "1048", english: "Evidently he is coming to oppose the peace.", run: 1 }
      - { greek: "428", english: "We go, but you, the cleverest of all", run: 1 }
      - { greek: "431", english: "Quick, reach me your cup, and let us preface", run: 1 }
      - { greek: "472", english: "Why does not the work advance then?", run: 1 }
      - { greek: "473", english: "Lamachus, this is too bad! You are in", run: 1 }
      - { greek: "527", english: "Is it then a smell like a soldier's", run: 1 }
      - { greek: "528", english: "Oh! hateful soldier! your hideous satchel makes me", run: 1 }
      - { greek: "447", english: "If a lance-maker or a dealer in shields desires war", run: 1 }
      - { greek: "543", english: "But let us also scan the mien of the spectators", run: 1 }
      - { greek: "550", english: "Now ask the husbandmen to be off.", run: 1 }
      - { greek: "551", english: "Listen, good folk! Let the husbandmen take their farming tools", run: 1 }
      - { greek: "454", english: "Don't say Paean, but simply, Io.", run: 1 }
      - { greek: "455", english: "Very well, then! Io! Io! I'll simply say, Io!", run: 1 }
      - { greek: "548", english: "And do you see with what pleasure this sickle-maker", run: 1 }
      - { greek: "1316", english: "Silence! Keep silence! Here is the bride about to appear!", run: 1 }
      - { greek: "1333", english: "Oh! Hymen! oh! Hymenaeus! oh! thrice happy man", run: 1 }
      - { greek: "1337", english: "What shall we do to her?", run: 4 }
      - { greek: "1346", english: "You shall have a fine house, no cares and the finest of figs.", run: 1 }
      - { greek: "1351", english: "The bridegroom's fig is great and thick", run: 1 }
      - { greek: "1353", english: "While eating and drinking deep draughts of wine", run: 1 }
  secondary:
    id: hickie
    name: "W. J. Hickie (Bohn, 1853)"
    short: Hickie
    model: turn-text
    format: loeb-ocr
    source: "bench/hickie/peace.txt"
    play: "PEACE"
    # Grok's spot-read (fix-hickie-pins-brief-2026-09-22) found 1:18
    # showing 19's curse ("Aye, by Jupiter, to the deuce, and yourself
    # into the bargain.") instead of its own line ("Then I'll pick up and
    # carry the filth itself" -- Hickie folds that into 15-16's sentence,
    # so 18 itself has no separable Hickie speech). Anchoring the deuce-
    # curse back on its own line, 19, clears the borrowed row.
    pins:
      - { greek: "19", english: "Aye, by Jupiter, to the deuce, and yourself into the bargain.", run: 1 }
    # The reader loads only one footnotes.json per play, and the primary
    # already carries its own (John's own retirement kept Hickie's off in
    # every play, 2026-09-14); the bench text still keeps every note as a
    # [n] marker + Footnotes: block.
    footnotes: false
  third:
    id: johnston
    name: "Ian Johnston (VIU)"
    short: Johnston
    model: turn-text
    format: verse-own-line
    source: bench/johnston/peace.txt
    play: PEACE
    footnotes: false
    # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Ian Johnston (Vancouver Island University), johnstonia pages: "All
        general readers, teachers, students, and performing artists may
        download any material on johnstonia web pages without permission and
        without charge, provided they do not use the material in a commercial
        publication." Credited in sources/INVENTORY.md and on the attribution
        page.
      source_url: https://web.viu.ca/johnstoi/copyright.htm
    # Item 2 (play-peace-findings #3): the wedding-finale half-chorus antiphon
    # gives the pairer two identical cues per exchange and it loses count at
    # 1333, so the exodos prints one to two exchanges late throughout.
    pins:
      - { greek: "1333", english: "O thrice blessed man, you deserve", run: 1 }
      - { greek: "1337", english: "What shall we do with her?", run: 1 }
      - { greek: "1339", english: "We’ll harvest her fruit.", run: 1 }
      - { greek: "1340", english: "Those in the front,", run: 1 }
      - { greek: "1346", english: "You’ll have a fine home", run: 1 }
      - { greek: "1351", english: "His fig is huge and thick.", run: 1 }
      # Item 2 (play-peace-findings #5): both columns slide in opposite phase
      # through the tug-of-war; these hold Johnston to his own lines.
      - { greek: "478", english: "But Spartans, my dear chap, are pulling rope", run: 1 }
      - { greek: "481", english: "The Megarians\naren’t making any effort.", run: 1 }
      - { greek: "483", english: "Yes, by Zeus, because they’re dying of hunger.", run: 1 }
      - { greek: "486", english: "Heave!", run: 1 }
      # Grok read of the data branch (2026-09-22): the DP seated the First
      # Servant's "You do it. I'll strip him of those skins" (1122-1126) at
      # 1124 and pointed 1122 at it, backwards; the speech opens at 1122.
      - { greek: "1122", english: "You do it. I’ll strip him", run: 1 }
      - { greek: "487", english: "Heave away!", run: 1 }
      - { greek: "488", english: "Heave!", run: 1 }
      - { greek: "489", english: "By Zeus, pull!", run: 1 }
      # Item 3 (play-peace-thirdpass-2026-09-21.md, A13): the Ionian/Cleon
      # joke and "I'm going in to give the beast a drink" land one segment
      # early (at 1:43, printing greek 42's line instead); this holds the
      # pair to 43-49.
      - { greek: "43", english: "Well, some youngster", run: 2 }
      # Item 3 (B2): Trygaeus' "terrible act" reply is stranded one segment
      # late; this holds it (and the 405/406 pins below) to its own Greek
      # lines. Johnston's preceding "They're greater robbers than they used
      # to be." gives Hermes a THIRD retort the edition does not mark (Coulon
      # has Hermes speak only the single line 405 here; Johnston's extra
      # interjection has no Greek speaker-change slot at 402 to pin to --
      # verified: the pipeline fails loud, "the edition has no speaker
      # change there" -- so it is left where the aligner puts it, the
      # translator's own attribution, not a defect this lane can place.
      - { greek: "403", english: "What’s more, I’ll tell you of a terrible act,", run: 1 }
      - { greek: "405", english: "All right, tell me. You might win me over.", run: 1 }
      - { greek: "406", english: "For some time the Moon and that rascal Sun", run: 1 }
      # Item 3 (A4): the heave-cry cluster runs one segment early from 457
      # on (Trygaeus' "make a real effort" line, printed correctly at 1:458
      # by the primary, sits at Johnston's 1:457). A single pin with `run`
      # does not carry across this packed line's several shares (tested:
      # `run: 9` from here left 458-463 untouched); each cry is pinned to
      # its own line instead.
      - { greek: "457", english: "No, no!", run: 1 }
      - { greek: "458", english: "All right, everyone make a real effort", run: 1 }
      - { greek: "459", english: "Heave away!", run: 1 }
      - { greek: "460", english: "Heave ho!", run: 1 }
      - { greek: "461", english: "Come on, pull!", run: 1 }
      - { greek: "462", english: "Pull even harder!", run: 1 }
      - { greek: "463", english: "Heave . . . Come on, heave!", run: 1 }
      # Item 3 (A8): the audience-faces byplay runs one to two segments
      # early from 543 on.
      - { greek: "543", english: "And let’s also take a look at faces", run: 2 }
      - { greek: "545", english: "Can’t you see that man who makes battle crests?", run: 2 }
      - { greek: "548", english: "See that one,", run: 1 }
      # Item 3 (A9): the sacrifice hand-off runs one segment late from 1041.
      - { greek: "1041", english: "I’ll take care of it.", run: 2 }
      # Item 3 (A12): the "full of joy" ode opens one segment early, at
      # 1:1124 instead of 1:1127.
      - { greek: "1127", english: "I’m full of joy, yes, full of joy,", run: 1 }
      # Item 3 (A10): Johnston's whole 346-360 speech is one unbroken
      # paragraph (no internal break the pairer could use); this holds its
      # true opening to 346, and covered declarations below carry the rest.
      - { greek: "346", english: "How I wish to see that day at last!", run: 1 }
      # The 346 pin above shifts the alignment enough that Trygaeus'
      # "Well, come on" (correctly at 1:361 before this pin) slides back to
      # 1:350; re-pin it to its own line.
      - { greek: "361", english: "Well, come on.", run: 1 }
    # Greek 484-485's Hermes clause has no distinct Johnston sentence of its
    # own -- it is folded into the continuous 483-485 Trygaeus sentence
    # pinned at 483 -- so it is declared covered, not pinned.
    covered:
      - { greek: "484", by: "483" }
      # Item 3 (A14 blanks, B5): 258's English is a genuine merge into 257's
      # speech (both true); the rest are the same shape as 483/484 -- a
      # single unbroken Johnston speech that runs past its own segment's
      # greek span into the next one(s).
      - { greek: "258", by: "257" }
      - { greek: "350", by: "346" }
      - { greek: "350-351", by: "346" }
      - { greek: "541", by: "535" }
      - { greek: "549", by: "548" }
      # The unbroken FIRST SERVANT speech (1122-1126) opens at 1122; the
      # 1122 pin above seats it there (Grok read, 2026-09-22; before that the
      # aligner keyed it to 1124 and this row pointed the other way).
      - { greek: "1124", by: "1122" }
  # Item 6 (John, 2026-09-09): every Greek speech carries English, or is
  # declared below (gaps) or under primary.covered.
  strict_coverage: true
  gaps:
    # Item 2 (R8 warning, play-peace-findings #6): 517, 439, 441, 484, 488, 489,
    # 490, 499, 350 and 1063 all carry English in the built book (350 is also
    # declared `covered`), so `english_dead_gaps` flagged all ten as false.
    # Only 468 is genuinely bare; the rest are removed here, 2026-09-18.
    - "468"  # bare heave-ho, an untranslated tug-of-war grunt

