  argument: "Andromache, now Neoptolemus’ slave, is threatened by his wife Hermione and her father Menelaus."
  synopsis: "Andromache, Hector's widow, was given to Neoptolemus as a prize of war and has borne him a son. His wife Hermione, Menelaus's daughter, is childless and blames her. Andromache has taken refuge at the altar of Thetis and hidden the boy. With Neoptolemus away at Delphi, Hermione and Menelaus move to kill them both, and Menelaus gets her off the altar by producing the child. Old Peleus arrives in time and faces Menelaus down. Hermione, terrified of her husband's return, runs off with Orestes, who wanted her himself and has arranged for Neoptolemus to be murdered at Delphi. The body is brought home; Thetis appears to settle everyone's future."

