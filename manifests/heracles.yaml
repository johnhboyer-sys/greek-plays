# real export (build/export/tlg0006/Diogenes-Resources/xml/tlg/tlg0006043.xml),
# verified by two `all --work heracles --public` runs (docs/p2-greek-report.md).

work:
  id: heracles
  title: Heracles
  author: euripides
  language: grc
  tlg_author: "0006"
  tlg_work: "043"
  greek_edition: "Diggle, Euripidis fabulae, vol. 2 (OCT, 1981)"
