  production: "c. 416 BC"
  argument: "Heracles returns from the underworld in time to save his family, then is driven mad by Hera and kills them himself."
  synopsis: "While Heracles is in the underworld on his last labour, the usurper Lycus has seized Thebes and is about to kill Heracles' wife Megara, his three sons, and his father Amphitryon. Heracles returns in time and kills Lycus. Then Iris and Madness appear above the house, sent by Hera, and in the fit he kills his wife and children, taking them for Eurystheus's. When he wakes, Amphitryon has to tell him what he has done. He means to kill himself; Theseus, whom he freed from Hades, talks him into living and takes him to Athens."
