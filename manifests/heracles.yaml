english:
  primary:
    id: coleridge
    text_fixes:
      - find: "Zeus defend his his own share i"
        replace: "Zeus defend his own share i"
        note: "sweep 2026-09-24 n=80: sources/perseus/tlg0006.tlg009.perseus-eng2.xml:205"
    name: "E. P. Coleridge (London, 1891)"
    short: Coleridge
    model: perseus-play
    source: "perseus/tlg0006.tlg009.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # Coleridge's madness amoibaion (Perseus 887-900) is one speech late
    # against Diggle throughout: every English number names a real Diggle
    # line, just the wrong one. Verified end to end, item 6/C8 of
    # lane-c-r4-report-2026-09-18.md (886-905, zero speakerMismatch after).
    line_fixes:
      "887": "886"
      "888": "887"
      "890": "887"
      "890a": "888"
      "891": "889"
      "893": "891"
      "894": "892"
      "895": "892"
      "896": "894"
      "896b": "896"
      "898": "896"
      "900": "899"
      # Coleridge's shares of Diggle's 1185–1188 (printed 1187, 1188,
      # 1186, 1185). 1184 "Hush!" is Greek 1185; 1187 "Fortune has spread
      # her wings" is Greek 1186; 1188 "What do you mean?" and 1189
      # "Slain them in a wild fit of frenzy" are Greek 1187; 1190 "with
      # arrows dipped" is Greek 1188. Checked against the Greek and Way.
      "1184": "1185"
      "1187": "1186"
      "1188": "1187"
      "1189": "1187"
      "1190": "1188"
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "1061", by: "1060" }
      - { greek: "1064", by: "1065" }
  secondary:
    id: way
    text_fixes:
      - find: "Woe worth the day! -\n"
        replace: "Woe worth the day!\n"
        note: "way-cleanup 2026-09-25 row 274 (S11 confirmed): stray hyphen at line end, not a broken word"
      - find: "Shall. trample thy son unto dust"
        replace: "Shall trample thy son unto dust"
        note: "way-cleanup r2 2026-09-25 (S11 confirmed, ex-mechanical-rule): build/genie/euripidesway03euriuoft.txt:6500 prints \"Shall trample\" with no stray stop"
      - find: "Labours of Hercules *\n"
        replace: "Labours of Hercules\n"
        note: "way-cleanup r3 2026-09-25 (CHORUS heading): archive.org/genie build/genie/euripidesway03euriuoft.txt:4957 shows the asterisk is the scan's reading of a footnote reference mark after the heading, not a printed character in the heading itself (Grok r2 sample 25 confirmed)"
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/heracles.txt
    play: MADNESS OF HERCULES
    footnotes: true
  third:
    id: kosmos
    text_fixes:
      - find: "nd gnaws at me me."
        replace: "nd gnaws at me."
        note: "sweep 2026-09-24 n=79: sources/kosmos/heracles.html"
    name: "Potter, adapted by Ebbott, Dué & Kamil (CHS, Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/heracles.txt
    play: HERAKLES
    footnotes: false
    # Kosmos prints the first stasimon (755-814) as one cued block of five
    # paragraphs, then the Chorus's cry at 815. Two English speeches against
    # six Greek ones: the aligner's cheapest path put the ode on the two-line
    # 755 row and the cry on 757 (one gap beats two by 0.75 at any rate), and
    # left 815-821 blank with no note. The pin seats the cry on its own Greek
    # (ea ea; ar' es ton auton pitulon hekomen phobou). Pairer design,
    # build/review/pairer-round6-design-2026-09-21.md, item 4.
    pins:
      - { greek: "815", english: "Ah me! Look! Have we come to the same violence of fear", run: 1 }
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
        Gregory Nagy. Reproduced without change under CC BY-NC-ND 3.0:
        https://creativecommons.org/licenses/by-nc-nd/3.0/ . This site gives credit and is non-commercial. Every translator and reviser is credited in sources/INVENTORY.md and on the attribution page.
      source_url: https://chs.harvard.edu/primary-source/euripides-herakles
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

