  synopsis: "Two Athenians, Peisetaerus and Euelpides, have left Athens to be rid of lawsuits and are looking for Tereus, the king who became a hoopoe, to ask where to live. Peisetaerus has a better idea: the birds should build a city in the air between men and gods and cut off the smoke of sacrifice. Cloudcuckooland is founded, the gods starve, and an embassy of Poseidon, Heracles, and a Triballian god comes to terms. Peisetaerus gets Zeus's sceptre and marries Basileia, Sovereignty herself."
