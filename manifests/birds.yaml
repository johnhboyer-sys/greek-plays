  secondary:
    id: hickie
    name: "W. J. Hickie (Bohn, 1853)"
    short: Hickie
    model: turn-text
    format: loeb-ocr
    source: "bench/hickie/birds.txt"
    play: "THE BIRDS"
    # S11 sweep rows 113, 1459, 1464 (2026-09-25): Bohn prints eleven of
    # Pisthetaerus's cues abbreviated, "Pist." (10) and "Pistr." (569, at
    # 554ff), and the cue rule reads only capitals, so his lines ran on inside
    # the Poet's, Epops's, and the Informer's speeches. Each is spelled out as
    # the column's own PISTHETAERUS cue; the text after it is unchanged.
    line_fixes:
      569: "PISTHETAERUS. And then, if this wall be raised, that you demand back the empire from Jove; and if he refuses, and be not willing, and do not immediately confess himself in the wrong, that you declare a sacred war against him, and forbid the gods to pass through your district, when lecherous, as formerly they were accustomed to go down to debauch their Alcmenas, and their Alopes, and their Semeles. But if they should go to them, that you put a seal upon their breeches, in order that they may not any longer meddle with them. And I advise you to send another bird as herald to men, henceforth to sacrifice to the birds, since the birds have the rule. And then, after this again, to the gods: and assign to the gods, individually, in a suitable manner, some one of the birds, which accords with that god. If any one sacrifice to Venus, let him offer wheat to the coot; and if any one sacrifice a sheep to Neptune, let him dedicate wheat to the duck; and if any one sacrifice to Hercules, let him offer honied cakes to the gull; and if any one sacrifice a ram to king Jove, the wren is the"
      773: "PISTHETAERUS. Let us sacrifice and pray to the winged gods. [Enter a poet reciting his poems.]"
      776: "PISTHETAERUS. From what country is this article? Tell me, who are you?"
      779: "PISTHETAERUS. Do you wear long hair, then, pray, you slave?"
      782: "PISTHETAERUS. No wonder you have your coat also holy. But, poet, what the devil’s brought you here?"
      785: "PISTHETAERUS. When, and how long ago, did you compose these?"
      788: "PISTHETAERUS. Am I not even now celebrating with sacrifices its tenth day, and have just now given it its name, like a child?"
      1262: "PISTHETAERUS. And then he sails hither, while you, again, fly yonder to seize his goods."
      1265: "PISTHETAERUS. I understand a top. Well now, by Jove, I have such a capital set of Corcyræan wings. [Produces the horsewhip.]"
      1268: "PISTHETAERUS. Nay, a pair of wings, with which I will make you to-day spin like a top. [Beats him.]"
      1271: "PISTHETAERUS. Will you not fly away from hence? Will you not vanish, the devil take you? You shall soon have a bitter view of your justice-twisting rascality! [Flogs him off the stage.] Let us collect the wings and depart."
    # Grok's spot-read (fix-hickie-pins-brief-2026-09-22) found two stretches
    # a row late.
    #   277: the Mede/crested-bird catalogue -- 1:297 showed the earlier
    #   crest joke instead of "This one is a partridge; that one, by Zeus,
    #   a francolin." The primary column hit the identical stretch (its own
    #   277 pin, run: 22, covers the same Greek slots); Hickie's own speeches
    #   don't split the same way, so anchoring its first displaced line at
    #   277 with the same run length pulls the whole stretch back.
    #   826: 1:829 showed the previous line's "Why not let Minerva be
    #   guardian" instead of Euelpides's "how could a city be well governed
    #   ... Clisthenes with a shuttle" -- traced back to 826, where Hickie's
    #   "What a fine city!" (matching 826) was itself missing, bumped one
    #   row down to 828. The run self-corrects at 833, where Hickie's own
    #   "chicken of Mars" / "master chicken" pair (two speeches, one Greek
    #   node) reabsorbs the slack.
    # Drift sweep 2 (2026-09-25): the 277 pin described above seated "Mede?"
    # on the Hoopoe's share of 277 (Hickie's Pisthetaerus has no share on
    # that line), and a run is capped at 8, so every reply from 279 to 301
    # sat one share early and the catalogue (302-305) at 307. Pinned from the Epops's "His name is
    # the Mede", each reply sits on its own Greek, read line by line: 277
    # Mede, 279 crest, 280 prodigy, 281 son of Philocles, 284 Callias, 285
    # plucked, 287 bright-coloured, 288 Glutton, 289 Cleonymus, 290 crest,
    # 291 Double Course, 292 Carians, 294 plague of birds, 295 cloud, 297
    # partridge to kingfisher (297-298), 299 who is behind her, 299 kingfisher,
    # 300 a bird, 300 Sporgilus and the owl, 301 who brought an owl, 302 the
    # catalogue, 306 the birds (306-309), 309 I think so too.
    #   517: the Euelpides's "By Ceres" (517) sat at 521 and the
    # Pisthetaerus's 518-538 at 522, with 517-520 bare. Hickie gives Lampon
    # (521) to Pisthetaerus, inside that one speech, so it sits whole at 518,
    # translated with 521 and 522.
    pins:
      - { greek: "277", english: "His name is the Mede.", run: 8 }
      - { greek: "288", english: "This here is the Glutton.", run: 8 }
      - { greek: "298", english: "Why, who is the one behind her?", run: 4 }
      - { greek: "301", english: "What say you? Who ever brought an owl to Athens?", run: 2 }
      - { greek: "306", english: "Oh! oh! the birds!", run: 1 }
      - { greek: "309", english: "I think so too.", run: 1 }
      - { greek: "517", english: "By Ceres, you say this well.", run: 2 }
      # Holds 672 as it stood: the pins above moved the beak line (672) to 673.
      - { greek: "672", english: "Nay, you unlucky fellow, she has a beak", run: 1 }
      - { greek: "826", english: "What a fine city! What deity, then, will be protector of the city? For whom shall we full the peplus?", run: 1 }
    # Cuts sweep (2026-09-25): that speech's spread fell one sentence early,
    # so 520 (all swore by birds) sat at 521 and Lampon (521) opened 522.
    cuts:
      - { greek: "521", english: "And still even now Lampon swears" }
      - { greek: "522", english: "So great and holy did they all think you" }
    # The reader loads only one footnotes.json per play, and the primary
    # already carries its own (John's own retirement kept Hickie's off in
    # every play, 2026-09-14); the bench text still keeps every note as a
    # [n] marker + Footnotes: block.
    footnotes: false
