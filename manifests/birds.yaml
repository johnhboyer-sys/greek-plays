      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/birds.txt
      play: BIRDS
      footnotes: false
      # Bird catalogue (review B... / A#1, 2026-09-21): Johnston redistributes
      # the Hoopoe's one-speech Coulon catalogue (302-304-305) as alternating
      # Pisthetairos/Euelpides banter running from 297 through 306-309; his
      # own reattribution is not a defect (each turn keeps its own English
      # speaker). Pins seat each surviving turn on the Greek it renders.
      pins:
        - { greek: "298", english: "What’s the one behind her?", run: 1 }
        - { greek: "300", english: "Shaver?", run: 1 }
        - { greek: "301", english: "Well, what about that?", run: 1 }
        # 302 (the Hoopoe's merged 302-303-304-305 catalogue node) is pinned
        # to the LAST surviving catalogue turn, not the first: the aligner
        # otherwise prefers the ΠΙ./ΕΥ. name-match at 306 over the
        # name-mismatched ΕΠ. node and slides every unpinned catalogue turn
        # (finch, falcon, cuckoo, fire-crest, porphyrion, woodpecker) forward
        # to 306. Anchoring both 301 (the turn before the catalogue) and 302
        # (the catalogue's own close) leaves no other node for the turns
        # between them to reach, so they seat at 302 as intended.
        - { greek: "302", english: ". . . woodpecker!!", run: 1 }
        - { greek: "306", english: "What a crowd of birds!", run: 1 }
        - { greek: "308", english: "It looks that way to me.", run: 1 }
        # Anchors the nightingale scene (670-673) back where it already sat
        # correctly (each turn's own name matches its Greek node here --
        # unlike the 1912 primary, Johnston needs no reattribution fix): the
        # catalogue pins above changed the global path's cost and pulled it
        # one node loose. Same fix as the brief's own worked example.
        - { greek: "670", english: "How I’d love to help that birdie", run: 1 }
        - { greek: "672", english: "You idiot—look at that beak", run: 1 }
        # Same fallout, further downstream: the Callias-bird turn (already
        # correctly seated before this pass) slid one node late to 285.
        - { greek: "284", english: "So this bird is Callias.", run: 1 }
        # S16 drift (2026-09-26): the Mede-camel line (277b-278 Μῆδος; ...
        # ἄνευ καμήλου) sat at 279 and the crest (279 Ἕτερος αὖ λόφον) at 280.
        - { greek: "277", english: "He’s a Mede? By lord Hercules", run: 1 }
        - { greek: "279", english: "Here’s another one", run: 1 }
        # Review A#5/#18, 2026-09-21: 517 and 518 print blank. Euelpides's
        # "That's right, by Demeter!" (Greek 517's own line) sits misplaced
        # at 521; Pisthetaerus's long entrails speech (which Johnston keeps
        # as one unbroken turn straight through Coulon's 518-538, folding in
        # Euelpides's brief 521 "Lampon swears by the goose" aside rather
        # than breaking it out) sits at 522 instead of opening at 518.
        - { greek: "517", english: "That’s right,", run: 1 }
        - { greek: "518", english: "So when someone makes a sacrifice", run: 1 }
        # Review A#6, 2026-09-21: 826 prints blank; the Cloudcuckooland-naming
        # exchange runs one speech late from 826 through 832 (Johnston's own
        # EUELPIDES/PISTHETAIROS cues differ from Coulon's ΧΟ./ΕΥ./ΠΙ. here),
        # resyncing at 833.
        - { greek: "826", english: "This fine metropolis!", run: 1 }
        - { greek: "828", english: "Why not let Athena do the guarding?", run: 1 }
        - { greek: "829", english: "But how can we have a finely ordered state", run: 1 }
        - { greek: "832", english: "Well, who will hold our city’s strong Storkade?", run: 1 }
        # Review A#8/#18, 2026-09-21: 289 prints blank; the Glutton-bird
        # exchange runs one speech late from 287 through 290, resyncing at
        # 291 (whose first turn -- "if this bird were like our Cleonymus" --
        # was sitting one node early).
        - { greek: "287", english: "By Poseidon,", run: 1 }
        - { greek: "289", english: "Another glutton?", run: 1 }
        - { greek: "290", english: "If this bird were like our Cleonymus,", run: 1 }
      covered:
        # 307's Greek ("how they chirp and run about screeching") is inside
        # the same Johnston turn that covers 306 ("What a crowd of birds!
        # ... their beaks are open!").
        - { greek: "307", by: "306" }
        # Euelpides's Lampon-swears-by-the-goose aside (521) and the rest of
        # Pisthetaerus's speech (522, the merged 522-538 node) are both
        # inside the one continuous turn now seated at 518.
        - { greek: "521", by: "518" }
        - { greek: "522", by: "518" }
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
          general readers, teachers, students, and performing artists may
          download any material on johnstonia web pages without permission and
          without charge, provided they do not use the material in a commercial
          publication." Credited in sources/INVENTORY.md and on the attribution
          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
  # Item 6 (John, 2026-09-09): every Greek speech carries English, or is
  # declared below (gaps) or under primary.covered.
  strict_coverage: true
  gaps:
    - "576"  # Euelpides's thunderbolt jab is dropped; Pisthetaerus runs on from 571
