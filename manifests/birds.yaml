  blurb: "Two Athenians build a city in the sky and starve the gods into surrender."
  production: "City Dionysia, 414 BC · second prize"
  argument: "Two Athenians persuade the birds to build a city in the sky and cut the gods off from their sacrifices."
  synopsis: "Two Athenians, Peisthetaerus and Euelpides, have left Athens to be rid of lawsuits and are looking for Tereus, the king who became a hoopoe, to ask where to live. Peisthetaerus has a better idea: the birds should build a city in the air between men and gods and cut off the smoke of sacrifice. Cloudcuckooland is founded, the gods starve, and an embassy of Poseidon, Heracles, and a Triballian god comes to terms. Peisthetaerus gets Zeus's sceptre and marries Basileia, Sovereignty herself."
