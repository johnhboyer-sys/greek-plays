  argument: "After the fall of Troy, Hecuba loses her daughter Polyxena and her son Polydorus, and blinds the man who killed him."
  synopsis: "Troy has fallen and the Greek fleet is held on the coast of Thrace. The ghost of Hecuba's youngest son Polydorus opens the play: sent to Thrace for safety with a store of gold, he has been murdered by his host Polymestor. First the Greeks demand Hecuba's daughter Polyxena as a sacrifice to Achilles' ghost, and she goes bravely. Then a servant sent for water finds Polydorus's body on the shore. Hecuba lures Polymestor and his sons into the women's tents, kills the boys, and blinds him. Agamemnon judges the case and finds for her."

