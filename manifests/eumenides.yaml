  production: "Oresteia, third play · City Dionysia, 458 BC · first prize"
  argument: "The Furies hunt Orestes to Athens, where Athena sets up a court to try him, and he is acquitted."
  synopsis: "The Furies have pursued Orestes from Argos to Delphi, where Apollo shelters him, and from Delphi to Athens. There Athena declines to judge the case alone and founds a court of Athenian citizens to hear it, the first trial for murder. Apollo speaks for Orestes; the Furies prosecute. The vote is even, and Athena's vote acquits him. The Furies threaten to blight Attica until Athena talks them into a home under the city as its Kindly Ones."
