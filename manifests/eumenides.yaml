# Eumenides (Aeschylus, TLG 0085: 007) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0085/Diogenes-Resources/xml/tlg/tlg0085007.xml),
# verified by two `all --work eumenides --public` runs (docs/p2-greek-report.md).

work:
  id: eumenides
  title: Eumenides
  author: aeschylus
  language: grc
  tlg_author: "0085"
  tlg_work: "007"
  greek_edition: "Murray, Aeschyli tragoediae, 2nd ed. (OCT, 1955)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Aeschylus Trag. (c. 6-5 B.C.), Eumenides (0085: 007) "Aeschyli tragoediae, 2nd edn.", Ed. Murray, G. Oxford: Clarendon Press, 1955, Repr. 1960.'

english:
  primary:
    id: smyth
    text_fixes:
      - find: "fresh blood. whenever violence"
        replace: "fresh blood. For I have chosen the overthrow of houses, whenever violence"
        note: "sweep 2026-09-24 n=31: sources/perseus/tlg0085.tlg007.perseus-eng2.xml:518-523"
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg007.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: true
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "147", by: "143" }
      - { greek: "148", by: "143" }
      - { greek: "153", by: "149" }
      - { greek: "154", by: "149" }
      - { greek: "367", by: "354" }
  secondary:
    id: morshead
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/eumenides.txt
    play: THE FURIES
    footnotes: false
    # S11 sweep row 752 (2026-09-25): 117-177. Morshead prints the Ghost's
    # rousing (94-128) as one speech with the Furies' cries as directions,
    # and the spread ran it one segment late through 117-128; a GHOST cue
    # (on the source's blank line after each direction) opens each of her
    # replies so it sits on its own Greek: 118 flown afar, 121 drowsed in
    # sleep, 124 yelping, 127 sleep and toil. The Chorus's ode (143-177,
    # "Alack, alack, O sisters") hung at 174 with 149-173 bare; it opens at 143.
    line_fixes:
      175: "[GHOST]"
      180: "[GHOST]"
      185: "[GHOST]"
      190: "[GHOST]"
    pins:
      - { greek: "118", english: "Mutter and murmur! He hath flownafar", run: 1 }
      - { greek: "121", english: "O drowsed in sleep too deep to heed my pain!", run: 1 }
      - { greek: "124", english: "Yelping, and drowsed again?", run: 1 }
      - { greek: "127", english: "Lo, sleep and toil, the sworn confederates", run: 1 }
      - { greek: "140", english: "Alack, alack, O sisters, we have toiled", run: 1 }
    # Cuts sweep (2026-09-25): Morshead prints the ode (143-177) as 39 lines
    # with no blank line, and the proportional split fell up to one short
    # segment off at each boundary (153 showed 154's English, 154 showed
    # 155's). Each segment's English, read against its Greek, opens here.
    cuts:
      - { greek: "147", english: "He hath slipped from the net" }
      - { greek: "148", english: "O'ermastered by slumber we sank" }
      - { greek: "149", english: "Thou, child of the high God Zeus" }
      - { greek: "153", english: "A god, thou hast stolen from us" }
      - { greek: "154", english: "And who shall consider thy deed" }
      - { greek: "155", english: "The sound of chiding scorn" }
      - { greek: "162", english: "Shame on the younger gods" }
      - { greek: "169", english: "Woe upon thee, Apollo" }
      - { greek: "174", english: "Scornful to me thou art" }
  third:
    id: kosmos
    name: "Smyth, rev. Bannon & Nagy (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/eumenides.txt
    play: EUMENIDES
    footnotes: false
    # S11 sweep row 520 (2026-09-25): the sentence cut ran the parodos one
    # segment early from 153 (the dream-reproach strophe, 155-161, sat at
    # 154). A CHORUS cue on the blank line before that strophe, pinned to
    # 155, holds it and the strophes after it to their own Greek.
    line_fixes:
      74: "[CHORUS]"
    pins:
      - { greek: "155", english: "Reproach comes to me in a dream", run: 1 }
    # Cuts sweep (2026-09-25): the paragraph for 149-154 is one printed
    # line, so 153 (the stolen matricide) sat in 149 and 154's question
    # ("Who will say...") sat at 153, with 154 bare.
    cuts:
      - { greek: "153", english: "though you are a god" }
      - { greek: "154", english: "Who will say that any of this" }
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
        Gregory Nagy. Reproduced without change under CC BY-NC-ND 3.0:
        https://creativecommons.org/licenses/by-nc-nd/3.0/ . This site gives credit and is non-commercial. Every translator and reviser is credited in sources/INVENTORY.md and on the attribution page.
      source_url: https://kosmossociety.org/eumenides-aeschylus/
  overlays:
    - id: johnston
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/eumenides.txt
      play: EUMENIDES
      footnotes: false
      # S11 sweep row 81 (2026-09-25): 307-396. Johnston prints the binding
      # song as one Chorus speech, and the spread ran it a strophe out of
      # step (the Mother Night strophe sat in 307, 354-396 bare). A CHORUS
      # cue (on the source's blank line before the stanza) opens each stanza
      # that begins a Greek segment, and the pins seat each on its own Greek,
      # read line by line: 307 anapaests, 321 Mother Night, 328 refrain,
      # 334 Fate's lot, 341 refrain, 347 our rights, 354 refrain, 360 Zeus
      # despises us, 367 refrain, 368 proud opinions, 372 leaping, 377 his
      # mind confused, 381 leaping, 383 so things remain (to 396).
      line_fixes:
        # S11 sweep row 784: the source drops the CHORUS LEADER cue before
        # "Lord Apollo, you have your own domain" (574-575, the Chorus's
        # challenge to Apollo), so it read as Athena's; the cue goes on the
        # blank line after the stage direction.
        967: "[CHORUS LEADER]"
        536: "[CHORUS]"
        547: "[CHORUS]"
        557: "[CHORUS]"
        567: "[CHORUS]"
        577: "[CHORUS]"
        584: "[CHORUS]"
        592: "[CHORUS]"
        603: "[CHORUS]"
        611: "[CHORUS]"
        620: "[CHORUS]"
        626: "[CHORUS]"
        635: "[CHORUS]"
        641: "[CHORUS]"
      pins:
        - { greek: "307", english: "Come, let’s link our arms and dance", run: 8 }
        # Drift sweep 4 (2026-09-26): the Leader's 244-256 was spread one
        # line a row down to 269 ("I smell human blood", 253, at 264), and
        # the Chorus's cries (257-275) all sat at 273. The pin opens the
        # Chorus's speech on ὅδ' αὐτός (257, "He's over there!"). It stays
        # whole there, 261-273 "translated with the speech above": its head
        # segment carries only an unnamed dash, so the spread cannot walk on.
        - { greek: "257", english: "-He’s over there! Claiming sanctuary", run: 1 }
        - { greek: "367", english: "The task I take upon myself is mine, to overthrow whole families, when strife inside the home kills someone near and dear. We chase that murderer down, the one who’s spilled fresh blood. For all his strength, we wear him down. Those proud", run: 6 }
      # Drift sweep 4 (2026-09-26): the Furies' waking cries (143-177) are
      # one Johnston speech parted by "-" dashes, and from 147 each cry sat
      # one or two segments early (Hermes the thief, 149, at 147; the dream
      # of 155 at 153). Each cut opens its cry on its own Greek.
      cuts:
        - { greek: "147", english: "-Our quarry’s slipped our nets" }       # ἐξ ἀρκύων πέπτωκεν
        - { greek: "148", english: "Once sleep came over us" }              # ὕπνῳ κρατηθεῖσ'
        - { greek: "149", english: "-You’re disgraceful, Hermes" }          # ἰὼ παῖ Διός
        - { greek: "153", english: "-You may be a god, but you’re a thief" } # ἐξέκλεψας ὢν θεός
        - { greek: "154", english: "-Who can say there’s justice" }         # τί τῶνδ' ἐρεῖ τις δικαίως
        - { greek: "155", english: "-In my dreams shame struck" }           # ἐμοὶ δ' ὄνειδος ἐξ ὀνειράτων
        - { greek: "162", english: "-Younger gods are doing this" }         # οἱ νεώτεροι θεοί
        - { greek: "169", english: "-The prophet soils the hearth" }        # ἐφεστίῳ δὲ μάντις
        - { greek: "174", english: "-Though he inflict his pain on me" }    # κἀμοί γε λυπρός
        # Drift sweep 4: the Leader's speech now ends at 256; 254 opens on
        # ὅρα ὅρα μάλ' αὖ.
        - { greek: "254", english: "Start looking for him!" }               # ὅρα ὅρα μάλ' αὖ
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
          general readers, teachers, students, and performing artists may
          download any material on johnstonia web pages without permission and
          without charge, provided they do not use the material in a commercial
          publication." Credited in sources/INVENTORY.md and on the attribution
          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
  gaps:

