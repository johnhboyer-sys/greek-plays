      - { ref: "775", find: "ἡγόμην", replace: "ἠγόμην", note: "scan p. 106 prints ἠγόμην (imperfect passive of ἄγω, 'I was held'); ἡγόμην is no form of ἡγέομαι" }
      - { ref: "824", find: "μήστι", replace: "μἤστι", note: "scan p. 112 prints μἤστι (μὴ ἐστι); without the crasis mark the word is not Greek" }
