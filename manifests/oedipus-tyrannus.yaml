  synopsis: "Thebes is dying of plague. The oracle says the killer of the old king Laius is in the city and must be found. Oedipus, who answered the Sphinx and took the throne and the widowed queen Jocasta, undertakes the search himself. Tiresias will not speak, then does. A messenger from Corinth and an old shepherd, put together, prove it: Oedipus killed Laius, his father, and Jocasta is his mother. She hangs herself; he puts out his eyes with the pins of her dress and asks to be sent into exile."

