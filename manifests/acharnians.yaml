    id: athenian-society
    name: "The Eleven Comedies (The Athenian Society, 1912)"
    short: Athenian Society
    model: turn-text
    source: "gutenberg/pg8688.txt"
    play: "THE ACHARNIANS"
    footnotes: true
    # Item 6 pins (John, 2026-09-09: real slips are never one-offs):
    # each holds an English speech to the Greek line the reviewers matched it to.
    # Item 6 splits: the 1912 text runs these speeches together where the
    # Greek changes speaker; the tail becomes its own speech under the label.
    splits:
      - { english: "during the whole of that time I was holding", speaker: "THEORUS" }  # Greek 141
      - { english: "It's cruel, not to be able to enjoy the feast!", speaker: "LAMACHUS" }  # Greek 1079
    # Item 6: Greek speeches whose English sits inside the neighbouring
    # speech (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "1138", by: "1136" }
      - { greek: "1139", by: "1137" }
    pins:
      - { greek: "104", english: "Thou shalt not have gold, thou gaping-arsed", run: 1 }
      - { greek: "141", english: "during the whole of that time I was holding", run: 1 }
      - { greek: "153", english: "And he has sent you the most warlike", run: 1 }
      - { greek: "153", english: "Now we shall begin to see clearly", run: 1 }
      - { greek: "801", english: "Can you eat chick-pease?", run: 1 }
      - { greek: "920", english: "Should a Boeotian attach it to an insect's", run: 1 }
      - { greek: "926", english: "Shut his mouth. Give him some hay", run: 1 }
      - { greek: "1078", english: "Ah! the Generals! they are numerous, but not", run: 1 }
      - { greek: "1085", english: "Dicaeopolis!", run: 1 }
      - { greek: "1085", english: "What is the matter? Come quickly to the feast", run: 40 }
      # Round 5: the 1132-1139 corselet stichomythia alternates Lamachus/Dicaeopolis
      # with near-equal line lengths and no bridge (the primary IS this column), so a
      # two-speech shift costs the DP 0.13 less than the true reading; this run holds
      # 1132-1137 to their own speeches so the covered entries above land.
      - { greek: "1132", english: "Slave, full war armour.", run: 6 }
      - { greek: "1140", english: "Slave, take up the buckler and let's be off.", run: 1 }
      - { greek: "1142", english: "Take up the basket, 'tis a question of getting to the feast.", run: 1 }
    # Item 1 (lane-a-r3-report item 6): the 1912 prints the arming-scene
    # couplets in the opposite order to Coulon (its "case for the crest"
    # pair before the "moths ate my crest" pair), so the English of
    # 1109-1112 belongs on 1107-1110 and the English of 1107-1108 on
    # 1111-1112 -- a crossing the monotone pairer cannot express as pins.
    transpositions:
      - { start: "1109", end: "1112", before: "1107" }
  secondary:
    id: hickie
    text_fixes:
      - find: "Barbarians. Aмв. Not so; he "
        replace: "Barbarians. Amb. Not so; he "
        note: "sweep 2026-09-24 n=10,12: build/genie/in.ernet.dli.2015.515629.txt:217"
      - find: "distinctly! Aмв. What, then,"
        replace: "distinctly! Amb. What, then,"
        note: "sweep 2026-09-24 n=11: build/genie/in.ernet.dli.2015.515629.txt:231"
      - find: "r cost. Will<sup>*</sup> you not let"
        replace: "r cost. Will* you not let"
        note: "sweep 2026-09-24 n=128: build/genie/in.ernet.dli.2015.515629.txt:929"
      # S16 drift (2026-09-26): Bohn's entrance heading "Theorus." (a
      # centred small-caps heading, not a cue) tailed onto the Herald's 134.
      - find: "from Sitalces. THEORUs."
        replace: "from Sitalces."
        note: "S16 2026-09-26: build/genie/in.ernet.dli.2015.515629.txt:258 prints it as the heading '### Tʜᴇᴏʀᴜs.'"
    name: "W. J. Hickie (Bohn, 1853)"
    short: Hickie
    model: turn-text
    format: loeb-ocr
    source: "bench/hickie/acharnians.txt"
    play: "THE ACHARNIANS"
    # The reader loads only one footnotes.json per play, and the primary
    # already carries its own (John's own retirement kept Hickie's off in
    # every play, 2026-09-14); the bench text still keeps every note as a
    # [n] marker + Footnotes: block.
    footnotes: false
    # Removing Frere's page-foot quotation after the fig question shortened
    # its neighbouring speech; anchor Dicaeopolis's Greek 804 reply. The
    # downstream arming exchange has near-identical alternating speeches,
    # so anchor Lamachus's opening there to prevent a new turn shift.
    pins:
      - { greek: "804", english: "How sharply you squeak at the figs!", run: 1 }
      - { greek: "1118", english: "Slave! slave! take down my spear", run: 1 }
      # S16 drift (2026-09-26): 134-140 sat two rows late ("Here am I!" at
      # 136). Held to their Greek: Ὁδί (134b), Ἕτερος ἀλαζὼν (135), Χρόνον
      # μὲν οὐκ ἂν ἦμεν ἐν Θρᾴκῃ (136), Μὰ Δί' οὐκ ἄν (137), εἰ μὴ
      # κατένειψε χιόνι (138), Κάκιστ' ἀπολοίμην (151). Hickie's 138 speech
      # runs on through 141-150; the cut opens 141 at Τοῦτον μετὰ Σιτάλκους
      # ἔπινον ("During this time I was drinking with Sitalces").
      - { greek: "134", english: "Here am I!", run: 5 }
      - { greek: "151", english: "May I die the worst of deaths", run: 1 }
    cuts:
      - { greek: "141", english: "During this time I was drinking with Sitalces" }
  # Item 6 (John, 2026-09-09): every Greek speech carries English, or is
  # declared below (gaps) or under primary.covered.
  strict_coverage: true
  gaps: []

