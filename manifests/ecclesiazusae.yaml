  blurb: "The women take over the assembly and make property and sex common to all."
  production: "c. 392 BC · festival and result unknown"
  argument: "The women of Athens, disguised as men, pack the assembly and vote themselves the government. Their new law makes property and sex common to all."
  synopsis: "Before dawn the women of Athens gather in their husbands' cloaks and false beards, having practised speaking in the assembly. Praxagora leads them. They pack the meeting and vote the government over to the women. Her programme: all property in common, all sex in common, with the old and ugly served first. One citizen hands in his goods; another waits to see. A young man on his way to his girl is claimed by three old women in turn, under the new law. Everyone goes off to the communal dinner."
