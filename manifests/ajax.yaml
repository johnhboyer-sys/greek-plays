english:
  primary:
    id: jebb
    text_fixes:
      - find: " oxen along with with all the she"
        replace: " oxen along with all the she"
        note: "sweep 2026-09-24 n=46: sources/perseus/tlg0011.tlg003.perseus-eng2.xml:245"
    name: "R. C. Jebb (Cambridge, 1883–1900)"
    short: Jebb
    model: perseus-play
    source: "perseus/tlg0011.tlg003.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # Jebb's own <l n="231"> is Tecmessa's entrance ("Ah! Then it was from
    # there, from there that he came to me with his captive flock!") -- his
    # n="230" already covers the Chorus's own combined 230/231-232 (Dain &
    # Mazon print 231-232 as one citation unit): "because the dark sword in
    # his frenzied hand massacred the herds and the horse-guiding herdsmen."
    # Tecmessa's actual Greek is 233-234 ("Ὤιμοι· κεῖθεν κεῖθεν ἄρ' ἡμῖν /
    # δεσμῶτιν ἄγων ἤλυθε ποίμναν·"), a plain mis-numbering, not an
    # antilabe (round 2 item 10, lane-c-r4-report-2026-09-18.md).
    line_fixes:
      "231": "233"
  secondary:
    id: storr
    name: "F. Storr (Loeb, 1913)"
    short: Storr
    model: turn-text
    format: loeb-ocr
    source: bench/storr/ajax.txt
    play: AJAX
    footnotes: true
  third:
    id: johnston
    name: "Ian Johnston (VIU)"
    short: Johnston
    model: turn-text
    format: verse-own-line
    source: bench/johnston/ajax.txt
    play: AJAX
    footnotes: false
    # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Ian Johnston (Vancouver Island University), johnstonia pages: "All
        general readers, teachers, students, and performing artists may
        download any material on johnstonia web pages without permission and
        without charge, provided they do not use the material in a commercial
        publication." Credited in sources/INVENTORY.md and on the attribution
        page.
      source_url: https://web.viu.ca/johnstoi/copyright.htm
  gaps: []

