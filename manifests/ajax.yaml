  production: "Date unknown, probably the 440s BC"
  argument: "Cheated of Achilles’ arms, Ajax slaughters the army’s cattle in a madness sent by Athena, and kills himself."
  synopsis: "The arms of the dead Achilles were awarded to Odysseus, not Ajax. In the night Ajax set out to kill the Greek commanders; Athena turned his mind, and he butchered the army's sheep and cattle instead. The play opens with Athena showing Odysseus the madman still exulting. When the fit lifts, Ajax faces what he has done, talks his wife Tecmessa and his sailors into leaving him alone, and falls on his sword. The second half is the fight over his body: Menelaus and Agamemnon forbid burial; Teucer defies them; Odysseus, his enemy, settles it."

