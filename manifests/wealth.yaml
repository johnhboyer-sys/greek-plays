  synopsis: "Chremylus, an honest poor man, asks the oracle how his son should live and is told to follow the first man he meets. The man is a blind beggar who turns out to be Wealth himself, blinded by Zeus so that he cannot find the good. Chremylus means to take him to the temple of Asclepius to be cured. The goddess Poverty comes first to argue that it is a mistake, and loses. Wealth's sight is restored and the honest grow rich. An informer complains that his trade is ruined, and the priest of Zeus and Hermes himself, with no one left sacrificing, come asking to serve the new master."

