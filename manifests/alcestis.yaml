  blurb: "Alcestis agrees to die in her husband Admetus' place, until Heracles wrestles Death for her."
  production: "City Dionysia, 438 BC · second prize, behind Sophocles · fourth play of its group, in place of a satyr play"
  argument: "Alcestis dies in her husband’s place. Heracles brings her back."
  synopsis: "Apollo won Admetus, king of Pherae, a bargain with the Fates: he may escape his appointed death if someone else will die for him. His parents refused. His wife Alcestis agreed. The play opens on the day of her death. While the house mourns, Heracles arrives on his way to a labour, and Admetus, unwilling to turn a guest away, hides the death from him and takes him in. Heracles finds out, goes to the tomb, wrestles Death for her, and brings her back veiled and silent to a husband who does not at first know her."
