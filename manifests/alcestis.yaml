          - { greek: "77", english: "Quiet, quiet, above, beneath", run: 1 }
          - { greek: "86", english: "And never a King's friend near", run: 1 }
          - { greek: "962", english: "I have sojourned in the Muse's land", run: 1 }
        covered:
