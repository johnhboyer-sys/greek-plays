      murray-verse:
        # bench/murray/alcestis.txt: LEADER and SECOND ELDER speak 77-78;
        # THIRD ELDER (79-85) runs on through DIVERS CITIZENS (no cue of the
        # roster, line 175) to 111, one English speech over the Greek
        # stanzas 86-111; CHORUS (line 1633) is 962-1005.
