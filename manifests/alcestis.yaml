      # OCR check 2026-09-29 (whole play read against the scan, archive.org euripidisfabulae01euriuoft
      # pages _0057-_0101). Each fix restores what the page prints where the
      # OCR reading is no Greek word or loses a word the sentence needs.
      # 262 αἵδας is not fixed: the ink prints αἵδας (rough breathing, between obeli), as Perseus has it
      # (John, 2026-10-01, review page; the first scan check had read a smooth breathing).
      - { ref: "403", find: "στόμασιν", replace: "νων στόμασιν", note: "scan _0072: 402-403 print πίτ-/νων στόμασιν; OCR dropped νων, so the hyphen rejoin made πίτστόμασιν (no word)" }
      - { ref: "740", find: "ὡς ἂν ἐν πυρᾷ", replace: "στείχωμεν, ὡς ἂν ἐν πυρᾷ", note: "scan _0085: line prints στείχωμεν, ὡς ἂν ...; OCR dropped the verb of ἡμεῖς δέ (739) and two feet of the trimeter" }
      - { ref: "877", find: "πρόσωπόν ἄντα", replace: "πρόσωπον ἄντα", note: "scan _0090: prints πρόσωπον (one accent); the OCR's second accent stands only before an enclitic" }
      - { ref: "1024", find: "τήνδε σοῖσι", replace: "δίδωμι τήνδε σοῖσι", note: "scan _0095: line prints δίδωμι τήνδε ...; OCR dropped the main verb of 1023-24 and two feet of the trimeter" }
      # Not an OCR error: Murray prints the psili-oxia sign in μὴ ῎λαβές (scan
      # _0098); stage 3 cannot key U+1FCE, so it becomes the file's usual
      # elision mark U+02BC, as Hecuba 387.
      - { ref: "1102a", find: "῎λαβές", replace: "ʼλαβές", note: "scan _0098 prints μὴ ῎λαβές; U+1FCE breaks the key (stage 3); elision mark as Hecuba 387" }
