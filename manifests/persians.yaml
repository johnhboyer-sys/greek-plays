# Persae (Aeschylus, TLG 0085: 002) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0085/Diogenes-Resources/xml/tlg/tlg0085002.xml),
# verified by two `all --work persians --public` runs (docs/p2-greek-report.md).

work:
  id: persians
  title: Persians
  author: aeschylus
  language: grc
  tlg_author: "0085"
  tlg_work: "002"
  greek_edition: "Murray, Aeschyli tragoediae, 2nd ed. (OCT, 1955)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Aeschylus Trag. (c. 6-5 B.C.), Persae (0085: 002) "Aeschyli tragoediae, 2nd edn.", Ed. Murray, G. Oxford: Clarendon Press, 1955, Repr. 1960.'

english:
  primary:
    id: smyth
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg002.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: true
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:
    - "1:1019"
    - "1:1077"
    - "1:956"
    - "1:968"
    - "1:1019"  # no covering <l n> in the Perseus TEI
    - "1:1077"  # no covering <l n> in the Perseus TEI

citation:
  scheme: play-line

  title_labels:
    - { sha256_16: "f77419a72561c83c", note: "play title line (l n=\"t\"), 'ΠΕΡΣΑΙ'" }

  lacunae:
    "1": []

  transpositions:
    "1": 
      - { start: "367", end: "367", before: "368" }

  fingerprint: { count: 1044, sha256: "6c4618f8b98ca94935dcf467000f17078aae0074c8b5ed140b6e013b55a89a3d" }

speakers:
  english:
    "Chorus": "Chorus"
    "Atossa": "Atossa"
    "Messenger": "Messenger"
    "Ghost of Darius": "Ghost of Darius"
    "Xerxes": "Xerxes"
    "Darius": "Ghost of Darius"
  # Murray's Greek sigla -> canonical English display, hand-resolved from the
  # export's own full-caps first appearances (gen_speaker_rosters.py report
  # mode; --perseus/--spine name proposals are NOT trusted, see
  # docs/p2-greek-report.md).
  sigla:
    "ΧΟΡΟΣ": "Chorus"
    "Χο.": "Chorus"
    "Χο. —": "Chorus"
    "ΒΑΣΙΛΕΙΑ": "Atossa"
    "Βα.": "Atossa"
    "ΑΓΓΕΛΟΣ": "Messenger"
    "Αγ.": "Messenger"
    "ΕΙΔΩΛΟΝ ΔΑΡΕΙΟΥ": "Ghost of Darius"
    "Δα.": "Ghost of Darius"
    "ΞΕΡΞΗΣ": "Xerxes"
    "Ξε.": "Xerxes"
    "Ξε.>": "Xerxes"
    "—": null

books:
  - { n: 1, start: "1", end: "1077" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

