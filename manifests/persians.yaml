  synopsis: "At Susa the elders of the Persian council wait for word from Xerxes' expedition against Greece. Atossa, the queen mother, comes out troubled by a dream. A messenger arrives with the news of Salamis: the fleet destroyed, the army in retreat over a starving country. Atossa and the elders call up the ghost of Darius, who blames his son's pride and foretells the defeat at Plataea. Xerxes himself comes home in torn robes, and the play ends in lament."

