english:
  primary:
    id: smyth
    text_fixes:
      - find: " But as for the the full extent"
        replace: " But as for the full extent"
        note: "sweep 2026-09-24 n=110: sources/perseus/tlg0085.tlg002.perseus-eng2.xml:569"
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg002.perseus-eng2.xml"
    anchor_model: sp-line
    cuts:
      # 2026-09-26: 956 opens mid-line in smyth's <l n=955>; cut seats it (s15 triage).
      - { greek: "956", english: "Where is the rest" }
      # 2026-09-26: 957 opens mid-line in smyth's <l n=955>; cut seats it (s15 triage).
      - { greek: "957", english: "Where are those who stood" }
    footnotes: true
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "968", by: "967" }
  secondary:
    id: morshead
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/persians.txt
    play: THE PERSIANS
    footnotes: false
  third:
    id: johnston
    text_fixes:
      - find: "of Persia.\n\n{Enter Atossa"
        replace: "of Persia.\n\n[Enter Atossa"
        note: "sweep 2026-09-24 n=34: sources/johnston/persians.htm"
    name: "Ian Johnston (VIU)"
    short: Johnston
    model: turn-text
    format: verse-own-line
    source: bench/johnston/persians.txt
    play: PERSIANS
    footnotes: false
    # Drift sweep 2 (2026-09-25): the parodos ran a segment or two late
    # from 65 to 158. The opening anapaests (1-64) spread over 1-139, the
    # sung ode ("Obliterating cities", 65-139) sat at 140, and the closing
    # anapaests (140-158) at 155, with 150 bare. Read against the Greek:
    # 65 the army has crossed (to 110, "leap above that snare"), 111 fair
    # Delusion (to 139), 140 let us take our seats, 150 the queen
    # approaches, 155 hail, O queen. A CHORUS LEADER cue on the source's
    # blank line after each stage direction opens 150 and 155.
    line_fixes:
      153: "[CHORUS LEADER]"
      161: "[CHORUS LEADER]"
    pins:
      - { greek: "65", english: "Obliterating cities as it moves", run: 1 }
      - { greek: "140", english: "Come now, Persians, let us take our seats", run: 3 }
    # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Ian Johnston (Vancouver Island University), johnstonia pages: "All
        general readers, teachers, students, and performing artists may
        download any material on johnstonia web pages without permission and
        without charge, provided they do not use the material in a commercial
        publication." Credited in sources/INVENTORY.md and on the attribution
        page.
      source_url: https://web.viu.ca/johnstoi/copyright.htm
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

