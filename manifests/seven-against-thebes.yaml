  argument: "Eteocles defends Thebes against his brother Polynices. The brothers kill each other at the seventh gate."
  synopsis: "Thebes is under siege. Polynices, son of Oedipus, has brought an Argive army against the city his brother Eteocles rules. Eteocles steadies the terrified women of the chorus, then hears a scout describe the seven champions posted at the seven gates and names a defender for each. The seventh gate is Polynices', and Eteocles takes it himself. The city is saved; the brothers kill each other, and their sisters mourn them."
