english:
  primary:
    id: smyth
    text_fixes:
      - find: "ll, he will be be dragged dow"
        replace: "ll, he will be dragged dow"
        note: "sweep 2026-09-24 n=117: sources/perseus/tlg0085.tlg004.perseus-eng2.xml:677"
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg004.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: true
    # Smyth's <l n> follows the vulgate order. Murray prints 803 and 810
    # twice and transposes them (803 after 806, 810 after 812), so those
    # numbers are not the same verses. "810.2" is the second printing of 810.
    line_fixes:
      "805": "808"    # τίνες; τί δ' εἶπας; — Who? What did you say?
      "806": "809"    # φρονοῦσα νῦν ἄκουσον — Control yourself now and listen
      "807": "805"    # οἲ 'γὼ τάλαινα — Ah, miserable me, I am prophet
      "808": "810.2"  # οὐδ' ἀμφιλέκτως μὴν κατεσποδημένοι — beyond all question, struck down
      "809": "810"    # ἐκεῖθι κἦλθον; — Are they lying out there?
      "810": "807"    # ἅνδρες τεθνᾶσιν — The men are dead
      "811": "812"    # οὕτως ἀδελφαῖς χερσὶν — with hands so fraternal
      "812": "813"    # οὕτως ὁ δαίμων κοινὸς — so all too equal was their destiny
    # S11 sweep row 853 (2026-09-25): 971-1004. Smyth numbers the dirge by the
    # vulgate, four lines behind Murray and in the vulgate order; each of his
    # lines is keyed to the Murray line it renders, read against the Greek.
    # Murray prints 993 before 984-992 and 983 after 992 (citation
    # transpositions), and Smyth's English follows that printed order.
      "972": "971"    # καὶ φίλον ἔκτανες — And you killed your nearest and dearest
      "973": "972"    # διπλόα λέγειν — Twofold to tell of
      "974": "972"    # διπλόα δ' ὁρᾶν — Twofold to look upon
      "975": "973"    # ἀχέων τοίων τάδ' ἐγγύθεν — Are these sorrows so close to those
      "976": "974"    # πέλας δ' αἵδ' ἀδελφαὶ ἀδελφεῶν — Fraternal sorrows stand close
      "980": "978"    # ἠέ — Ah, me
      "980b": "978"   # ἠέ — Ah, me
      "981": "978"    # δυσθέατα πήματα — Sorrows hard to behold
      "982": "979"    # ἐδείξατ' ἐκ φυγᾶς ἐμοί — He showed me when he returned from exile
      "983": "980"    # οὐδ' ἵκεθ' ὡς κατέκτανεν — But he made no return after he had killed
      "984": "981"    # σωθεὶς δὲ πνεῦμ' ἀπώλεσεν — He was saved, but lost his life
      "985": "982"    # ὤλεσε δῆθ' — He lost it, all too truly
      "986": "982"    # καὶ τὸν ἐνόσφισεν — And took this one's life away
      "987": "983"    # τάλαν γένος — Wretched family!
      "988": "983"    # τάλανα παθόν — Wretched suffering!
      "989": "984"    # δύστονα κήδε' ὁμώνυμα — Kindred sorrows full of groans
      "990": "985"    # δίυγρα τριπάλτων πημάτων — Sorrows steeped in tripled griefs
      "991": "986"    # ἰὼ Μοῖρα βαρυδότειρα — O Fate, giver of grievous troubles
      "994": "989"    # σὺ τοί νιν οἶσθα διαπερῶν — Now you know of the Erinys
      "995": "990"    # σὺ δ' οὐδὲν ὕστερος μαθών — And you are made aware no later
      "996": "991"    # ἐπεὶ κατῆλθες ἐς πόλιν — When you came back to our city
      "997": "992"    # δορός γε τῷδ' ἀντηρέτας — Yes, to face him with your spear
      "998": "993"    # ὀλοὰ λέγειν — A tale of destruction!
      "999": "993"    # ὀλοὰ δ' ὁρᾶν — Destruction to look upon!
      "1000": "994"   # ἰὼ πόνος — Oh, the grief
      "1001": "994"   # ἰὼ κακά — Oh, the evils
      "1002": "995"   # δώμασι, καὶ χθονί — For home and land
      "1003": "996"   # πρὸ πάντων δ' ἐμοί — Above all for me
      "1004": "997"   # καὶ τὸ πρόσω γ' ἐμοί — And more also for me
      "1005": "998"   # δυστόνων κακῶν ἄναξ — Ah I pity your grievous suffering, my king
      "1006": "1000"  # πάντων πολυπονωτάτω — Pity for you both, most lamentable
      "1007": "1001"  # δαιμονῶντ' ἐν ἄτᾳ — You were possessed by delusion
      "1008": "1002"  # ποῦ σφε θήσομεν χθονός — Where shall we lay them in the earth?
      "1009": "1003"  # ὅπου τιμιώτατον — Ah, where their honor is greatest
      "1010": "1004"  # πῆμα πατρὶ πάρευνον — To lie beside their father
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "101", by: "100" }
      - { greek: "103", by: "104" }
      - { greek: "1042", by: "1048" }
      - { greek: "1044", by: "1050" }
      - { greek: "1046", by: "1051" }
      - { greek: "1047", by: "1052" }
      - { greek: "106", by: "104" }
      - { greek: "367", by: "327" }
      - { greek: "97", by: "100" }
      - { greek: "806", by: "813" }  # vulgate order: 806 ends inside Smyth's 813 speech (owner ruling 2026-09-22)
  secondary:
    id: morshead
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/seven-against-thebes.txt
    play: THE SEVEN AGAINST THEBES
    footnotes: false
    # This column prints 808–809 (τίνες; τί δ' εἶπας; / φρονοῦσα νῦν ἄκουσον)
    # before 805 (οἲ 'γὼ τάλαινα). The window also holds 806 πέπωκεν αἷμα
    # and 807 ἅνδρες τεθνᾶσιν.
    transpositions:
      - { start: "808", end: "809", before: "805" }
    # John 2026-09-11: shift over 0.10 by under a point; let it slide for now
    max_turn_shift_rate: 0.11
    # vulgate order: 806 ends inside Morshead's 813 speech (owner ruling 2026-09-22)
    covered:
      - { greek: "806", by: "813" }
    # S11 sweep row 49 (2026-09-25): the parodos ran one strophe early from
    # 89 to 109 (the torrent speech at 85 took "They stream to the walls",
    # 89-91, and each speech after sat one row up). Read against the Greek:
    # 89-91 walls, 92-96 what god, 97-98 crouch at the shrines, 98-100 shield
    # clashes, 101-102 robes, 103 clang, 104-105 Ares, 106-107 look down,
    # 109-160 the long prayer.
    pins:
      - { greek: "89-90", english: "They stream to the walls from without", run: 8 }
      # The long prayer (109-160) and the closing strophe ("Thou too, O
      # daughter of Zeus", 161-180) share the 109 row, spread over 109-180;
      # pinning the second holds both in the ode, off Eteocles' 182.
      - { greek: "109", english: "Thou too, O daughter of Zeus", run: 1 }
  third:
    id: kosmos
    text_fixes:
      - find: "ll, he will be be dragged dow"
        replace: "ll, he will be dragged dow"
        note: "sweep 2026-09-24 n=118: sources/kosmos/seven-against-thebes.html"
    name: "Smyth, rev. Seven Heroization team (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/seven-against-thebes.txt
    play: SEVEN AGAINST THEBES
    footnotes: false
    # Item 7 (play-seven-against-thebes-findings #13): one speech ahead
    # across the two semichorus lines, so the cue sits on the wrong
    # speaker's Greek.
    pins:
      - { greek: "369", english: "The scout, I believe, is bringing some fresh news of the army", run: 1 }
    # This column prints 808–809 (τίνες; τί δ' εἶπας; / φρονοῦσα νῦν ἄκουσον)
    # before 805 (οἲ 'γὼ τάλαινα). The window also holds 806 πέπωκεν αἷμα
    # and 807 ἅνδρες τεθνᾶσιν.
    transpositions:
      - { start: "808", end: "809", before: "805" }
    # vulgate order: 806 ends inside Kosmos's 813 speech (owner ruling 2026-09-22)
    covered:
      - { greek: "806", by: "813" }
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
