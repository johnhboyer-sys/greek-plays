    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/seven-against-thebes.txt
    play: SEVEN AGAINST THEBES
    footnotes: false
    # Item 7 (play-seven-against-thebes-findings #13): one speech ahead
    # across the two semichorus lines, so the cue sits on the wrong
    # speaker's Greek.
    pins:
      - { greek: "369", english: "The scout, I believe, is bringing some fresh news of the army", run: 1 }
      # Drift sweep 4 (2026-09-26): 995-1004 sat one speech early (Ismene's
      # "Above all for me", 996, closed the 995 row; "To lie beside their
      # father", 1004, sat at 1003). Kosmos alternates the sisters' cues one
      # line off the edition's, so each cue stays as printed; the pin seats
      # "Above all for me" on πρὸ πάντων δ' ἐμοί (996) and the next seven
      # speeches on 997-1004 (1004 πάρευνον, "To lie beside their father").
      - { greek: "996", english: "Above all for me", run: 8 }
    # Drift sweep 4 (2026-09-26): Kosmos prints the lament 822-960 as one
    # Chorus speech of paragraphs, and from 845 the spread ran one or two
    # segments late ("Ah, sisters most unfortunate", 871, sat at 879; 903-905,
