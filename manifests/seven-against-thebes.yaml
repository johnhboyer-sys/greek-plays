      "983": "980"    # οὐδ' ἵκεθ' ὡς κατέκτανεν — But he made no return after he had killed
      "984": "981"    # σωθεὶς δὲ πνεῦμ' ἀπώλεσεν — He was saved, but lost his life
      "985": "982"    # ὤλεσε δῆθ' — He lost it, all too truly
      "986": "982"    # καὶ τὸν ἐνόσφισεν — And took this one's life away
      "987": "983"    # τάλαν γένος — Wretched family!
      "988": "983"    # τάλανα παθόν — Wretched suffering!
      "989": "984"    # δύστονα κήδε' ὁμώνυμα — Kindred sorrows full of groans
      "990": "985"    # δίυγρα τριπάλτων πημάτων — Sorrows steeped in tripled griefs
      "991": "986"    # ἰὼ Μοῖρα βαρυδότειρα — O Fate, giver of grievous troubles
      "994": "989"    # σὺ τοί νιν οἶσθα διαπερῶν — Now you know of the Erinys
      "995": "990"    # σὺ δ' οὐδὲν ὕστερος μαθών — And you are made aware no later
      "996": "991"    # ἐπεὶ κατῆλθες ἐς πόλιν — When you came back to our city
      "997": "992"    # δορός γε τῷδ' ἀντηρέτας — Yes, to face him with your spear
      "998": "993"    # ὀλοὰ λέγειν — A tale of destruction!
      "999": "993"    # ὀλοὰ δ' ὁρᾶν — Destruction to look upon!
      "1000": "994"   # ἰὼ πόνος — Oh, the grief
      "1001": "994"   # ἰὼ κακά — Oh, the evils
      "1002": "995"   # δώμασι, καὶ χθονί — For home and land
      "1003": "996"   # πρὸ πάντων δ' ἐμοί — Above all for me
      "1004": "997"   # καὶ τὸ πρόσω γ' ἐμοί — And more also for me
      "1005": "998"   # δυστόνων κακῶν ἄναξ — Ah I pity your grievous suffering, my king
