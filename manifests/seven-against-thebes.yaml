      "1008": "1002"  # ποῦ σφε θήσομεν χθονός — Where shall we lay them in the earth?
      "1009": "1003"  # ὅπου τιμιώτατον — Ah, where their honor is greatest
      "1010": "1004"  # πῆμα πατρὶ πάρευνον — To lie beside their father
    # Turn-starts triage (2026-09-26): 1005-1078. From the Herald on, Smyth's
    # numbers run six ahead of Murray; 1057 renders 1051-52, so 1058-1059
    # are five ahead.
      "1011": "1005"  # δοκοῦντα καὶ δόξαντ' — It is my duty to announce
      "1015": "1009"  # στέγων γὰρ ἐχθροὺς — for hating the enemy
      "1020": "1014"  # ἔξω βαλεῖν ἄθαπτον — is to be cast out of the city unburied
      "1025": "1019"  # στράτευμ' ἐπακτὸν — when he launched a foreign army
      "1030": "1024"  # ἄτιμον εἶναι δ' ἐκφορᾶς — He is to be refused the honor
