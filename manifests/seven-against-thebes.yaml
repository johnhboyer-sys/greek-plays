      - { greek: "848", english: "The events are self-evident" }      # τάδ' αὐτόδηλα
      - { greek: "854", english: "But sail upon the wind" }           # ἀλλὰ γόων, ὦ φίλαι
      - { greek: "861", english: "But here come Antigone" }           # ἀλλὰ γὰρ ἥκουσ' αἵδ'
      - { greek: "871", english: "Ah, sisters most unfortunate" }     # ἰώ. δυσαδελφόταται
      - { greek: "875", english: "Ah, pity you men" }                 # ἰὼ ἰὼ δύσφρονες
      - { greek: "879", english: "To their misery, indeed" }          # μέλεοι δῆθ'
      - { greek: "881", english: "Ah, you brothers" }                 # ἰὼ ἰὼ δωμάτων ἐρειψίτοιχοι
      - { greek: "886", english: "The great Erinys" }                 # κάρτα δ' ἀληθῆ ... Ἐρινὺς
      - { greek: "888", english: "Pierced through your left sides" }  # δι' εὐωνύμων τετυμμένοι
      - { greek: "895", english: "Right through, as you say" }        # διανταίαν λέγεις
      - { greek: "900", english: "Groaning spreads" }                 # διήκει δὲ καὶ πόλιν στόνος
      - { greek: "906", english: "In their haste to anger" }          # ἐμοιράσαντο δ' ὀξυκάρδιοι
      - { greek: "911", english: "Under strokes of iron" }            # σιδηρόπληκτοι
      - { greek: "915", english: "Our shrill, heart-rending wail" }   # δόμων μάλ' ἀχάεσσα
      - { greek: "923", english: "Over these competing" }             # πάρεστι δ' εἰπεῖν ἐπ' ἀθλίοισιν
      - { greek: "926", english: "Ill-fated" }                        # δυσδαίμων σφιν ἁ τεκοῦσα
      - { greek: "933", english: "Of the same seed" }                 # ὁμόσποροι δῆτα
      - { greek: "938", english: "Their enmity" }                     # πέπαυται δ' ἔχθος
      - { greek: "947", english: "They hold in misery" }              # ἔχουσι μοῖραν λαχόντες
      - { greek: "951", english: "Ah, you have wreathed" }            # ἰὼ πολλοῖς ἐπανθίσαντες
