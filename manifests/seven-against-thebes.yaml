      "1035": "1029"  # θάψασ' ἀδελφὸν — of burying my own brother
      "1040": "1034"  # ψυχή, θανόντι ζῶσα — and live in kindred spirit with the dead
      "1045": "1039"  # κόλπῳ φέρουσα βυσσίνου — carrying the earth in the fold
      "1048": "1042"  # αὐδῶ πόλιν σε μὴ βιάζεσθαι — I forbid you to act thus
      "1049": "1043"  # αὐδῶ σε μὴ περισσὰ — I forbid you to make useless proclamations
      "1050": "1044"  # τραχύς γε μέντοι δῆμος — a citizenry ... can be harsh
      "1051": "1045"  # τράχυν'· ἄθαπτος — Let it be harsh!
      "1052": "1046"  # ὃν πόλις στυγεῖ — a man whom the city detests
      "1053": "1047"  # ἤδη τὰ τοῦδ' — For a long time now the gods
      "1054": "1048"  # οὔ, πρίν γε χώραν — No, he was honored until
      "1055": "1049"  # παθὼν κακῶς κακοῖσιν — He suffered evil
      "1056": "1050"  # ἀλλ' εἰς ἅπαντας — But this act was against all the citizens
      "1057": "1051"  # Ἔρις περαίνει μῦθον — Discord is the last of the gods
      "1058": "1053"  # ἀλλ' αὐτόβουλος ἴσθ' — Well then, follow your own rash plan
      "1059": "1054"  # φεῦ φεῦ — Ah, misery!
      "1060": "1054"  # ὦ μεγάλαυχοι — O Erinyes, far-famed destroyers
      "1065": "1059"  # μήτε προπέμπειν ἐπὶ τύμβῳ — nor escort you to your tomb
      "1070": "1064"  # μονόκλαυτον ... ἀδελφῆς — has a dirge sung only by one sister
      "1072": "1066"  # δράτω τι πόλις — Let the city take action
      "1075": "1069"  # αἵδε προπομποί — following the funeral procession
      "1078": "1072"  # ἡμεῖς δ' ἅμα τῷδ' — We will go with this other corpse
      "1080": "1074"  # μετὰ γὰρ μάκαρας — For after the blessed gods
