    # S11 sweep row 49 (2026-09-25): the parodos ran one strophe early from
    # 89 to 109 (the torrent speech at 85 took "They stream to the walls",
    # 89-91, and each speech after sat one row up). Read against the Greek:
    # 89-91 walls, 92-96 what god, 97-98 crouch at the shrines, 98-100 shield
    # clashes, 101-102 robes, 103 clang, 104-105 Ares, 106-107 look down,
    # 109-160 the long prayer.
    pins:
      - { greek: "89-90", english: "They stream to the walls from without", run: 8 }
      # The long prayer (109-160) and the closing strophe ("Thou too, O
      # daughter of Zeus", 161-180) share the 109 row, spread over 109-180;
      # pinning the second holds both in the ode, off Eteocles' 182.
      - { greek: "109", english: "Thou too, O daughter of Zeus", run: 1 }
  third:
    id: kosmos
    text_fixes:
      - find: "ll, he will be be dragged dow"
        replace: "ll, he will be dragged dow"
        note: "sweep 2026-09-24 n=118: sources/kosmos/seven-against-thebes.html"
