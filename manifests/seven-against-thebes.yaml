# Antigone (Sophocles, TLG 0011: 002) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0085/Diogenes-Resources/xml/tlg/tlg0085004.xml),
# verified by two `all --work antigone --public` runs (docs/p2-greek-report.md).

work:
  id: seven-against-thebes
  title: "Seven Against Thebes"
  author: aeschylus
  language: grc
  tlg_author: "0085"
  tlg_work: "004"
  greek_edition: "Murray, Aeschyli tragoediae, 2nd ed. (OCT, 1955)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Aeschylus Trag. (c. 6-5 B.C.), Septem contra Thebas (0085: 004) "Aeschyli tragoediae, 2nd edn.", Ed. Murray, G. Oxford: Clarendon Press, 1955, Repr. 1960.'

english:
  primary:
    id: smyth
    name: "H. W. Smyth (Loeb, 1922–26)"
    short: Smyth
    model: perseus-play
    source: "perseus/tlg0085.tlg004.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: true
    # Smyth's <l n> follows the vulgate order. Murray prints 803 and 810
    # twice and transposes them (803 after 806, 810 after 812), so those
    # numbers are not the same verses. "810.2" is the second printing of 810.
    line_fixes:
      "805": "808"    # τίνες; τί δ' εἶπας; — Who? What did you say?
      "806": "809"    # φρονοῦσα νῦν ἄκουσον — Control yourself now and listen
      "807": "805"    # οἲ 'γὼ τάλαινα — Ah, miserable me, I am prophet
      "808": "810.2"  # οὐδ' ἀμφιλέκτως μὴν κατεσποδημένοι — beyond all question, struck down
      "809": "810"    # ἐκεῖθι κἦλθον; — Are they lying out there?
      "810": "807"    # ἅνδρες τεθνᾶσιν — The men are dead
      "811": "812"    # οὕτως ἀδελφαῖς χερσὶν — with hands so fraternal
      "812": "813"    # οὕτως ὁ δαίμων κοινὸς — so all too equal was their destiny
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "101", by: "100" }
      - { greek: "103", by: "104" }
      - { greek: "1042", by: "1048" }
      - { greek: "1044", by: "1050" }
      - { greek: "979", by: "982" }  # Smyth renders 979 as his 982 "He showed me when he returned from exile." (the kommos follows a different lineation; Lane C round 3, 2026-09-18)
      - { greek: "986", by: "991" }  # Smyth's 991 "O Fate, giver of grievous troubles..." renders 986-988
      - { greek: "1046", by: "1051" }
      - { greek: "1047", by: "1052" }
      - { greek: "106", by: "104" }
      - { greek: "367", by: "327" }
      - { greek: "97", by: "100" }
      - { greek: "981", by: "985" }
      - { greek: "992", by: "997" }
      - { greek: "993", by: "998" }
  secondary:
    id: morshead
    name: "E. D. A. Morshead (1881–1908)"
    short: Morshead
    model: turn-text
    format: verse-own-line
    source: bench/morshead/seven-against-thebes.txt
    play: THE SEVEN AGAINST THEBES
    footnotes: false
    # This column prints 808–809 (τίνες; τί δ' εἶπας; / φρονοῦσα νῦν ἄκουσον)
    # before 805 (οἲ 'γὼ τάλαινα). The window also holds 806 πέπωκεν αἷμα
    # and 807 ἅνδρες τεθνᾶσιν.
    transpositions:
      - { start: "808", end: "809", before: "805" }
    # John 2026-09-11: shift over 0.10 by under a point; let it slide for now
    max_turn_shift_rate: 0.11
  third:
    id: kosmos
    name: "Smyth, rev. Seven Heroization team (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/seven-against-thebes.txt
    play: SEVEN AGAINST THEBES
    footnotes: false
    # Item 7 (play-seven-against-thebes-findings #13): one speech ahead
    # across the two semichorus lines, so the cue sits on the wrong
    # speaker's Greek.
    pins:
      - { greek: "369", english: "The scout, I believe, is bringing some fresh news of the army", run: 1 }
    # This column prints 808–809 (τίνες; τί δ' εἶπας; / φρονοῦσα νῦν ἄκουσον)
    # before 805 (οἲ 'γὼ τάλαινα). The window also holds 806 πέπωκεν αἷμα
    # and 807 ἅνδρες τεθνᾶσιν.
    transpositions:
      - { start: "808", end: "809", before: "805" }
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
        Gregory Nagy. Reproduced without change under CC BY-NC-ND 3.0:
        https://creativecommons.org/licenses/by-nc-nd/3.0/ . This site gives credit and is non-commercial. Every translator and reviser is credited in sources/INVENTORY.md and on the attribution page.
      source_url: https://kosmossociety.org/seven-against-thebes-aeschylus/
  overlays:
    - id: johnston
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/seven-against-thebes.txt
      play: SEVEN AGAINST THEBES
      footnotes: false
      # This column prints 808–809 (τίνες; τί δ' εἶπας; / φρονοῦσα νῦν ἄκουσον)
      # before 805 (οἲ 'γὼ τάλαινα). The window also holds 806 πέπωκεν αἷμα
      # and 807 ἅνδρες τεθνᾶσιν.
      transpositions:
        - { start: "808", end: "809", before: "805" }
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
          general readers, teachers, students, and performing artists may
          download any material on johnstonia web pages without permission and
          without charge, provided they do not use the material in a commercial
          publication." Credited in sources/INVENTORY.md and on the attribution
          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
  # Morshead secondary pairs 0.627 (sweep 2026-09-08): 104 English speaker-turns
  # against 161 named Greek segments. Murray cuts the parodos and kommos into
  # many lyric segments; Morshead prints long Chorus odes and one combined
  # Antigone/Ismene/Chorus heading, and never labels Ismene. Every recovered
  # English turn already pairs; aliases cannot invent labels the scan never printed.
  min_pairing_rate: 0.60
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  # Round 2 item 12 (2026-09-18): the sweep-2026-09-08 attachment loss
  # this ceiling allowed for is gone -- earlier lanes' repairs (C15's
  # unprinted-ref seat, C17's bracketed-siglum split, and others) have
  # since attached every one of those pieces. Re-measured at 0.
  max_unresolved_mismatches: 0
  gaps:

