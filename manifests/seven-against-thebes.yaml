      # S11 sweep rows 525, 979, 1384 (2026-09-25): Johnston's second Chorus
      # speech opens at 845 (ἰὼ πολύστονοι, "O you who bring us so much
      # sorrow") but was seated at 875, so the first speech spread over
      # 848-874 and the whole lament ran 14 lines and more late.
      # Johnston prints 845-960 as one Chorus speech (from 875 the edition
      # divides it among Antigone, Ismene, and the Chorus), and the spread ran
      # it five to fourteen lines late. A CHORUS cue (on the source's blank
      # line before the stanza) opens each stanza that begins a Greek
      # segment, and the pins seat each on its own Greek, read line by line:
      # 848 sorrow + messenger, 854 the Acheron ship, 861 the sisters come +
      # the Furies' hymn, 871 the two sisters, 875 hard-hearted, 879 wretched death, 881 reconciled with swords,
      # 886 the Fury, 888 left sides, 895 deadly blows, 900 the city grieves,
      # 906 split their property, 911 struck down by iron, 915 groans,
      # 923 citizens and foreigners, 926 the mother, 933 one seed, 938
      # enmity done + the stranger from the sea, 947 allotted shares,
      # 951 the trophy to Ruin.
      pins:
        # Drift sweep 2 (2026-09-25): the parodos ran a segment late from 100
        # to 106 (the robes and garlands, 101-102, sat at 103; the clash of
        # more than one spear, 103, at 104). Each of these Greek segments is
        # its own speech (a dash siglum), so a CHORUS cue on the source's
        # blank line opens each stanza, and the pin seats each on its own
        # Greek, read line by line: 100 useless wailing and the din of
        # shields (99-100), 101 robes and garlands, 103 no single spear, 104
        # Ares, 106 the golden helmet, 109 all you gods who guard our state.
        - { greek: "100", english: "Why waste our time in useless wailing?", run: 6 }
        - { greek: "848", english: "O you who bring us so much sorrow", run: 4 }
        # Drift sweep 2 (2026-09-25): the Herald's stichomythia ran two lines
        # late from 1043 to 1051 (1043-1044 bare, "And I am saying" at 1045).
        # Read line by line: 1043 futile proclamations, 1044 the people may
        # be harsh, 1045 let them be harsh, 1046 the city hates this man,
        # 1047 no honour from the gods, 1048 until he put the land in danger,
        # 1049 paying back the harm, 1050 hurt all the citizens, 1052 Eris
        # and I will bury him (1051-1052).
        - { greek: "1043", english: "And I am saying you should not bother me", run: 8 }
        - { greek: "875", english: "O you hard-hearted, senseless men", run: 8 }
        - { greek: "911", english: "So here they lie, struck down by iron.", run: 8 }
