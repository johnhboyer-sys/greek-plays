      "976": "974"    # πέλας δ' αἵδ' ἀδελφαὶ ἀδελφεῶν — Fraternal sorrows stand close
      "980": "978"    # ἠέ — Ah, me
      "980b": "978"   # ἠέ — Ah, me
      "981": "978"    # δυσθέατα πήματα — Sorrows hard to behold
