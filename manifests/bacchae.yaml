# Bacchae (Euripides, TLG 0006: 050) -- P2-Greek,
# play-line scheme (docs/play-line.md), Greek-only (work.no_english: true).
# citation.{title_labels,lacunae,transpositions,fingerprint} pinned from the
# real export (build/export/tlg0006/Diogenes-Resources/xml/tlg/tlg0006050.xml),
# verified by two `all --work bacchae --public` runs (docs/p2-greek-report.md).

work:
  id: bacchae
  title: Bacchae
  author: euripides
  language: grc
  tlg_author: "0006"
  tlg_work: "050"
  greek_edition: "Diggle, Euripidis fabulae, vol. 3 (OCT, 1994)"
  lexicon: true
  # FATAL sourceDesc gate -- verified verbatim against the real export.
  expected_sourcedesc: 'Euripides Trag. (c. 5 B.C.), Bacchae (0006: 050) "Euripidis fabulae, vol. 3", Ed. Diggle, J. Oxford: Clarendon Press, 1994.'

english:
  primary:
    # Perseus's Bacchae English (tlg0006.tlg017.perseus-eng2) is Buckley's
    # Bohn version, not Coleridge's -- the TEI header names him (2026-09-09).
    id: buckley
    name: "T. A. Buckley (Bohn, 1850)"
    short: Buckley
    model: perseus-play
    source: "perseus/tlg0006.tlg017.perseus-eng2.xml"
    anchor_model: sp-line
    footnotes: false
    # REVIEW-CHECKLIST 7 (2026-09-09): Greek speeches whose English sits in the
    # neighbouring block (the reader shows 'Translated with the speech above').
    covered:
      - { greek: "206", by: "204" }
      - { greek: "591", by: "586" }
      - { greek: "843a", by: "842" }
  secondary:
    id: way
    name: "A. S. Way (Loeb, 1912)"
    short: Way
    model: turn-text
    format: loeb-ocr
    source: bench/way/bacchae.txt
    play: THE BACCHANALS
    footnotes: true
  third:
    id: kosmos
    name: "Buckley, rev. Sens & Nagy (Kosmos Society)"
    short: Kosmos
    model: turn-text
    format: verse-own-line
    source: bench/kosmos/bacchae.txt
    play: BACCHAE
    footnotes: false
    # Not public domain: the Sourcebook's own licence (owner ruling 2026-09-12).
    license:
      status: licensed
      rationale: >-
        Kosmos Society / Center for Hellenic Studies online Sourcebook, ed.
        Gregory Nagy. Reproduced without change under CC BY-NC-ND 3.0:
        https://creativecommons.org/licenses/by-nc-nd/3.0/ . This site gives
        credit and is non-commercial. Every translator and reviser is credited
        in sources/INVENTORY.md and on the attribution page.
      source_url: https://kosmossociety.org/bacchae-euripides/
  overlays:
    - id: johnston
      name: "Ian Johnston (VIU)"
      short: Johnston
      model: turn-text
      format: verse-own-line
      source: bench/johnston/bacchae.txt
      play: BACCHAE
      footnotes: false
      # Not public domain: Johnston's own free-use terms (owner ruling 2026-09-12).
      license:
        status: licensed
        rationale: >-
          Ian Johnston (Vancouver Island University), johnstonia pages: "All
          general readers, teachers, students, and performing artists may
          download any material on johnstonia web pages without permission and
          without charge, provided they do not use the material in a commercial
          publication." Credited in sources/INVENTORY.md and on the attribution
          page.
        source_url: https://web.viu.ca/johnstoi/copyright.htm
    - id: murray-verse
      name: "Gilbert Murray"
      short: Murray
      model: turn-text
      format: verse-own-line
      source: bench/murray/bacchae.txt
      play: BACCHAE
      footnotes: false
      # Murray cues both messengers MESSENGER (his cast list says "TWO
      # MESSENGERS" but never distinguishes them in the text), so the
      # herdsman's and Pentheus' servant's speeches both canonicalize to
      # "Messenger" while the Greek splits into Messenger/Second Messenger
      # at 1024 (speakers.overrides). Without an anchor the second
      # messenger's stichomythia with the Chorus (1024-1042) and his death
      # report (1043ff) drift onto the wrong Greek turns (Codex review,
      # 2026-09-12). Two pins re-anchor the run; a run above 8 is capped
      # (_RUN_SWAP_WINDOW), so the 11-turn stretch takes two.
      pins:
        - { greek: "1024", english: "Woe to the house once blest in Hellas", run: 8 }
        - { greek: "1043", english: "We climbed beyond the utmost habitings", run: 1 }
  # gaps: Greek speeches with no English anchor of their own, no same-speaker
  # repair within 3 lines and no same-speaker covering block (residual after
  # P2d–P2g, sweep of 2026-09-08). Each is a real hole in the translator's
  # anchoring, not a builder failure.
  gaps:

