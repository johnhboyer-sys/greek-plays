  blurb: "Dionysus comes to Thebes to punish Pentheus for denying his divinity, and Pentheus's own mother tears him apart."
  production: "Produced posthumously at the City Dionysia, 405 BC, by Euripides the younger · first prize"
  argument: "Dionysus comes to Thebes, where Pentheus refuses to acknowledge the god and is torn apart by his own mother."
  synopsis: "Dionysus has come to Thebes as a young man to establish his worship in the city of his mother Semele, whose sisters deny that he is Zeus's son. The women of Thebes are already on the mountain in his rites. Pentheus, the young king, has the stranger arrested. The stranger, freed, talks him into going to the mountain dressed as a woman to spy on them. The women, his mother Agave first, tear him apart. Agave comes home carrying his head as a lion's, and her father Cadmus brings her back to herself. Dionysus appears, exiles Agave and her sisters, and tells Cadmus and his wife Harmonia they will become snakes."
